  "BO-BILL-04": [["구독 변경", "업그레이드는 바로 적용되고 남은 기간만큼 차액을 청구합니다. 다운그레이드와 결제 주기 변경은 다음 결제일부터 적용되며 그 전까지 취소할 수 있습니다."], ["과금 인원", "회원사 재직 인원으로 자동 계산되어 운영자가 바꾸지 않습니다."], ["사유", "변경할 때는 회원사 요청 문의 번호 같은 사유를 남깁니다."]],
  "BO-BILL-06": [["증빙 종류", "카드 결제는 PG가 발행하는 카드매출전표가 증빙입니다. 세금계산서는 발급하지 않습니다(부가가치세법 §33②) — 회원사는 카드매출전표로 매입세액공제를 받습니다."], ["재발송", "‘전표 보기’에서 회원사 관리자 이메일로 다시 보낼 수 있습니다. 세금계산서를 요청받으면 이 근거로 안내하세요."], ["환불 건", "환불하면 PG가 취소 전표를 자동 발행하고 ‘부분취소·전액취소’로 표시됩니다."]],
  "BO-BILL-07": [["조회", "회사·청구번호·승인번호로 찾고 귀속월·상태로 좁힙니다. 행을 누르면 PG 거래키까지 자세히 보입니다."], ["금액", "공급가·VAT·합계를 함께 보여주며 환불된 금액은 아래에 작게 표시됩니다."], ["환불", "결제 상세의 [환불 요청]으로 환불 관리 화면에서 요청을 이어서 등록합니다."]],
  "BO-BILL-08": [["미납 기준", "결제에 실패한 뒤 같은 달 결제가 아직 성공하지 않은 건입니다."], ["자동 처리", "실패일 다음 1·3·7일에 자동으로 다시 결제하고, 14일째 조회 전용으로 바꿉니다(로그인·조회·내려받기만 가능). 결제되면 바로 모든 기능이 다시 열립니다."], ["수동 처리", "[재결제]로 즉시 시도하고 [독촉]으로 안내를 보냅니다. 카드가 만료됐다면 회원 상세에서 결제 수단 변경 링크를 보내세요."]],
  "BO-BILL-09": [["요청", "결제가 완료된 건만, 남은 금액 이하로 요청할 수 있습니다. 결제 실패 건은 미납 관리에서 처리합니다."], ["승인", "요청한 운영자가 아닌 운영관리자·슈퍼관리자가 승인합니다. 승인하면 PG 취소가 실행되고 카드 취소 전표가 자동 발행됩니다."], ["반려", "반려할 때는 처리 의견을 꼭 남깁니다."]],
  "BO-BILL-11": [["기준", "매출은 결제 성공분(공급가), 환불은 승인 완료된 달, 미수는 결제 실패 후 아직 결제되지 않은 금액입니다."], ["확인 표시", "미수나 승인 대기 중인 환불이 있는 달은 ‘확인’에 표시되니 해당 화면에서 정리하세요."], ["전표", "[전표 내보내기]로 회계 입력용 파일을 받습니다."]],
  "BO-BILL-12": [["키 관리", "저장된 키는 끝 4자리만 보입니다. 바꿀 때만 새 키를 입력하고, 비워 두면 기존 키가 그대로 유지됩니다."], ["환경 분리", "운영(live)과 테스트(test) 키를 따로 저장하며, 환경과 키 종류가 다르면 저장되지 않습니다."], ["점검", "[연결 테스트]로 연동 상태를 확인합니다. 모든 변경은 감사 로그에 남습니다."]],
  "BO-SUP-01": [["처리 순서", "목록에서 문의를 고르고 담당자를 지정한 뒤, 정형답변을 참고해 답변을 보냅니다."], ["SLA", "첫 응답 목표는 우선순위 높음 4시간·보통 1일·낮음 2일입니다. 넘기면 빨간색으로 표시됩니다."], ["내부 메모", "‘내부 메모’에 체크하면 회원사에는 보이지 않고 운영자끼리만 봅니다."], ["회원사 화면", "보낸 답변은 회원사 1:1 문의(SET-09)에 바로 보이고 메일·알림톡으로 알려집니다."]],
  "BO-SUP-03": [["게시", "게시한 질문은 회원사 1:1 문의 화면 위쪽 ‘자주 묻는 질문’에 바로 보입니다."], ["순서·대상", "▲▼로 순서를 바꾸고, 특정 요금제 회원사에게만 보이게 할 수 있습니다."], ["보강", "조회가 많은데 문의가 계속 오는 항목은 답변을 더 자세히 고칩니다."]],
  "BO-SUP-04": [["게시", "게시 기간 안의 공지는 관리자 앱 홈 상단에 보이고, ‘중요’ 공지는 빨간 배너로 고정됩니다."], ["상태", "시작일이 미래면 예약, 기간 안이면 게시중, 종료일이 지나면 종료로 자동 바뀝니다. 임시저장은 회원사에 보이지 않습니다."], ["대상", "전체 또는 특정 요금제 회원사만 고를 수 있습니다."]],
  "BO-STAT-01": [["지표", "신규 가입·체험·유료 회원사와 해지율(해지 수 ÷ 전월 유료 회원사)을 봅니다."], ["활성률", "최근 30일 관리자 로그인 3회 이상인 회원사의 비율입니다."], ["해지 사유", "해지 신청에 적힌 사유별로 모아 보여줍니다."]],
  "BO-STAT-02": [["기준", "모든 금액은 공급가(VAT 별도)입니다. 월 반복 매출은 이용중·연체·해지예정 구독만 포함합니다(체험·정지 제외)."], ["확정 매출", "결제 성공 금액에서 승인 완료된 환불을 뺀 값입니다."], ["분포", "요금제별 합계는 월 반복 매출과 같습니다."]],
  "BO-STAT-03": [["사용량", "회원사별 최근 30일 기능 사용 건수입니다. 직원 개인 정보 같은 원문은 보지 않습니다."], ["판정", "로그인이 적으면 ‘저사용’, Starter가 아닌데 근태를 안 쓰면 ‘근태 미사용’으로 표시되어 CS 안내 대상이 됩니다."]],
  "BO-ADM-01": [["초대", "회사 이메일(@paydream.io)로만 초대할 수 있고, 첫 로그인 때 2FA 등록이 필수입니다."], ["관리", "역할 변경·잠금·해제·비밀번호 초기화는 슈퍼관리자만 할 수 있습니다. 본인 계정은 내 계정에서 관리합니다."], ["보호", "마지막 슈퍼관리자는 잠그거나 역할을 바꿀 수 없습니다."]],
  "BO-ADM-02": [["권한 단계", "R은 보기, W는 편집, X는 확정·처리입니다. 민감기능(대리 접속·환불·파기)은 ‘요청’과 ‘승인’으로 나뉩니다."], ["적용", "저장하면 운영 콘솔 버튼에 바로 적용됩니다. 권한이 없으면 버튼을 눌러도 처리되지 않습니다."], ["2인 원칙", "승인 권한이 있어도 본인이 요청한 건은 승인할 수 없습니다."]],
  "BO-ADM-03": [["기록 대상", "운영자의 모든 처리·민감정보 조회·대리 접속·설정 변경이 시간순으로 쌓입니다."], ["조회", "운영자·행위·날짜로 좁히고 내보낼 수 있으며, 내보낸 기록도 남습니다."], ["보존", "기록은 수정·삭제할 수 없고 5년간 보관됩니다."]],
  "BO-AUTH-01": [["로그인", "이메일·비밀번호 확인 뒤 OTP 6자리를 입력해야 들어갑니다."], ["잠금", "5번 연속 틀리면 계정이 잠기고, 슈퍼관리자가 풀어줘야 합니다."], ["접속 제한", "허용된 IP에서만 접속할 수 있고 8시간 뒤 다시 로그인합니다."]],
  "BO-ACC-01": [["비밀번호", "영문·숫자·특수문자를 섞어 12자 이상, 현재와 다르게 바꿉니다. 바꾸면 다른 세션은 끊깁니다."], ["알림", "결제 실패·SLA·해지 신청·환불 승인 요청 중 받을 알림을 고릅니다."], ["내 기록", "내가 처리한 최근 기록을 감사 로그에서 가져와 보여줍니다."]],
};
function UsageGuide({ id }){
  const g = BO_GUIDE[id]; if (!g) return null;
  return <div className="mx-5 mb-5 rounded-lg border border-gray-200 bg-white px-5 py-4 text-sm text-gray-600 shadow-sm"><p className="mb-2 font-semibold text-gray-800">이 화면 이용 안내</p><ul className="list-disc space-y-1.5 pl-5 text-[13px] leading-relaxed">{g.map(([b, t]) => <li key={b}><b>{b}</b> — {t}</li>)}</ul></div>;
}

function App(){
  const [cur,setCur]=useState("BO-DSH-01");
  const [arg,setArg]=useState(null);
  const [sel,setSel]=useState(TENANTS[0].name);
  const [toast,setToast]=useState("");
  const [, bump]=useState(0);
  const [open,setOpen]=useState({dash:true,cust:true,bill:true,cs:true,stat:true,adm:true});
  const flash=m=>{ setToast(m); setTimeout(()=>setToast(""),3200); bump(n=>n+1); };
  const go=(id,a)=>{ setArg(a||null); setCur(id); const el=document.querySelector("main"); if(el) el.scrollTop=0; };
  const openTenant=name=>{ setSel(name); go("BO-CMP-02"); };
  const V={ "BO-DSH-01":<Dashboard go={go} open={openTenant}/>, "BO-CMP-01":<TenantList open={openTenant}/>, "BO-CMP-02":<TenantDetail key={sel} sel={sel} go={go} flash={flash} open={openTenant}/>,
    "BO-CMP-08":<Terminate flash={flash} open={openTenant}/>, "BO-BILL-01":<PlansScreen flash={flash}/>, "BO-BILL-04":<SubList flash={flash} open={openTenant}/>,
    "BO-BILL-06":<Invoices flash={flash} open={openTenant}/>, "BO-BILL-07":<Payments open={openTenant} go={go}/>, "BO-BILL-08":<Overdue flash={flash} open={openTenant}/>,
    "BO-BILL-09":<Refunds key={arg?JSON.stringify(arg):"r"} flash={flash} open={openTenant} arg={arg}/>, "BO-BILL-11":<Settlement/>, "BO-BILL-12":<PGConfig flash={flash}/>,
    "BO-SUP-01":<SupportInbox flash={flash} open={openTenant}/>, "BO-SUP-03":<FaqScreen flash={flash}/>, "BO-SUP-04":<Notices flash={flash}/>,
    "BO-STAT-01":<GrowthStats/>, "BO-STAT-02":<RevenueStats/>, "BO-STAT-03":<UsageStats open={openTenant}/>,
    "BO-ADM-01":<OperatorAccounts flash={flash}/>, "BO-ADM-02":<RolePermissions flash={flash}/>, "BO-ADM-03":<AuditLog/>,
    "BO-SET-06":<HolidayMaster flash={flash}/>, "BO-SET-07":<RateMaster flash={flash}/>, "BO-AUTH-01":<AuthScreen go={go}/>, "BO-ACC-01":<MyAccount flash={flash}/> };
  return (
    <div className="flex h-screen flex-col">
      <header className="flex h-12 shrink-0 items-center gap-3 border-b border-gray-200 bg-white px-4">
        <button onClick={()=>go("BO-DSH-01")} className="text-lg font-extrabold tracking-tight text-blue-600">payDream</button>
        <span className="rounded bg-blue-600 px-1.5 py-0.5 text-[10px] font-bold text-white">운영 콘솔</span>
        <span className="hidden text-xs text-gray-400 md:inline">기준일 {BO_TODAY}</span>
        <div className="flex-1" />
        <label className="hidden items-center gap-1.5 text-xs text-gray-500 sm:flex" title="프로토타입 — 2인 승인·권한 시연용 운영자 전환">로그인 운영자
          <select value={BO.me} onChange={e=>{BO.me=e.target.value;audit("운영자 전환(시연)",e.target.value,"");bump(n=>n+1);}} className={INP+" bg-white py-1 text-xs"}>{OPERATORS.filter(o=>o.stat==="활성").map(o=><option key={o.name} value={o.name}>{o.name} · {o.role}</option>)}</select></label>
        <button onClick={()=>go("BO-ACC-01")} title="내 계정" className="flex h-8 w-8 items-center justify-center rounded-full bg-blue-600 text-sm font-semibold text-white">{BO.me[0]}</button>
        <button onClick={()=>{audit("로그아웃",BO.me,"");go("BO-AUTH-01");}} className="text-xs text-gray-500 hover:underline">로그아웃</button>
      </header>
      <div className="flex min-h-0 flex-1">
        <nav className="w-56 shrink-0 overflow-y-auto border-r border-gray-200 bg-white py-2">
          {NAV.map(g=>(
            <div key={g.key} className="px-2">
              <button onClick={()=>setOpen(o=>({...o,[g.key]:!o[g.key]}))} className="flex w-full items-center gap-2 rounded-md px-3 py-2 text-sm font-semibold text-gray-700 hover:bg-gray-50">
                <Ic cls="h-4 w-4 text-gray-400" d={g.icon} />{g.label}<span className="ml-auto text-xs text-gray-300">{open[g.key]?"▾":"▸"}</span>
              </button>
              {open[g.key] && <div className="mb-1 ml-4 border-l border-gray-100 pl-2">
                {g.items.map(([id,nm])=>{ const bd=BADGE[id]?BADGE[id]():{n:0}, n=bd.n; return (
                  <button key={id} onClick={()=>go(id)} className={"flex w-full items-center gap-1.5 rounded-md px-2.5 py-1.5 text-left text-sm "+(cur===id||(cur==="BO-CMP-02"&&id==="BO-CMP-01")?"bg-blue-50 font-medium text-blue-700":"text-gray-600 hover:bg-gray-50")}>
                    {nm}{n>0&&<span title={bd.tip} className={"ml-auto rounded-full px-1.5 text-[10px] font-bold "+(bd.hot?"bg-red-500 text-white":"bg-gray-200 text-gray-600")}>{n}</span>}
                  </button>); })}
              </div>}
            </div>
          ))}
        </nav>
        <main className="min-w-0 flex-1 overflow-y-auto">{V[cur]}<UsageGuide id={cur} /></main>
      </div>
      <Toast msg={toast} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
