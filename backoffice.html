              <div className="flex flex-wrap items-center gap-4">
                <div className="flex items-center gap-3 rounded-md border border-gray-200 bg-slate-50/60 px-4 py-3"><span className="flex h-8 w-12 items-center justify-center rounded bg-blue-600 text-[10px] font-bold text-white">CARD</span>

            <Card title={"결제 내역 · "+pays.length+"건"} right={<button onClick={()=>go("BO-BILL-07")} className="text-xs text-blue-600 hover:underline">결제 내역 →</button>} pad={false}>
              <Table min="560px" cols={[{t:"청구번호"},{t:"결제일시"},{t:"합계(VAT 포함)",r:1},{t:"상태",c:1},{t:"카드매출전표",c:1}]} rows={pays.slice(0,6)} empty="결제 내역이 없습니다." render={r=><>
                <Td cls="font-mono text-xs text-gray-700">{r.inv}</Td><Td cls="text-gray-500">{r.at}</Td><Td r cls="font-mono">{r.stat==="실패"?<span className="text-red-500">{won(billed(r))} 미수</span>:won(r.total)}{r.refunded>0&&<span className="block text-[11px] text-gray-400">환불 {won(r.refunded)}</span>}</Td><Td c><StatusBadge s={r.stat} /></Td><Td c><SlipBadge p={r} /></Td></>} />
            </Card>
          </div>
        </section>
        <section id="sec-use" className="scroll-mt-14"><h3 className="mb-2 text-sm font-semibold text-gray-700">사용량 (최근 30일 집계)</h3>

            <Card title="과금 인원"><p className="text-2xl font-bold text-blue-600">{t.seats}명</p><div className="mt-2 h-2 rounded bg-gray-100"><div className={"h-2 rounded "+(pct>90?"bg-amber-500":"bg-blue-600")} style={{width:Math.min(100,pct)+"%"}} /></div><p className="mt-1 text-xs text-gray-400">{t.plan} 상한 {p.max}명의 {pct}%{pct>90&&" — 상위 요금제 안내 대상"}</p></Card>
            <Card title="기능 사용"><ul className="space-y-1 text-sm text-gray-600"><li>급여 계산 {t.usage.runs}회</li><li>근태 기록 {t.usage.att}건</li><li>전자결재 {t.usage.apv}건</li><li>관리자 로그인 {t.usage.login30}회</li></ul></Card>
            <Card title="저장용량"><p className="text-2xl font-bold text-gray-800">{t.usage.storage}<span className="text-sm">/5GB</span></p><div className="mt-2 h-2 rounded bg-gray-100"><div className="h-2 rounded bg-emerald-500" style={{width:t.usage.storage/5*100+"%"}} /></div></Card>
          </div>
          <Note tone="slate"><b>개인정보 보호</b> — 운영자는 회원사 데이터 처리 수탁자로서 인원·사용량 집계만 봅니다. 개별 직원 정보가 필요하면 대리 접속(사유·30분·기록)으로 최소 범위만 확인합니다.</Note>
        </section>
        <section id="sec-mgr" className="scroll-mt-14"><h3 className="mb-2 text-sm font-semibold text-gray-700">담당자</h3>
          <Card title="회원사 관리자 계정" pad={false}><Table min="420px" cols={[{t:"이름"},{t:"역할"},{t:"연락처(마스킹)"},{t:"최근 접속"}]} rows={t.contacts} render={r=><><Td cls="font-medium text-gray-800">{r[0]}</Td><Td><Badge tone="blue">{r[1]}</Badge></Td><Td cls="text-gray-600">{r[2]}</Td><Td cls="text-gray-500">{r[3]}</Td></>} /></Card>
          {IMPERSONATIONS.filter(x=>x.co===t.name).length>0 && <p className="mt-2 text-xs text-gray-500">대리 접속 이력: {IMPERSONATIONS.filter(x=>x.co===t.name).map(x=>x.at+" "+x.by+"("+x.reason+")").join(" · ")}</p>}
        </section>
        <section id="sec-tkt" className="scroll-mt-14"><h3 className="mb-2 text-sm font-semibold text-gray-700">문의 이력</h3>
          <Card title={"1:1 문의 · "+tks.length+"건"} right={<button onClick={()=>go("BO-SUP-01")} className="text-xs font-medium text-blue-600 hover:underline">문의함 →</button>} pad={false}>
            <Table min="560px" cols={[{t:"문의"},{t:"최근 답변"},{t:"담당",c:1},{t:"상태",c:1}]} rows={tks} empty="문의가 없습니다." render={r=>{const a=[...r.msgs].reverse().find(m=>m.who==="상담원");return <>
              <Td><p className="font-medium text-gray-800">{r.title}</p><p className="text-xs text-gray-400">{r.no} · {r.at.slice(0,10)}</p></Td><Td cls="text-xs text-gray-600">{a?a.text.slice(0,40)+"…":"–"}</Td><Td c cls="text-gray-600">{r.owner||"미배정"}</Td><Td c><StatusBadge s={r.stat} /></Td></>;}} />
          </Card>
        </section>
        <section id="sec-memo" className="scroll-mt-14"><h3 className="mb-2 text-sm font-semibold text-gray-700">운영 메모</h3>
          <Card title="운영 메모·태그"><div className="mb-3 flex gap-2">{["VIP","이탈위험","프로모션"].map(x=><button key={x} onClick={()=>{t.tags=t.tags.includes(x)?t.tags.filter(y=>y!==x):[...t.tags,x];audit("태그 변경",t.name,x+(t.tags.includes(x)?" 추가":" 제거"));re();}} className={"rounded px-2 py-0.5 text-xs font-medium "+(t.tags.includes(x)?"bg-blue-600 text-white":"border border-gray-300 text-gray-500")}>{x}</button>)}</div>
            <textarea value={memo} onChange={e=>setMemo(e.target.value)} className={INP+" w-full"} rows="3" placeholder="운영 메모(회원사 비노출)" /><div className="mt-2 flex justify-end"><Btn disabled={memo===t.memo} onClick={()=>{t.memo=memo;audit("운영 메모",t.name,"저장");re();flash("메모를 저장했습니다.");}}>저장</Btn></div></Card>
        </section>
      </div>
      {modal==="paymethod" && <Modal title="결제 수단 변경 링크 발송" badge="BO-CMP-02-M1" onClose={()=>setModal(null)}
        footer={<><Btn tone="ghost" onClick={()=>setModal(null)}>취소</Btn><Btn onClick={()=>{audit("결제 수단 변경 링크 발송",t.name,"최고관리자 "+t.contacts[0][0]);setModal(null);flash("결제 수단 변경 링크를 "+t.contacts[0][0]+"님에게 보냈습니다(24시간 유효).");}}>링크 발송</Btn></>}>
        <div className="rounded-md border-l-4 border-amber-400 bg-amber-50 px-3 py-2 text-xs text-amber-700">운영자는 카드 정보를 입력하지 않습니다. 회원사 관리자에게 결제 수단 관리(SET-07) 링크를 보내 본인이 PG 결제창에서 등록하게 합니다.</div>
        <Field label="현재 수단"><input readOnly value={t.card.brand+" ****-"+t.card.last4+" · 유효 "+t.card.exp} className={INP+" w-full bg-gray-50"} /></Field>
        <Field label="받는 사람"><input readOnly value={t.contacts[0][0]+" (최고관리자) · "+t.email} className={INP+" w-full bg-gray-50"} /></Field>
      </Modal>}
      {modal==="status" && <StatusModal t={t} onClose={()=>setModal(null)} flash={flash} go={go} re={re} />}
      {modal==="impersonate" && <Modal title="대리 접속" badge="BO-CMP-05" onClose={()=>setModal(null)}
        footer={<><Btn tone="ghost" onClick={()=>setModal(null)}>취소</Btn><Btn tone="danger" disabled={!imp.reason.trim()||!can("민감기능(대리접속·환불·파기)","요청")} onClick={startImp}>대리 접속 시작</Btn></>}>
        {!can("민감기능(대리접속·환불·파기)","요청") && <NoPerm menu="민감기능" />}
        <Field label="대상"><input readOnly value={t.name+" · "+t.contacts[0][0]+"(최고관리자)"} className={INP+" w-full bg-gray-50"} /></Field>
        <Field label="접속 사유" req hint="문의 번호를 함께 적어 주세요"><input value={imp.reason} onChange={e=>setImp({...imp,reason:e.target.value})} placeholder={(tks[0]||{}).no?tks[0].no+" 확인":"예: 급여 계산 오류 확인"} className={INP+" w-full"} /></Field>
        <label className="flex items-center gap-2 text-gray-700"><input type="checkbox" checked={imp.ro} onChange={e=>setImp({...imp,ro:e.target.checked})} className="h-4 w-4 rounded border-gray-300" />읽기 전용 (해제 시 쓰기 허용 — 회원사 요청 문의가 있을 때만)</label>
        <div className="rounded-md border-l-4 border-red-400 bg-red-50 px-3 py-2 text-xs text-red-700">30분 뒤 자동 만료. 모든 행위가 감사 로그(BO-ADM-03)와 회원사 접속 기록(HR-06-01)에 남습니다.</div>
      </Modal>}
    </div>
  );
}
// 상태 전환(BO-CMP-04-M1) — 체험→유료(결제수단 필요) · 유료→정지 · 정지→유료(복구: 미납 해소 또는 사유) · 해지는 해지·탈퇴(BO-CMP-08)
function StatusModal({ t, onClose, flash, go, re }){
  const NEXT={체험:["유료"],유료:["정지"],정지:["유료"],해지:[]}[t.svc]||[];
  const [to,setTo]=useState(NEXT[0]||""); const [why,setWhy]=useState(""); const [eff,setEff]=useState(BO_TODAY);
  const owe=unpaid().filter(p=>p.co===t.name);
  const err=!to?"이 상태에서는 전환할 수 없습니다 — 해지는 해지·탈퇴(BO-CMP-08)에서 처리합니다.":!why.trim()?"사유를 입력하세요(감사 로그).":eff<BO_TODAY?"효력일은 오늘 이후여야 합니다.":to==="유료"&&t.svc==="체험"&&!t.card?"결제 수단이 없어 유료로 바꿀 수 없습니다.":!can("회원 관리","X")?"권한이 없습니다.":"";
  const warn=to==="유료"&&t.svc==="정지"&&owe.length?"미납 "+won(owe.reduce((a,p)=>a+billed(p),0))+"원이 남아 있습니다 — 복구해도 미납은 유지되고 다음 재시도에 청구됩니다.":"";
  const save=()=>{ if(err) return; const before=t.svc; t.svc=to; t.sub=to==="정지"?"정지":to==="유료"?(owe.length?"연체":"이용중"):t.sub; if(before==="체험"&&to==="유료") t.trialEnd=eff;
    t.hist.unshift({at:nowTs(),by:BO.me,what:"상태 "+before+" → "+to+" (효력 "+eff+") — "+why.trim()}); audit("상태 전환",t.name,before+" → "+to+" · "+why.trim()); onClose(); re(); flash(t.name+" 상태를 ‘"+to+"’(으)로 바꿨습니다."+(to==="정지"?" 회원사는 조회 전용으로 바뀌고(로그인·내려받기 가능) 데이터는 보존됩니다.":"")); };
  return <Modal title="상태 전환" badge="BO-CMP-04-M1" onClose={onClose}
    footer={<><Btn tone="ghost" onClick={onClose}>취소</Btn>{t.svc!=="해지"&&<Btn tone="ghost" onClick={()=>{onClose();go("BO-CMP-08");}}>해지 처리로 →</Btn>}<Btn tone="danger" disabled={!!err} onClick={save}>전환 확정</Btn></>}>
    <div className="flex items-center gap-2 text-sm"><span className="text-gray-500">현재</span><StatusBadge s={t.svc} />{to&&<><span className="text-gray-400">→</span><StatusBadge s={to} /></>}</div>
    {NEXT.length>0&&<Field label="전환 상태" req><select value={to} onChange={e=>setTo(e.target.value)} className={INP+" w-full bg-white"}>{NEXT.map(o=><option key={o}>{o}</option>)}</select></Field>}
    <div className="grid grid-cols-2 gap-3"><Field label="사유" req><input value={why} onChange={e=>setWhy(e.target.value)} placeholder="예: 미납 해소 확인" className={INP+" w-full"} /></Field><Field label="효력일" req><input type="date" value={eff} min={BO_TODAY} onChange={e=>setEff(e.target.value)} className={INP+" w-full"} /></Field></div>
    <p className="text-xs text-gray-500">{to==="정지"?"정지 = 조회 전용(로그인·조회·내려받기 가능, 급여 계산·확정·명세서 발송·신청 불가) · 자동결제 중단 · 데이터 보존":to==="유료"?"유료: 모든 기능·자동결제 재개":""}</p>
    {warn && <p className="rounded-md bg-amber-50 px-3 py-2 text-xs text-amber-700">{warn}</p>}<Err m={err} />
  </Modal>;
}

// ═══ 해지·탈퇴(BO-CMP-08) — 관리자 앱 SET-05 신청 대기열 · 승인(해지 확정) · 완료 · 파기 2인 승인 ═══
function Terminate({ flash, open }){
  const re=useTick();
  const [selId,setSelId]=useState(CANCELS[0]&&CANCELS[0].id);
  const [purge,setPurge]=useState(null); const [cmt,setCmt]=useState("");
  const c=CANCELS.find(x=>x.id===selId)||CANCELS[0]; const t=c&&tOf(c.co);
  const lastPay=c&&PAYMENTS.filter(p=>p.co===c.co&&p.stat==="결제완료").slice(-1)[0];
  const log=(what)=>c.log.unshift({at:nowTs(),by:BO.me,what});
  const approve=()=>{ if(!can("회원 관리","X")) return flash("권한이 없습니다."); c.status="승인"; c.procBy=BO.me; c.procAt=nowTs(); if(t){ t.sub="해지예정"; t.hist.unshift({at:nowTs(),by:BO.me,what:"해지 신청 승인 — "+c.date+" 해지 확정(자동결제 중단)"}); } log("접수·승인(해지 확정 "+c.date+" · 자동결제 중단)"); audit("해지 승인",c.co,"해지일 "+c.date+" · "+c.dp); re(); flash(c.co+" 해지를 승인했습니다 — "+c.date+"에 해지되고 그 뒤 "+c.keep+"일 보존 후 파기됩니다."); };
  const complete=()=>{ c.status="완료"; c.purgeDue=dAdd(c.date,c.keep); c.purge={req:null,appr:[]}; if(t){ t.svc="해지"; t.sub="해지"; t.hist.unshift({at:nowTs(),by:BO.me,what:"해지 완료 · 보존 "+c.keep+"일(파기 예정 "+c.purgeDue+")"}); } log("해지 완료 · 파기 예정 "+c.purgeDue); audit("해지 완료",c.co,"파기 예정 "+c.purgeDue); re(); flash(c.co+" 해지를 완료했습니다."); };
  const exportDone=()=>{ c.exportDone=true; log("데이터 내보내기(백업) 파일 전달 완료"); audit("백업 전달",c.co,"내보내기 완료"); re(); flash("백업 전달을 기록했습니다."); };
  const reqPurge=()=>{ if(cmt!=="파기확인") return; c.purge={req:BO.me,at:nowTs(),appr:[]}; log("파기 실행 요청(2인 승인 대기)"); audit("파기 요청",c.co,"2인 승인 대기","승인대기"); setPurge(null); setCmt(""); re(); flash("파기 실행을 요청했습니다 — 요청자가 아닌 운영자 2명의 승인이 필요합니다."); };
  const apprPurge=()=>{ if(!can("민감기능(대리접속·환불·파기)","승인")) return flash("파기 승인 권한이 없습니다(운영관리자·슈퍼관리자)."); if(c.purge.req===BO.me||c.purge.appr.includes(BO.me)) return flash("요청자 본인이거나 이미 승인했습니다 — 다른 운영자로 승인하세요(헤더에서 운영자 전환)."); c.purge.appr.push(BO.me); log("파기 승인 "+c.purge.appr.length+"/2"); audit("파기 승인",c.co,c.purge.appr.length+"/2");
    if(c.purge.appr.length>=2){ c.purgedAt=nowTs(); log("파기 실행 완료 — 파기 이력 영구 보존"); audit("파기 실행",c.co,"회원사 데이터 전체 파기(이력 보존)"); } re(); flash(c.purge.appr.length>=2?"2인 승인 완료 — 파기를 실행했습니다.":"승인했습니다(1/2)."); };
  return (
    <div className="p-5">
      <ScrHead id="BO-CMP-08" title="해지·탈퇴 처리" pri="P0" path="회원 관리 > 회원사" desc="회원사가 서비스 해지 신청(SET-05)에서 제출한 신청을 접수·승인하고, 해지일 도래 시 완료 처리합니다. 데이터는 보존기간 뒤 2인 승인으로 파기합니다. 잔여기간 환불은 정책 미정(약관상 해지일까지 이용)." />
      <div className="grid gap-4 lg:grid-cols-[320px_1fr]">

        {c && <div className="space-y-4">

            <dl className="grid gap-2 text-sm sm:grid-cols-2">{[["신청자",c.by+" · "+c.at],["사유",c.reason],["해지 희망일",c.date],["데이터 처리",c.dp+(c.dp==="보존 후 파기"?" · "+c.keep+"일":"")],["백업(내보내기) 요청",c.backup?(c.exportDone?"요청 · 전달 완료":"요청 · 전달 전"):"요청 안 함"],["처리",c.procBy?c.procBy+" · "+c.procAt:"–"]].map(([k,v])=><div key={k} className="flex justify-between gap-3"><dt className="text-gray-500">{k}</dt><dd className="text-right font-medium text-gray-700">{v}</dd></div>)}</dl>
            <div className="mt-3 whitespace-pre-line rounded-md border border-gray-200 bg-slate-50/60 px-3 py-2 text-sm text-gray-700">{c.detail}</div>
            {t && <p className="mt-2 text-xs text-gray-500">구독 {t.plan} · 다음 결제일 {t.nextBill} · 마지막 결제 {lastPay?lastPay.inv+" "+won(lastPay.total)+"원":"–"} — 해지 확정 시 다음 결제부터 청구하지 않습니다.</p>}
          </Card>
          <Card title="처리">
            {c.status==="신청" && <div className="flex flex-wrap items-center gap-2"><Btn onClick={approve}>접수·해지 승인</Btn>{c.backup&&!c.exportDone&&<Btn tone="ghost" onClick={exportDone}>백업 전달 완료</Btn>}<span className="text-xs text-gray-500">승인 전에는 회원사가 철회할 수 있습니다.</span></div>}
            {c.status==="승인" && <div className="flex flex-wrap items-center gap-2"><Btn disabled={c.date>BO_TODAY} onClick={complete}>해지 완료 처리</Btn>{c.backup&&!c.exportDone&&<Btn tone="ghost" onClick={exportDone}>백업 전달 완료</Btn>}<span className="text-xs text-gray-500">{c.date>BO_TODAY?"해지일("+c.date+") 이후에 완료할 수 있습니다(배치 자동 처리).":"해지일이 지났습니다."}</span></div>}
            {c.status==="철회" && <p className="text-sm text-gray-500">회원사가 신청을 철회했습니다.</p>}
            {c.status==="완료" && (c.purgedAt?<p className="text-sm text-gray-600">파기 완료 · {c.purgedAt} — 파기 이력은 영구 보존됩니다.</p>:
              <div className="space-y-2 text-sm"><p className="text-gray-600">보존 중 · 파기 예정 <b>{c.purgeDue}</b> {c.purgeDue>BO_TODAY&&"(D-"+dDiff(c.purgeDue,BO_TODAY)+")"}</p>
                {!c.purge.req?<Btn tone="danger" disabled={c.purgeDue>BO_TODAY&&c.dp==="보존 후 파기"} onClick={()=>setPurge(true)}>파기 실행 요청</Btn>
                  :<div className="flex flex-wrap items-center gap-2"><span className="text-xs text-gray-500">요청 {c.purge.req} · 승인 {c.purge.appr.join(", ")||"없음"} ({c.purge.appr.length}/2)</span><Btn tone="danger" onClick={apprPurge}>파기 승인</Btn></div>}
                {c.purgeDue>BO_TODAY&&<p className="text-xs text-gray-400">보존기간이 끝난 뒤에 파기할 수 있습니다.</p>}</div>)}

          </Card>
          <Note tone="amber"><b>환불</b> — 잔여기간 환불 정책은 미정입니다. 회원사는 해지일까지 이용하고, 예외 환불은 환불 관리(BO-BILL-09)에서 요청·승인합니다.</Note>
        </div>}
      </div>
      {purge && <Modal title="데이터 파기 실행 요청" badge="BO-CMP-08-M1" onClose={()=>setPurge(null)} footer={<><Btn tone="ghost" onClick={()=>setPurge(null)}>취소</Btn><Btn tone="danger" disabled={cmt!=="파기확인"} onClick={reqPurge}>요청</Btn></>}>
        <div className="rounded-md border-l-4 border-red-400 bg-red-50 px-3 py-2 text-xs text-red-700">되돌릴 수 없습니다. {c.co}의 전체 데이터가 영구 삭제됩니다. 임금대장(3년) 등 법정 보존 의무는 회원사에 있어 해지 전 백업 전달을 안내합니다. 요청자를 뺀 운영자 2명이 승인해야 실행됩니다.</div>

}


// ═══ 요금제(BO-BILL-01) — 구조화 마스터 · 수정 = 새 버전(시행일부터 신규·변경 구독에 적용, 기존 구독 소급 없음) ═══
function PlansScreen({ flash }){
  const re=useTick();
  const [m,setM]=useState(null); // {code, min,max,base,seat,feat,pub,from, isNew}
  const cur=[...new Set(PLANS.map(p=>p.code))].map(planCur);
  const subs=code=>TENANTS.filter(t=>t.plan===code&&t.sub!=="해지");
  const n=v=>Number(String(v).replace(/[^\d]/g,""))||0;
  const err=!m?"":!/^[A-Za-z][A-Za-z0-9 ]{1,19}$/.test(m.code)?"플랜 코드는 영문으로 시작하는 2~20자입니다.":m.isNew&&PLANS.some(p=>p.code===m.code)?"이미 있는 플랜 코드입니다.":n(m.min)<1||n(m.max)<n(m.min)?"대상 인원 하한·상한을 확인하세요.":m.pub&&cur.some(p=>p.code!==m.code&&p.pub&&!(n(m.max)<p.min||n(m.min)>p.max))?"공개 플랜끼리 대상 인원 구간이 겹칩니다.":n(m.base)<=0?"기본 월 요금을 입력하세요.":m.from<BO_TODAY?"시행일은 오늘 이후여야 합니다.":!can("구독·결제","W")?"요금제 편집 권한이 없습니다.":"";
  const save=()=>{ if(err) return; const prev=m.isNew?null:planCur(m.code), ver=prev?prev.ver+1:1;
    PLANS.push({code:m.code,ver,min:n(m.min),max:n(m.max),base:n(m.base),seat:n(m.seat),feat:m.feat.trim(),pub:m.pub,from:m.from});
    PLAN_LOG.unshift({at:nowTs(),by:BO.me,what:m.code+" v"+ver+(prev?" (v"+prev.ver+"에서 변경)":" 신설")+" · "+planText({base:n(m.base),seat:n(m.seat)})+" · 시행 "+m.from});
    audit("요금제 저장",m.code+" v"+ver,planText({base:n(m.base),seat:n(m.seat)})+" · "+n(m.min)+"~"+n(m.max)+"인 · 시행 "+m.from); setM(null); re(); flash(m.code+" v"+ver+"를 저장했습니다 — "+m.from+"부터 신규·변경 구독에 적용되고 기존 구독은 계약 버전을 유지합니다."); };
  return (
    <div className="p-5">
      <ScrHead id="BO-BILL-01" title="요금제(플랜) 관리" pri="P0" path="구독·결제 > 요금제" desc="플랜별 대상 인원·기본료·인당 단가(VAT 별도)·포함 기능을 정의합니다. 관리자 앱 구독·이용요금제(SET-06)가 이 값을 그대로 씁니다. 수정하면 버전이 올라가고 기존 구독은 계약 버전을 유지합니다. 연 결제는 10% 할인." />
      <div className="mb-3 flex justify-end"><Btn onClick={()=>setM({code:"",min:"",max:"",base:"",seat:"0",feat:"",pub:true,from:dAdd(BO_TODAY,1),isNew:true})}>+ 플랜 추가</Btn></div>
      <div className="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
        {cur.map(p=>{ const s=subs(p.code), mrr=s.reduce((a,t)=>a+mrrOf(t),0); return (
          <div key={p.code} className="flex flex-col rounded-lg border border-gray-200 bg-white p-5 shadow-sm">
            <div className="flex items-center justify-between"><p className="text-base font-bold text-gray-800">{p.code} <span className="text-xs font-normal text-gray-400">v{p.ver}</span></p>{p.pub?<Badge tone="emerald">공개</Badge>:<Badge tone="slate">비공개</Badge>}</div>
            <p className="mt-1 text-xs text-gray-400">대상 {p.min}~{p.max}인 · 시행 {p.from}{p.from>BO_TODAY&&" (예정)"}</p>
            <p className="mt-2 text-lg font-bold text-blue-600">{planText(p)}<span className="text-xs font-normal text-gray-400"> / 월 · VAT 별도</span></p>
            <p className="text-xs text-gray-500">예) {p.min+Math.round((p.max-p.min)/3)}인 월 {won(p.base+p.seat*(p.min+Math.round((p.max-p.min)/3)))}원 · 연 결제 {won(Math.round((p.base+p.seat*(p.min+Math.round((p.max-p.min)/3)))*12*(1-ANNUAL_DC)))}원</p>
            <p className="mt-2 flex-1 text-xs text-gray-500">{p.feat}</p>
            <p className="mt-2 text-xs text-gray-500">구독 {s.length}개사 · 월 반복 매출 {won(mrr)}원</p>
            <button onClick={()=>setM({code:p.code,min:p.min,max:p.max,base:p.base,seat:p.seat,feat:p.feat,pub:p.pub,from:dAdd(BO_TODAY,1)})} className="mt-3 w-full rounded-md border border-gray-300 py-1.5 text-xs text-gray-600 hover:bg-gray-50">새 버전으로 수정</button>
          </div>); })}
      </div>
      <div className="mt-4"><Card title="버전 이력" pad={false}><Table min="560px" cols={[{t:"플랜"},{t:"요금"},{t:"대상"},{t:"시행일"},{t:"구독(계약 버전)",c:1}]} rows={PLANS.slice().sort((a,b)=>a.code.localeCompare(b.code)||b.ver-a.ver)} render={p=><>
        <Td cls="font-medium text-gray-800">{p.code} v{p.ver}</Td><Td cls="text-gray-600">{planText(p)}</Td><Td cls="text-gray-500">{p.min}~{p.max}인</Td><Td cls="text-gray-500">{p.from}</Td><Td c cls="text-gray-600">{TENANTS.filter(t=>t.plan===p.code&&t.ver===p.ver&&t.sub!=="해지").length}개사</Td></>} />
        <ul className="space-y-1 px-5 py-3 text-xs text-gray-500">{PLAN_LOG.slice(0,5).map((l,i)=><li key={i}>{l.at} · {l.by} · {l.what}</li>)}</ul></Card></div>
      {m && <Modal title={m.isNew?"플랜 추가":m.code+" 새 버전"} badge="BO-BILL-01-M1" onClose={()=>setM(null)} wide footer={<><Btn tone="ghost" onClick={()=>setM(null)}>취소</Btn><Btn disabled={!!err} onClick={save}>저장(버전 {m.isNew?1:planCur(m.code).ver+1})</Btn></>}>
        <div className="grid grid-cols-2 gap-3">
          <Field label="플랜 코드" req><input value={m.code} disabled={!m.isNew} onChange={e=>setM({...m,code:e.target.value})} placeholder="예: Enterprise" className={INP+" w-full"} /></Field>
          <Field label="공개 여부"><select value={m.pub?"공개":"비공개"} onChange={e=>setM({...m,pub:e.target.value==="공개"})} className={INP+" w-full bg-white"}><option>공개</option><option>비공개</option></select></Field>
          <Field label="대상 인원 하한" req><input value={m.min} onChange={e=>setM({...m,min:e.target.value})} className={INP+" w-full text-right"} /></Field>
          <Field label="대상 인원 상한" req hint="과금 인원이 상한을 넘으면 회원사가 선택할 수 없음"><input value={m.max} onChange={e=>setM({...m,max:e.target.value})} className={INP+" w-full text-right"} /></Field>
          <Field label="기본 월 요금(원, VAT 별도)" req><input value={m.base} onChange={e=>setM({...m,base:e.target.value})} className={INP+" w-full text-right"} /></Field>
          <Field label="인당 월 요금(원, VAT 별도)" hint="0 = 정액"><input value={m.seat} onChange={e=>setM({...m,seat:e.target.value})} className={INP+" w-full text-right"} /></Field>
          <Field label="시행일" req><input type="date" value={m.from} min={BO_TODAY} onChange={e=>setM({...m,from:e.target.value})} className={INP+" w-full"} /></Field>
        </div>
        <Field label="포함 기능"><textarea rows="2" value={m.feat} onChange={e=>setM({...m,feat:e.target.value})} className={INP+" w-full"} /></Field>
        {!err && <p className="text-xs text-gray-500">미리보기: {planText({base:n(m.base),seat:n(m.seat)})} · {n(m.max)}인이면 월 {won(n(m.base)+n(m.seat)*n(m.max))}원(VAT 별도)</p>}
        <Err m={err} />
      </Modal>}
    </div>
  );
}

// ═══ 구독 목록(BO-BILL-04) + 구독 변경(BO-BILL-05-M1) ═══
function SubList({ flash, open }){
  const re=useTick();
  const [st,setSt]=useState("전체"); const [pl,setPl]=useState("전체"); const [m,setM]=useState(null);
  const rows=TENANTS.filter(t=>(st==="전체"||t.sub===st)&&(pl==="전체"||t.plan===pl));
  return (
    <div className="p-5">
      <ScrHead id="BO-BILL-04" title="구독 목록" pri="P0" path="구독·결제 > 구독" desc="회원사×플랜×주기×상태를 조회하고 구독을 변경합니다. 과금 인원은 회원사 급여 대상 재직 인원으로 자동 계산되며 운영자가 바꾸지 않습니다. 업그레이드는 즉시(일할 차액 청구), 다운그레이드·결제 주기 변경은 다음 결제일부터." />
      <Card pad={false}>
        <div className="flex flex-wrap items-center gap-2 border-b border-gray-100 px-4 py-3">
          <Sel value={st} onChange={setSt} opts={["전체","체험","이용중","연체","정지","해지예정","해지"]} label="상태" />
          <Sel value={pl} onChange={setPl} opts={["전체",...new Set(PLANS.map(p=>p.code))]} label="플랜" />
          <Btn tone="ghost" onClick={()=>csv("구독목록_"+BO_TODAY+".csv",["회사명","플랜","버전","주기","과금 인원","상태","다음 결제일","공급가","VAT","합계"],rows.map(t=>{const f=fee(t.plan,t.ver,t.seats,t.cycle);return [t.name,t.plan,t.ver,t.cycle,t.seats,t.sub,t.nextBill,f.supply,f.vat,f.total];}))}>엑셀</Btn>
        </div>
        <Table min="900px" cols={[{t:"회사명"},{t:"플랜"},{t:"주기",c:1},{t:"과금 인원",c:1},{t:"상태",c:1},{t:"다음 결제일"},{t:"청구액(VAT 포함)",r:1},{t:""}]} rows={rows} render={t=>{const f=fee(t.plan,t.ver,t.seats,t.cycle);return <>
          <Td><button onClick={()=>open(t.name)} className="font-medium text-blue-700 hover:underline">{t.name}</button></Td><Td cls="text-gray-600">{t.plan} v{t.ver}{t.pending&&<span className="block text-[11px] text-amber-600">예약: {t.pending.plan} {t.pending.cycle} · {t.pending.at}</span>}</Td><Td c cls="text-gray-500">{t.cycle}</Td>
          <Td c cls="text-gray-600">{t.seats}명</Td><Td c><StatusBadge s={t.sub} /></Td><Td cls="text-gray-500">{t.sub==="해지"?"–":t.nextBill}</Td>
          <Td r cls="font-mono">{t.sub==="체험"?<span className="text-gray-400">체험(첫 결제 {t.nextBill.slice(5)})</span>:t.sub==="해지"?"–":won(f.total)}<span className="block text-[11px] text-gray-400">공급가 {won(f.supply)}</span></Td>
          <Td c>{!["해지","정지"].includes(t.sub)&&<button onClick={()=>setM({t,plan:t.plan,cycle:t.cycle,why:""})} className="text-xs font-medium text-blue-600 hover:underline">변경</button>}</Td></>;}} />
      </Card>
      {m && <SubChange m={m} setM={setM} onClose={()=>setM(null)} flash={flash} re={re} />}
    </div>
  );
}
function SubChange({ m, setM, onClose, flash, re }){
  const t=m.t, cur=fee(t.plan,t.ver,t.seats,t.cycle), np=planCur(m.plan), nf=fee(m.plan,np.ver,t.seats,m.cycle);
  const rank=c=>["Starter","Basic","Pro"].indexOf(c);
  const up=rank(m.plan)>rank(t.plan); // 주기 변경은 다음 결제일부터(새 주기 청구)
  const days=dDiff(t.nextBill,BO_TODAY), cyc=t.cycle==="연"?365:dDiff(t.nextBill,mAdd(t.nextBill.slice(0,7),-1)+t.nextBill.slice(7));
  const pro=up&&t.sub!=="체험"?Math.max(0,Math.round((nf.supply/(m.cycle==="연"?365:cyc)-cur.supply/cyc)*days)):0;
  const same=m.plan===t.plan&&m.cycle===t.cycle;
  const err=same?"변경 내용이 없습니다.":t.seats>np.max||t.seats<np.min?m.plan+"은 "+np.min+"~"+np.max+"인 대상입니다(과금 인원 "+t.seats+"명).":!m.why.trim()?"사유를 입력하세요(회원사 요청 문의 번호 등).":!can("구독·결제","W")?"구독 변경 권한이 없습니다.":"";
  const apply=()=>{ if(err) return; const at=nowTs();
    if(up){ const before=t.plan+" "+t.cycle; t.plan=m.plan; t.ver=np.ver; t.cycle=m.cycle; t.pending=null;
      if(pro){ const f={supply:pro,vat:Math.floor(pro/10)}; PAYMENTS.push({...PAYMENTS.find(p=>p.co===t.name)||{},id:++PAY_SEQ,inv:"INV-"+BO_TODAY.slice(2,7).replace("-","")+"-"+t.no+"-P",co:t.name,ym:BO_TODAY.slice(0,7),date:BO_TODAY,at:at,plan:t.plan,seats:t.seats,supply:f.supply,vat:f.vat,total:f.supply+f.vat,method:t.card.brand+" ****-"+t.card.last4,stat:"결제완료",appr:String(39000000+PAY_SEQ),pgKey:"tx_pro_"+PAY_SEQ,evid:"카드매출전표",retry:0,refunded:0,note:"업그레이드 일할 차액("+days+"일)"}); }
      t.hist.unshift({at,by:BO.me,what:"업그레이드 즉시 "+before+" → "+m.plan+" "+m.cycle+(pro?" · 일할 차액 "+won(pro+Math.floor(pro/10))+"원 청구":"")+" — "+m.why.trim()}); }
    else { t.pending={plan:m.plan,cycle:m.cycle,at:t.nextBill}; t.hist.unshift({at,by:BO.me,what:"변경 예약 → "+m.plan+" "+m.cycle+" · "+t.nextBill+"부터 — "+m.why.trim()}); }
    audit("구독 변경",t.name,(up?"즉시 ":"예약 ")+m.plan+" "+m.cycle+" · "+m.why.trim()); onClose(); re(); flash(up?t.name+" 구독을 "+m.plan+"(으)로 바꿨습니다"+(pro?" — 일할 차액 "+won(pro+Math.floor(pro/10))+"원(VAT 포함)을 청구했습니다.":"."):t.nextBill+"부터 "+m.plan+" "+m.cycle+"(으)로 바뀝니다."); };
  return <Modal title={"구독 변경 · "+t.name} badge="BO-BILL-05-M1" onClose={onClose} wide footer={<><Btn tone="ghost" onClick={onClose}>취소</Btn>{t.pending&&<Btn tone="ghost" onClick={()=>{t.hist.unshift({at:nowTs(),by:BO.me,what:"변경 예약 취소"});t.pending=null;audit("구독 변경 예약 취소",t.name,"");onClose();re();flash("예약을 취소했습니다.");}}>예약 취소</Btn>}<Btn disabled={!!err} onClick={apply}>{up?"즉시 적용":"다음 결제일부터 적용"}</Btn></>}>
    <div className="rounded-lg border border-gray-200 bg-gray-50/60 p-4 text-sm"><p className="text-xs text-gray-500">현재 {t.plan} v{t.ver} · {t.cycle} · 과금 인원 {t.seats}명(자동) · 청구액 {won(cur.total)}원(VAT 포함) · 다음 결제 {t.nextBill}(D-{days})</p></div>
    <div className="grid grid-cols-2 gap-3">
      <Field label="플랜" req><select value={m.plan} onChange={e=>setM({...m,plan:e.target.value})} className={INP+" w-full bg-white"}>{[...new Set(PLANS.map(p=>p.code))].map(c=><option key={c}>{c}</option>)}</select></Field>
      <Field label="결제 주기" req><select value={m.cycle} onChange={e=>setM({...m,cycle:e.target.value})} className={INP+" w-full bg-white"}><option>월</option><option>연</option></select></Field>
    </div>
    <Field label="사유" req><input value={m.why} onChange={e=>setM({...m,why:e.target.value})} placeholder="예: TCK-2026-0911 회원사 요청" className={INP+" w-full"} /></Field>
    {!same && <div className="rounded-md border border-blue-200 bg-blue-50/50 px-3 py-2 text-sm"><p className="text-xs text-gray-500">{up?"업그레이드 — 즉시 적용":"다운그레이드·주기 변경 — "+t.nextBill+"부터"}</p><p className="font-semibold text-blue-700">변경 후 청구액 {won(nf.total)}원(VAT 포함){m.cycle==="연"&&" · 연 결제 10% 할인"}</p>{up&&<p className="text-xs text-gray-600">일할 차액 {won(pro)}원 + VAT {won(Math.floor(pro/10))}원 = {won(pro+Math.floor(pro/10))}원 즉시 청구{t.sub==="체험"&&" (체험 중이라 차액 없음)"}</p>}</div>}
    <Err m={err} />
  </Modal>;
}

// ═══ 결제증빙발급(BO-BILL-06) — 카드 결제 = 카드매출전표(PG 발행)만 · 세금계산서 미발급(부가가치세법 §33②·시행령 §71②·§88⑤) · 조회·재발송 ═══
const SLIP_TONE = { "승인": "emerald", "부분취소": "amber", "전액취소": "slate", "전표 없음": "gray" };
function SlipBadge({ p }){ const l = slipLabel(p); return <Badge tone={SLIP_TONE[l]}>{l}</Badge>; }
function Invoices({ flash, open }){
  const re=useTick();
  const [st,setSt]=useState("전체"); const [q,setQ]=useState(""); const [m,setM]=useState(null);
  const paid=PAYMENTS.filter(p=>p.stat!=="실패");
  const rows=paid.filter(p=>(st==="전체"||slipLabel(p)===st)&&(p.co+p.inv+p.appr).includes(q)).sort((a,b)=>b.at.localeCompare(a.at));
  const cnt=s=>paid.filter(p=>slipLabel(p)===s).length;
  const resend=()=>{ if(!can("결제증빙발급","W")) return flash("권한이 없습니다."); const t=tOf(m.co)||{}; m.sentAt=nowTs();
    audit("카드매출전표 재발송",m.co+" · "+m.inv,"승인번호 "+m.appr+" → "+(t.email||"관리자 이메일")); setM(null); re(); flash(m.inv+" 카드매출전표를 회원사 관리자 이메일로 다시 보냈습니다."); };
  return (
    <div className="p-5">
      <ScrHead id="BO-BILL-06" title="결제증빙발급" pri="P0" path="구독·결제 > 청구·결제" desc="결제 건별 카드매출전표를 조회하고 회원사에 다시 보냅니다. 카드 결제는 PG가 발행하는 카드매출전표가 법정 증빙이므로 세금계산서는 발급하지 않습니다(부가가치세법 §33②). 세금계산서·현금영수증은 계좌이체·현금 결제(P1) 도입 시 이 화면에 추가됩니다." />
      <div className="mb-4 grid grid-cols-2 gap-3 lg:grid-cols-4"><Stat n={cnt("승인")} l="카드매출전표(승인)" tone="text-emerald-600" /><Stat n={cnt("부분취소")+cnt("전액취소")} l="취소 전표 동반" tone="text-amber-600" sub="환불 시 PG 자동 발행" /><Stat n={PAYMENTS.filter(p=>p.stat==="실패").length} l="결제 실패(전표 없음)" tone="text-gray-800" sub="미납·연체에서 처리" /><Stat n={0} l="세금계산서 대상" tone="text-gray-400" sub="계좌이체·현금 결제(P1)" /></div>
      <Card pad={false}>
        <div className="flex flex-wrap items-center gap-2 border-b border-gray-100 px-4 py-3"><Search value={q} onChange={setQ} ph="회사명·청구번호·승인번호" /><Sel value={st} onChange={setSt} opts={["전체","승인","부분취소","전액취소"]} label="전표 상태" /></div>
        <Table min="960px" cols={[{t:"청구번호"},{t:"회사명"},{t:"결제일시"},{t:"공급가",r:1},{t:"VAT",r:1},{t:"합계",r:1},{t:"카드 · 승인번호"},{t:"전표",c:1},{t:""}]} rows={rows} render={p=><>
          <Td cls="font-mono text-xs text-gray-700">{p.inv}</Td><Td><button onClick={()=>open(p.co)} className="font-medium text-blue-700 hover:underline">{p.co}</button></Td><Td cls="text-gray-500">{p.at}</Td>
          <Td r cls="font-mono">{won(p.supply)}</Td><Td r cls="font-mono text-gray-500">{won(p.vat)}</Td><Td r cls="font-mono">{won(p.total)}{p.refunded>0&&<span className="block text-[11px] text-gray-400">취소 {won(p.refunded)}</span>}</Td>
          <Td cls="text-xs text-gray-600">{p.method}<span className="block font-mono text-gray-400">{p.appr}</span></Td><Td c><SlipBadge p={p} /></Td>
          <Td c><button onClick={()=>setM(p)} className="text-xs font-medium text-blue-600 hover:underline">전표 보기</button></Td></>} />
      </Card>
      <Note><b>규칙</b> — 카드 결제는 PG가 승인 즉시 카드매출전표를 발행하고, 이 전표가 회원사의 매입세액공제 증빙입니다(부가가치세법 §46③). 카드매출전표를 발행한 거래에는 세금계산서를 발급하지 않습니다(§33② · 시행령 §71②·§88⑤ — 이중 발급 금지). 회원사가 세금계산서를 요청하면 이 근거로 안내하고 카드매출전표를 다시 보냅니다. 환불하면 PG가 취소 전표를 자동 발행합니다. 금액은 공급가·VAT·합계로 나눠 저장합니다.</Note>
      {m && <Modal title={"카드매출전표 · "+m.inv} badge="BO-BILL-06-M1" onClose={()=>setM(null)} wide footer={<><Btn tone="ghost" onClick={()=>setM(null)}>닫기</Btn><Btn onClick={resend}>회원사에 재발송</Btn></>}>
        <div className="flex justify-between"><div><p className="font-semibold text-gray-800">{m.co} <span className="text-xs font-normal text-gray-400">{(tOf(m.co)||{}).biz}</span></p><p className="text-xs text-gray-500">{m.inv} · 승인 {m.at} · {m.method}</p></div><SlipBadge p={m} /></div>
        <table className="w-full text-sm"><tbody>{[["공급가액",m.supply],["부가세(10%)",m.vat],["승인금액",m.total],...(m.refunded?[["취소(취소 전표)",-m.refunded]]:[])].map(([k,v])=><tr key={k} className="border-b border-gray-100"><td className="py-2 text-gray-600">{k}</td><td className="py-2 text-right font-mono">{won(v)}원</td></tr>)}</tbody></table>
        <p className="text-xs text-gray-600">가맹점 (주)예스폼 · 승인번호 {m.appr} · PG 거래키 {m.pgKey}{m.sentAt&&" · 재발송 "+m.sentAt}</p>
        <p className="rounded-md bg-gray-50 px-3 py-2 text-xs text-gray-600">이 전표로 회원사가 매입세액공제를 받습니다 — 세금계산서는 발급하지 않습니다(부가가치세법 §33②).</p>
      </Modal>}
    </div>
  );
}

// ═══ 결제 내역(BO-BILL-07) ═══
function Payments({ open, go }){
  const [ym,setYm]=useState("전체"); const [st,setSt]=useState("전체"); const [q,setQ]=useState(""); const [m,setM]=useState(null);
  const months=[...new Set(PAYMENTS.map(p=>p.ym))].sort().reverse();
  const rows=PAYMENTS.filter(p=>(ym==="전체"||p.ym===ym)&&(st==="전체"||p.stat===st||(st==="부분환불"&&p.refunded>0))&&(p.co+p.inv+p.appr).includes(q)).sort((a,b)=>b.at.localeCompare(a.at));
  const ok=rows.filter(p=>p.stat==="결제완료");
  return (
    <div className="p-5">
      <ScrHead id="BO-BILL-07" title="결제 내역" pri="P0" path="구독·결제 > 청구·결제" desc="결제 승인·실패·환불 이력과 결제 수단·승인번호·PG 거래키(대사 키)를 조회합니다. 금액은 공급가·VAT·합계를 함께 표시합니다. 취소·환불은 환불 관리(BO-BILL-09)에서 요청·승인합니다." />
      <div className="mb-4 grid grid-cols-3 gap-3"><Stat n={ok.length+"건"} l="결제완료" tone="text-emerald-600" /><Stat n={won(ok.reduce((a,p)=>a+p.total,0))+"원"} l="결제 합계(VAT 포함)" sub={"공급가 "+won(ok.reduce((a,p)=>a+p.supply,0))+"원"} /><Stat n={rows.filter(p=>p.stat==="실패").length+"건"} l="실패" tone="text-red-500" /></div>
      <Card pad={false}>
        <div className="flex flex-wrap items-center gap-2 border-b border-gray-100 px-4 py-3"><Search value={q} onChange={setQ} ph="회사명·청구번호·승인번호" /><Sel value={ym} onChange={setYm} opts={["전체",...months]} label="귀속월" /><Sel value={st} onChange={setSt} opts={["전체","결제완료","실패","환불","부분환불"]} label="상태" />
          <Btn tone="ghost" onClick={()=>{csv("결제내역_"+BO_TODAY+".csv",["결제일시","회원사","청구번호","공급가","VAT","합계","환불","수단","상태","승인번호","PG 거래키"],rows.map(p=>[p.at,p.co,p.inv,p.supply,p.vat,p.total,p.refunded,p.method,p.stat,p.appr,p.pgKey]));audit("엑셀 내보내기","결제 내역",rows.length+"건");}}>엑셀</Btn></div>
        <Table min="1040px" cols={[{t:"결제일시"},{t:"회원사"},{t:"청구번호"},{t:"공급가",r:1},{t:"VAT",r:1},{t:"합계",r:1},{t:"수단"},{t:"상태",c:1},{t:"승인번호"}]} rows={rows} onRow={setM} render={p=><>
          <Td cls="text-gray-500">{p.at}</Td><Td><button onClick={e=>{e.stopPropagation();open(p.co);}} className="font-medium text-blue-700 hover:underline">{p.co}</button></Td><Td cls="font-mono text-xs text-gray-600">{p.inv}</Td>
          <Td r cls="font-mono">{won(p.supply)}</Td><Td r cls="font-mono text-gray-500">{won(p.vat)}</Td><Td r cls="font-mono">{p.stat==="실패"?<span className="text-red-500">미결제</span>:won(p.total)}{p.refunded>0&&<span className="block text-[11px] text-gray-400">환불 -{won(p.refunded)}</span>}</Td>
          <Td cls="text-xs text-gray-600">{p.method}</Td><Td c><StatusBadge s={p.stat} /></Td><Td cls="font-mono text-xs text-gray-500">{p.appr}</Td></>} />
      </Card>
      {m && <Modal title={"결제 상세 · "+m.inv} badge="BO-BILL-07" onClose={()=>setM(null)} footer={<><Btn tone="ghost" onClick={()=>setM(null)}>닫기</Btn>{refundable(m)>0&&<Btn onClick={()=>{setM(null);go("BO-BILL-09",{payId:m.id});}}>환불 요청 →</Btn>}</>}>
        <dl className="space-y-1.5 text-sm">{[["회원사",m.co],["결제일시",m.at],["이용기간",m.date+" ~ "+dAdd(mAdd(m.date.slice(0,7),1)+m.date.slice(7),-1)],["요금제",m.plan+" · "+m.seats+"명"],["공급가 / VAT / 합계",won(m.supply)+" / "+won(m.vat)+" / "+won(m.total)+"원"],["환불",m.refunded?won(m.refunded)+"원":"–"],["수단",m.method],["승인번호",m.appr],["PG 거래키",m.pgKey],["증빙",m.stat==="실패"?"–":"카드매출전표 · "+slipLabel(m)],["비고",m.note||"–"]].map(([k,v])=><div key={k} className="flex justify-between gap-3"><dt className="text-gray-500">{k}</dt><dd className="text-right font-medium text-gray-700">{v}</dd></div>)}</dl>
      </Modal>}

}

// ═══ 미납·연체(BO-BILL-08) — 실패 후 미결제 건 · D+1/3/7 재시도 · D+14 정지 ═══
function Overdue({ flash, open }){
  const re=useTick();
  const rows=unpaid();
  const retry=p=>{ if(!can("구독·결제","X")) return flash("권한이 없습니다."); const t=tOf(p.co), expired=t.card.exp<BO_TODAY.slice(0,7);
    p.retry++; if(expired){ audit("수동 재결제",p.co+" · "+p.inv,"실패 — 카드 유효기간 만료","실패"); re(); return flash(p.co+" 재결제 실패 — 카드 유효기간이 지났습니다. 결제 수단 변경 링크를 보내세요."); }
    PAYMENTS.push({...p,id:++PAY_SEQ,date:BO_TODAY,at:nowTs(),stat:"결제완료",total:p.supply+p.vat,appr:String(39000000+PAY_SEQ),pgKey:"tx_retry_"+PAY_SEQ,evid:"카드매출전표",note:p.date+" 실패분 수동 재결제 성공"});
    if(!unpaid().some(x=>x.co===p.co)){ t.sub="이용중"; if(t.svc==="정지") t.svc="유료"; t.hist.unshift({at:nowTs(),by:BO.me,what:"미납 해소(수동 재결제) — 이용 재개"}); }
    audit("수동 재결제",p.co+" · "+p.inv,"성공 "+won(p.supply+p.vat)+"원"); re(); flash(p.co+" 재결제에 성공했습니다 — 미납이 해소되어 이용이 재개됩니다."); };
  const dun=p=>{ p.dunLog=(p.dunLog||[]).concat(nowTs()); audit("독촉 알림",p.co,"이메일·알림톡 · "+won(billed(p))+"원"); re(); flash(p.co+"에 미납 안내(이메일·알림톡)를 보냈습니다."); };
  return (
    <div className="p-5">
      <ScrHead id="BO-BILL-08" title="미납·연체 관리" pri="P0" path="구독·결제 > 청구·결제" desc="결제 실패 후 아직 결제되지 않은 건입니다. 실패일 기준 D+1·3·7에 자동 재시도하고, D+14에 조회 전용으로 바꿉니다(회원사 상태 정지 · BO-CMP-04 — 로그인·조회·내려받기는 가능, 계산·확정·발송은 불가). 단계마다 독촉 알림을 보내고, 회원사 화면에는 미납 배너가 뜹니다." />
      <div className="mb-4 grid grid-cols-3 gap-3"><Stat n={new Set(rows.map(p=>p.co)).size+"개사"} l="미납 회원사" tone="text-red-500" /><Stat n={won(rows.reduce((a,p)=>a+billed(p),0))+"원"} l="미납 총액(VAT 포함)" tone="text-red-500" /><Stat n={rows.filter(p=>dunOf(p).suspended).length+"개사"} l="조회 전용 단계(D+14 이상)" tone="text-amber-600" /></div>
      <Card pad={false}>
        <Table min="1000px" cols={[{t:"회원사"},{t:"청구번호"},{t:"미납액",r:1},{t:"실패일"},{t:"경과",c:1},{t:"자동 재시도",c:1},{t:"다음 단계"},{t:"실패 사유"},{t:""}]} rows={rows} empty="미납이 없습니다." render={p=>{const d=dunOf(p);return <>
          <Td><button onClick={()=>open(p.co)} className="font-medium text-blue-700 hover:underline">{p.co}</button></Td><Td cls="font-mono text-xs text-gray-600">{p.inv}</Td><Td r cls="font-mono text-red-500">{won(billed(p))}원</Td><Td cls="text-gray-500">{p.date}</Td>

// ═══ 환불(BO-BILL-09) — 결제완료 건만 · 잔액 이하 · 요청자 ≠ 승인자 · 승인 시 PG 취소 · 취소 전표 자동 발행 ═══
function Refunds({ flash, open, arg }){
  const re=useTick();
  const [m,setM]=useState(arg&&arg.payId?{mode:"add",payId:arg.payId,type:"전액",amt:"",method:"원결제 취소",reason:""}:null); const [cmt,setCmt]=useState("");
  const ym=BO_TODAY.slice(0,7)==="2026-10"?"2026-09":BO_TODAY.slice(0,7);
  const done=REFUNDS.filter(r=>r.stat==="완료");
  const p=m&&PAYMENTS.find(x=>x.id===Number(m.payId)); const max=p?refundable(p)+(m.mode==="view"&&m.stat==="대기"?m.amt:0):0;
  const amt=m?(m.type==="전액"?max:Number(String(m.amt).replace(/[^\d]/g,""))||0):0;
  const err=!m||m.mode!=="add"?"":!p?"결제 건을 고르세요.":p.stat!=="결제완료"?"결제완료 건만 환불할 수 있습니다(실패 건은 미납 관리에서 처리).":max<=0?"환불 가능 잔액이 없습니다.":amt<=0||amt>max?"환불 금액은 1원 이상, 잔액 "+won(max)+"원 이하여야 합니다.":!m.reason.trim()?"사유를 입력하세요.":!can("민감기능(대리접속·환불·파기)","요청")?"환불 요청 권한이 없습니다.":"";
  const add=()=>{ if(err) return; const id=Math.max(0,...REFUNDS.map(r=>r.id))+1; REFUNDS.unshift({id,co:p.co,payId:p.id,type:m.type,amt,method:m.method,reason:m.reason.trim(),stat:"대기",reqBy:BO.me,reqAt:nowTs()}); audit("환불 요청",p.co+" · "+p.inv,m.type+" "+won(amt)+"원 · "+m.reason.trim(),"승인대기"); setM(null); re(); flash("환불 요청을 등록했습니다 — 요청자가 아닌 운영관리자·슈퍼관리자가 승인합니다."); };
  const decide=(r,ok)=>{ if(!can("민감기능(대리접속·환불·파기)","승인")) return flash("환불 승인 권한이 없습니다(운영관리자·슈퍼관리자)."); if(r.reqBy===BO.me) return flash("본인이 요청한 환불은 승인할 수 없습니다 — 다른 운영자로 전환하세요(헤더)."); if(!ok&&!cmt.trim()) return flash("반려 사유를 입력하세요.");
    const pp=PAYMENTS.find(x=>x.id===r.payId); r.stat=ok?"완료":"반려"; r.procBy=BO.me; r.procAt=nowTs(); r.cmt=cmt.trim();
    if(ok){ pp.refunded+=r.amt; if(pp.refunded>=pp.total) pp.stat="환불"; r.modTax="카드 취소 전표 자동 발행(PG)"; }
    audit(ok?"환불 승인":"환불 반려",r.co+" · "+pp.inv,won(r.amt)+"원"+(ok?" · PG "+r.method:" · "+cmt.trim())); setM(null); setCmt(""); re(); flash(ok?"환불을 승인했습니다 — PG "+r.method+" 처리, "+r.modTax+".":"반려했습니다."); };
  return (
    <div className="p-5">
      <ScrHead id="BO-BILL-09" title="환불 관리" pri="P0" path="구독·결제 > 정산·세무" desc="결제완료 건에 대해 전액·부분 환불을 요청하고, 요청자가 아닌 운영자가 승인합니다. 승인하면 PG 원결제 취소·부분취소가 실행되고 카드 취소 전표가 자동 발행됩니다(카드 결제라 수정세금계산서 대상 아님). 잔여기간 환불 정책은 미정입니다." />
      <div className="mb-4 grid grid-cols-3 gap-3"><Stat n={REFUNDS.filter(r=>r.stat==="대기").length+"건"} l="승인 대기" tone="text-amber-600" /><Stat n={won(done.filter(r=>r.procAt.startsWith(ym)).reduce((a,r)=>a+r.amt,0))+"원"} l={ym+" 환불 완료액"} tone="text-red-500" /><Stat n={won(done.reduce((a,r)=>a+r.amt,0))+"원"} l="누적 환불 완료액" /></div>
      <div className="mb-3 flex justify-end"><Btn onClick={()=>setM({mode:"add",payId:"",type:"전액",amt:"",method:"원결제 취소",reason:""})}>+ 환불 요청</Btn></div>
      <Card pad={false}>
        <Table min="1000px" cols={[{t:"요청"},{t:"회원사"},{t:"결제 건"},{t:"유형",c:1},{t:"금액",r:1},{t:"사유"},{t:"처리",c:1},{t:""}]} rows={REFUNDS} render={r=>{const pp=PAYMENTS.find(x=>x.id===r.payId);return <>
          <Td cls="text-xs text-gray-500">{r.reqAt}<br/>{r.reqBy}</Td><Td><button onClick={()=>open(r.co)} className="font-medium text-blue-700 hover:underline">{r.co}</button></Td><Td cls="font-mono text-xs text-gray-600">{pp.inv}<span className="block text-gray-400">결제 {won(pp.total)}</span></Td>
          <Td c><Badge tone="slate">{r.type}</Badge></Td><Td r cls="font-mono text-red-500">{won(r.amt)}원</Td><Td cls="text-gray-600">{r.reason}{r.cmt&&<span className="block text-xs text-gray-400">→ {r.cmt}</span>}</Td>
          <Td c><StatusBadge s={r.stat} />{r.procBy&&<span className="block text-[11px] text-gray-400">{r.procBy}</span>}</Td>
          <Td c><button onClick={()=>{setCmt("");setM({mode:"view",...r});}} className="text-xs font-medium text-blue-600 hover:underline">{r.stat==="대기"?"처리":"상세"}</button></Td></>;}} />
      </Card>
      {m && m.mode==="add" && <Modal title="환불 요청" badge="BO-BILL-09-M1" onClose={()=>setM(null)} wide footer={<><Btn tone="ghost" onClick={()=>setM(null)}>취소</Btn><Btn disabled={!!err} onClick={add}>요청 등록</Btn></>}>
        <Field label="대상 결제 건" req hint="결제완료 건만 표시 · 환불 가능 잔액"><select value={m.payId} onChange={e=>setM({...m,payId:e.target.value})} className={INP+" w-full bg-white"}><option value="">선택</option>{PAYMENTS.filter(x=>refundable(x)>0).sort((a,b)=>b.at.localeCompare(a.at)).map(x=><option key={x.id} value={x.id}>{x.co} · {x.inv} · 결제 {won(x.total)} · 잔액 {won(refundable(x))}</option>)}</select></Field>
        <div className="grid grid-cols-2 gap-3">
          <Field label="유형" req><select value={m.type} onChange={e=>setM({...m,type:e.target.value,method:e.target.value==="전액"?"원결제 취소":"원결제 부분취소"})} className={INP+" w-full bg-white"}><option>전액</option><option>부분</option></select></Field>
          <Field label="금액(VAT 포함)" req><input value={m.type==="전액"?won(max):m.amt} disabled={m.type==="전액"} onChange={e=>setM({...m,amt:e.target.value})} className={INP+" w-full text-right"} /></Field>
          <Field label="환불 수단" req><select value={m.method} onChange={e=>setM({...m,method:e.target.value})} className={INP+" w-full bg-white"}>{(m.type==="전액"?["원결제 취소","계좌 입금(취소 불가 시)"]:["원결제 부분취소","계좌 입금(취소 불가 시)"]).map(o=><option key={o}>{o}</option>)}</select></Field>
        </div>
        <Field label="사유" req><input value={m.reason} onChange={e=>setM({...m,reason:e.target.value})} placeholder="중복 승인·장애 보상 등" className={INP+" w-full"} /></Field>
        {m.method.includes("계좌")&&<p className="text-xs text-gray-500">계좌 입금은 회원사 사업자 명의 계좌로만, 1:1 문의로 받은 정보로 처리합니다(운영 콘솔에 계좌번호 저장 안 함).</p>}
        <Err m={err} />
      </Modal>}
      {m && m.mode==="view" && (()=>{const r=REFUNDS.find(x=>x.id===m.id), pp=PAYMENTS.find(x=>x.id===r.payId);return <Modal title={"환불 · "+r.co} badge="BO-BILL-09-M1" onClose={()=>setM(null)} wide footer={r.stat==="대기"?<><Btn tone="ghost" onClick={()=>decide(r,false)}>반려</Btn><Btn onClick={()=>decide(r,true)}>승인·PG 처리</Btn></>:<Btn tone="ghost" onClick={()=>setM(null)}>닫기</Btn>}>
        <dl className="space-y-1.5 text-sm">{[["결제 건",pp.inv+" · "+pp.at+" · "+won(pp.total)+"원"],["유형·금액",r.type+" · "+won(r.amt)+"원"],["수단",r.method],["사유",r.reason],["요청",r.reqBy+" · "+r.reqAt],["처리",r.procBy?r.procBy+" · "+r.procAt+(r.cmt?" · "+r.cmt:""):"대기"],["증빙",r.modTax||"승인 시 카드 취소 전표 자동 발행(PG)"]].map(([k,v])=><div key={k} className="flex justify-between gap-3"><dt className="text-gray-500">{k}</dt><dd className="text-right font-medium text-gray-700">{v}</dd></div>)}</dl>
        {r.stat==="대기"&&<><Field label="처리 의견" hint="반려 시 필수"><input value={cmt} onChange={e=>setCmt(e.target.value)} className={INP+" w-full"} /></Field>{r.reqBy===BO.me&&<p className="rounded-md bg-amber-50 px-3 py-2 text-xs text-amber-700">본인이 요청한 건입니다 — 다른 운영자가 승인해야 합니다.</p>}</>}
      </Modal>;})()}
    </div>

}

// ═══ 정산·세무(BO-BILL-11) — 결제·환불 원천에서 월별 계산 ═══
function Settlement(){
  const months=[...new Set([...PAYMENTS.map(p=>p.ym),...REFUNDS.filter(r=>r.stat==="완료").map(r=>r.procAt.slice(0,7))])].sort().reverse().slice(0,4);
  const R=months.map(m=>{ const ok=PAYMENTS.filter(p=>p.ym===m&&p.stat!=="실패"), rf=REFUNDS.filter(r=>r.stat==="완료"&&r.procAt.startsWith(m)), un=unpaid().filter(p=>p.ym===m);
    return { m, co:new Set(ok.map(p=>p.co)).size, cnt:ok.length, supply:ok.reduce((a,p)=>a+p.supply,0), vat:ok.reduce((a,p)=>a+p.vat,0), total:ok.reduce((a,p)=>a+p.total,0), refund:rf.reduce((a,r)=>a+r.amt,0), refCo:new Set(rf.map(r=>r.co)).size, due:un.reduce((a,p)=>a+billed(p),0), dueCo:new Set(un.map(p=>p.co)).size, pend:REFUNDS.filter(r=>r.stat==="대기"&&PAYMENTS.find(p=>p.id===r.payId).ym===m).length }; });
  const S=k=>R.reduce((a,r)=>a+r[k],0);
  return (
    <div className="p-5">
      <ScrHead id="BO-BILL-11" title="정산·세무 리포트" pri="P0" path="구독·결제 > 정산·세무" desc="결제·환불 원천에서 월별 매출(공급가·VAT)·수납·환불(승인 완료분만)·미수(미납)를 계산하고 회계 전표로 내보냅니다. 매출 추세·구독 지표는 매출·구독 지표(BO-STAT-02)에서 봅니다." />
      <div className="mb-4 grid grid-cols-2 gap-3 lg:grid-cols-4"><Stat n={won(S("supply"))+"원"} l={"매출 공급가("+months.length+"개월)"} sub={"VAT "+won(S("vat"))+"원"} /><Stat n={won(S("total"))+"원"} l="수납(VAT 포함)" tone="text-emerald-600" /><Stat n={won(S("refund"))+"원"} l="환불(승인 완료)" tone="text-red-500" /><Stat n={won(S("due"))+"원"} l="미수(미납)" tone="text-amber-600" /></div>
      <Card title="월별 정산" right={<Btn tone="ghost" onClick={()=>{csv("정산전표_"+BO_TODAY+".csv",["월","결제 회원사","결제 건수","공급가","VAT","수납","환불","미수"],R.map(r=>[r.m,r.co,r.cnt,r.supply,r.vat,r.total,r.refund,r.due]));audit("전표 내보내기","정산·세무",months.join(","));}}>전표 내보내기</Btn>} pad={false}>
        <Table min="980px" cols={[{t:"월"},{t:"결제 회원사",c:1},{t:"결제 건수",c:1},{t:"공급가",r:1},{t:"VAT",r:1},{t:"수납",r:1},{t:"환불(회원사)",r:1},{t:"미수(회원사)",r:1},{t:"확인",c:1}]} rows={R} render={r=><>
          <Td cls="font-medium text-gray-800">{r.m}</Td><Td c cls="text-gray-700">{r.co}개사</Td><Td c cls="text-gray-500">{r.cnt}건</Td><Td r cls="font-mono">{won(r.supply)}</Td><Td r cls="font-mono text-gray-500">{won(r.vat)}</Td><Td r cls="font-mono text-emerald-600">{won(r.total)}</Td>
          <Td r cls="font-mono text-red-500">{won(r.refund)} <span className="text-xs text-gray-400">· {r.refCo}</span></Td><Td r cls="font-mono text-amber-600">{won(r.due)} <span className="text-xs text-gray-400">· {r.dueCo}</span></Td>
          <Td c>{r.due||r.pend?<Badge tone="amber">{[r.due&&"미수",r.pend&&"환불 대기 "+r.pend].filter(Boolean).join(" · ")}</Badge>:<Badge tone="emerald">정리됨</Badge>}</Td></>} />
      </Card>
      <Note><b>기준</b> — 매출은 결제 성공 건(공급가), 환불은 승인 완료일이 속한 달, 미수는 결제 실패 후 아직 결제되지 않은 건입니다. 대기 중인 환불은 합계에 넣지 않고 ‘확인’에 표시합니다. PG 정산액 대사는 PG 정산 파일 연동(P1) 후 차이 금액으로 표시합니다.</Note>
    </div>
  );
}

          <div className="mt-3 flex items-center justify-between rounded-md bg-slate-50 px-3 py-2 text-sm"><span className="text-gray-600">최근 수신</span><span className="text-gray-500">{PG_CFG.lastHook}</span></div>
        </Card>

function Wysiwyg({ html, refEl }){

          <option value="">본문 스타일</option><option value="H2">제목 H2</option><option value="H3">제목 H3</option><option value="P">본문</option>
        </select>

        <Tb onClick={()=>cmd("italic")} label="I" title="기울임" cls="italic" />
        <Tb onClick={()=>cmd("underline")} label="U" title="밑줄" cls="underline" />
        <Sep />
        <Tb onClick={()=>cmd("insertUnorderedList")} label="• 목록" title="글머리 목록" />
        <Tb onClick={()=>cmd("insertOrderedList")} label="1. 목록" title="번호 목록" />

      </div>
      <div ref={ref} contentEditable suppressContentEditableWarning
        className="min-h-[180px] max-w-none px-3 py-2 text-sm leading-relaxed text-gray-700 focus:outline-none [&_h2]:text-lg [&_h2]:font-bold [&_h2]:my-1 [&_h3]:text-base [&_h3]:font-semibold [&_ul]:list-disc [&_ul]:pl-5 [&_ol]:list-decimal [&_ol]:pl-5 [&_a]:text-blue-600 [&_a]:underline [&_img]:my-2 [&_img]:max-w-full [&_img]:rounded"
        dangerouslySetInnerHTML={{__html: html||'<p class="text-gray-400">공지 본문을 입력하세요. 상단 도구모음으로 서식·링크·이미지를 넣을 수 있습니다.</p>'}} />
      <div className="flex items-center justify-between border-t border-gray-100 px-3 py-1.5 text-[11px] text-gray-400">

      </div>

  );
}

// ═══ 1:1 문의함(BO-SUP-01) + 문의 상세·답변(BO-SUP-02) ═══
function SupportInbox({ flash, open }){
  const re=useTick();
  const [st,setSt]=useState("미완료"); const [cat,setCat]=useState("전체"); const [own,setOwn]=useState("전체"); const [q,setQ]=useState("");
  const [selNo,setSelNo]=useState(null); const [ans,setAns]=useState(""); const [internal,setInternal]=useState(false); const [nst,setNst]=useState("완료"); const [ch,setCh]=useState({mail:true,kakao:true});
  const CS=OPERATORS.filter(o=>["CS","운영관리자","슈퍼관리자"].includes(o.role)&&o.stat==="활성").map(o=>o.name);
  const rows=TICKETS.filter(t=>(st==="전체"||(st==="미완료"?t.stat!=="완료":t.stat===st))&&(cat==="전체"||t.cat===cat)&&(own==="전체"||(own==="미배정"?!t.owner:t.owner===own))&&(t.title+t.co+t.no).includes(q)).sort((a,b)=>b.last.localeCompare(a.last));
  const t=TICKETS.find(x=>x.no===selNo);
  const assign=n=>{ t.owner=n; if(t.stat==="대기"&&n) t.stat="처리중"; audit("문의 배정",t.no,n||"미배정"); re(); };
  const send=()=>{ if(!ans.trim()) return flash("답변 내용을 입력하세요."); if(!can("CS·공지","W")) return flash("답변 권한이 없습니다.");
    t.msgs.push({who:internal?"내부":"상담원",by:BO.me,at:nowTs(),text:ans.trim(),ch:internal?"":[ch.mail&&"메일",ch.kakao&&"알림톡"].filter(Boolean).join("·")});
    if(!internal){ t.stat=nst; if(!t.owner) t.owner=BO.me; } t.last=nowTs(); audit(internal?"내부 메모":"문의 답변",t.no+" · "+t.co,internal?"":"상태 "+nst+" · "+[ch.mail&&"메일",ch.kakao&&"알림톡"].filter(Boolean).join("·"));
    setAns(""); re(); flash(internal?"내부 메모를 남겼습니다(회원사 비노출).":"답변을 보냈습니다 — 회원사 1:1 문의(SET-09)에 표시되고 "+[ch.mail&&"메일",ch.kakao&&"알림톡(실패 시 SMS)"].filter(Boolean).join("·")+"으로 알렸습니다."); };
  const cnt=f=>TICKETS.filter(f).length;
  return (
    <div className="p-5">
      <ScrHead id="BO-SUP-01" title="1:1 문의함" pri="P0" path="CS·공지 > 문의" desc="회원사 관리자가 1:1 문의(SET-09)에서 등록한 티켓을 상태·분류·담당자로 조회하고 배정·답변합니다. 첫 응답 SLA: 높음 4시간 · 보통 1일 · 낮음 2일. 답변은 회원사 SET-09 화면과 메일·알림톡으로 전달되고, 내부 메모는 회원사에 보이지 않습니다." />
      <div className="mb-4 grid grid-cols-2 gap-3 lg:grid-cols-4"><Stat n={cnt(x=>!x.owner&&x.stat!=="완료")} l="미배정" tone="text-amber-600" /><Stat n={cnt(x=>x.stat==="처리중"||x.stat==="대기")} l="대기·처리중" tone="text-blue-600" /><Stat n={cnt(x=>x.stat!=="완료"&&!slaOf(x).ok)} l="SLA 초과" tone="text-red-500" /><Stat n={cnt(x=>x.stat==="완료"&&x.last.startsWith(BO_TODAY))} l="오늘 완료" tone="text-emerald-600" /></div>
      <div className="grid gap-4 xl:grid-cols-[1fr_440px]">
        <Card pad={false}>
          <div className="flex flex-wrap items-center gap-2 border-b border-gray-100 px-4 py-3"><Search value={q} onChange={setQ} ph="제목·회원사·번호" /><Sel value={st} onChange={setSt} opts={["미완료","전체","대기","처리중","보류","완료"]} /><Sel value={cat} onChange={setCat} opts={["전체","급여","근태","구독·결제","계정·권한","기타"]} label="분류" /><Sel value={own} onChange={setOwn} opts={["전체","미배정",...CS]} label="담당" /></div>
          <Table min="680px" cols={[{t:"제목"},{t:"회원사 · 문의자"},{t:"우선",c:1},{t:"SLA",c:1},{t:"상태",c:1},{t:"담당"}]} rows={rows} onRow={x=>{setSelNo(x.no);setAns("");setInternal(false);}} render={x=>{const s=slaOf(x);return <>
            <Td><p className={"font-medium "+(x.no===selNo?"text-blue-700":"text-gray-800")}>{x.title}</p><p className="text-xs text-gray-400">{x.no} · {x.cat} · {x.last}</p></Td>
            <Td><button onClick={e=>{e.stopPropagation();open(x.co);}} className="text-blue-700 hover:underline">{x.co}</button><p className="text-xs text-gray-400">{x.who}</p></Td>
            <Td c><Badge tone={PRI_TONE[x.pri]}>{x.pri}</Badge></Td><Td c>{x.stat==="완료"?<span className="text-xs text-gray-400">–</span>:<Badge tone={s.ok?"slate":"red"}>{s.label}</Badge>}</Td><Td c><StatusBadge s={x.stat} /></Td><Td cls="text-gray-600">{x.owner||<span className="text-amber-600">미배정</span>}</Td></>;}} />
        </Card>
        {t ? <Card title={t.no+" · "+t.title} right={<StatusBadge s={t.stat} />}>
          <p className="mb-2 text-xs text-gray-500"><button onClick={()=>open(t.co)} className="text-blue-600 hover:underline">{t.co}</button> · {t.who} · {t.cat} · 관련 화면 {t.scr} · {t.ch}</p>
          <div className="max-h-72 space-y-2 overflow-y-auto rounded-md border border-gray-100 bg-slate-50/60 p-3 text-sm">{t.msgs.map((mm,i)=><div key={i} className={"rounded-md px-3 py-2 "+(mm.who==="고객"?"bg-white shadow-sm":mm.who==="내부"?"ml-6 border border-dashed border-amber-300 bg-amber-50":"ml-6 bg-blue-50")}><p className="text-[11px] text-gray-400">{mm.who==="고객"?"고객 "+t.who:mm.who==="내부"?"내부 메모 · "+mm.by:"상담원 "+mm.by}{" · "+mm.at}{mm.ch&&" · "+mm.ch}</p><p className="whitespace-pre-line text-gray-700">{mm.text}</p></div>)}</div>
          <div className="mt-3 grid grid-cols-2 gap-2"><Field label="담당자"><select value={t.owner} onChange={e=>assign(e.target.value)} className={INP+" w-full bg-white"}><option value="">미배정</option>{CS.map(n=><option key={n}>{n}</option>)}</select></Field>
            <Field label="정형답변"><select value="" onChange={e=>{if(e.target.value) setAns(MACROS[e.target.value]);}} className={INP+" w-full bg-white"}><option value="">선택…</option>{Object.keys(MACROS).map(k=><option key={k}>{k}</option>)}</select></Field></div>
          <div className="mt-2"><textarea rows="4" value={ans} onChange={e=>setAns(e.target.value)} className={INP+" w-full"} placeholder={internal?"내부 메모(회원사 비노출)":"회원사에 보낼 답변"} /></div>
          <div className="mt-2 flex flex-wrap items-center gap-3 text-sm text-gray-700">
            <label className="flex items-center gap-1.5"><input type="checkbox" checked={internal} onChange={e=>setInternal(e.target.checked)} className="h-4 w-4 rounded border-gray-300" />내부 메모</label>
            {!internal&&<><label className="flex items-center gap-1.5"><input type="checkbox" checked={ch.mail} onChange={e=>setCh({...ch,mail:e.target.checked})} className="h-4 w-4 rounded border-gray-300" />메일</label><label className="flex items-center gap-1.5"><input type="checkbox" checked={ch.kakao} onChange={e=>setCh({...ch,kakao:e.target.checked})} className="h-4 w-4 rounded border-gray-300" />알림톡</label>
              <select value={nst} onChange={e=>setNst(e.target.value)} className={INP+" bg-white"}>{["처리중","완료","보류"].map(o=><option key={o}>{o}</option>)}</select></>}
          </div>
          <div className="mt-3 flex justify-end"><Btn onClick={send}>{internal?"메모 저장":"답변 전송"}</Btn></div>
          <p className="mt-2 text-[11px] text-gray-400">본문의 주민번호·계좌번호는 회원사 화면에서 자동으로 가려 저장됩니다. 개인정보가 필요하면 대리 접속(BO-CMP-05)으로 확인하세요.</p>
        </Card> : <Card><p className="py-10 text-center text-sm text-gray-400">왼쪽에서 문의를 고르세요.</p></Card>}
      </div>
    </div>
  );
}

// ═══ FAQ 관리(BO-SUP-03) — 회원사 1:1 문의(SET-09) 상단 '자주 묻는 질문' ═══
function FaqScreen({ flash }){
  const re=useTick();
  const [cat,setCat]=useState("전체"); const [m,setM]=useState(null);
  const rows=FAQS.filter(f=>cat==="전체"||f.cat===cat).sort((a,b)=>a.order-b.order);
  const err=!m?"":!m.q.trim()?"질문을 입력하세요.":m.q.length>100?"질문은 100자 이내로 쓰세요.":!m.a.trim()?"답변을 입력하세요.":!can("CS·공지","W")?"FAQ 편집 권한이 없습니다.":"";
  const save=()=>{ if(err) return; if(m.id){ Object.assign(FAQS.find(f=>f.id===m.id),{cat:m.cat,q:m.q.trim(),a:m.a.trim(),target:m.target,pub:m.pub}); } else FAQS.push({...m,id:Math.max(0,...FAQS.map(f=>f.id))+1,q:m.q.trim(),a:m.a.trim(),order:FAQS.length+1,views:0});
    audit("FAQ 저장",m.q.trim().slice(0,30),m.pub?"게시":"비게시"); setM(null); re(); flash("저장했습니다"+(m.pub?" — 회원사 1:1 문의 화면에 바로 보입니다.":"(비게시).")); };
  const move=(f,d)=>{ const list=FAQS.slice().sort((a,b)=>a.order-b.order), i=list.indexOf(f), j=i+d; if(j<0||j>=list.length) return; const o=list[j].order; list[j].order=f.order; f.order=o; re(); };
  return (
    <div className="p-5">
      <ScrHead id="BO-SUP-03" title="FAQ 관리" pri="P0" path="CS·공지 > 문의" desc="자주 묻는 질문을 분류·노출 대상·순서로 관리합니다. 게시한 항목은 회원사 1:1 문의(SET-09) 상단에 보이고, 조회수가 많은데 문의가 반복되는 항목은 답변을 보강합니다." />
      <Card pad={false}>
        <div className="flex flex-wrap items-center justify-between gap-2 border-b border-gray-100 px-4 py-3"><Sel value={cat} onChange={setCat} opts={["전체","급여","근태","구독·결제","계정·권한","기타"]} label="분류" /><Btn onClick={()=>setM({cat:"급여",q:"",a:"",target:"전체",pub:true})}>+ FAQ 등록</Btn></div>
        <Table min="860px" cols={[{t:"순서",c:1},{t:"분류"},{t:"질문"},{t:"노출 대상",c:1},{t:"조회",r:1},{t:"게시",c:1},{t:""}]} rows={rows} render={f=><>
          <Td c><div className="flex items-center justify-center gap-1"><button onClick={()=>move(f,-1)} className="text-gray-400 hover:text-gray-700">▲</button><span className="w-4 text-center">{f.order}</span><button onClick={()=>move(f,1)} className="text-gray-400 hover:text-gray-700">▼</button></div></Td>
          <Td><Badge tone="slate">{f.cat}</Badge></Td><Td cls="font-medium text-gray-800">{f.q}<p className="text-xs font-normal text-gray-400">{f.a.slice(0,60)}…</p></Td><Td c><Badge tone={f.target==="전체"?"slate":"blue"}>{f.target}</Badge></Td><Td r cls="font-mono text-gray-600">{won(f.views)}</Td>
          <Td c><button onClick={()=>{f.pub=!f.pub;audit("FAQ "+(f.pub?"게시":"비게시"),f.q.slice(0,30),"");re();}} className={"rounded px-2 py-0.5 text-xs font-medium "+(f.pub?"bg-emerald-50 text-emerald-700":"bg-gray-100 text-gray-500")}>{f.pub?"게시":"비게시"}</button></Td>
          <Td c><button onClick={()=>setM({...f})} className="text-xs font-medium text-blue-600 hover:underline">편집</button></Td></>} />
      </Card>
      {m && <Modal title={m.id?"FAQ 편집":"FAQ 등록"} badge="BO-SUP-03-M1" onClose={()=>setM(null)} wide footer={<><Btn tone="ghost" onClick={()=>setM(null)}>취소</Btn><Btn disabled={!!err} onClick={save}>저장</Btn></>}>
        <div className="grid grid-cols-3 gap-3"><Field label="분류" req><select value={m.cat} onChange={e=>setM({...m,cat:e.target.value})} className={INP+" w-full bg-white"}>{["급여","근태","구독·결제","계정·권한","기타"].map(o=><option key={o}>{o}</option>)}</select></Field>
          <Field label="노출 대상"><select value={m.target} onChange={e=>setM({...m,target:e.target.value})} className={INP+" w-full bg-white"}>{["전체","Starter","Basic","Pro"].map(o=><option key={o}>{o}</option>)}</select></Field>
          <Field label="게시"><select value={m.pub?"게시":"비게시"} onChange={e=>setM({...m,pub:e.target.value==="게시"})} className={INP+" w-full bg-white"}><option>게시</option><option>비게시</option></select></Field></div>
        <Field label="질문" req><input value={m.q} onChange={e=>setM({...m,q:e.target.value})} className={INP+" w-full"} /></Field>
        <Field label="답변" req hint="관련 화면 ID를 함께 적으면 회원사 화면에서 바로가기로 바뀝니다"><textarea rows="5" value={m.a} onChange={e=>setM({...m,a:e.target.value})} className={INP+" w-full"} /></Field>
        <Err m={err} />
      </Modal>}
    </div>
  );
}

// ═══ 공지사항(BO-SUP-04) — 관리자 앱 홈 공지(BO_NOTICES)와 같은 원천 ═══
function Notices({ flash }){
  const re=useTick();

  const err=!m?"":!m.title.trim()?"제목을 입력하세요.":!m.from?"게시 시작일을 입력하세요.":m.to&&m.to<m.from?"게시 종료일이 시작일보다 빠릅니다.":!can("CS·공지","W")?"공지 편집 권한이 없습니다.":"";
  const save=draft=>{ if(err) return; const body=bodyRef.current?bodyRef.current.innerHTML:m.body; const row={...m,title:m.title.trim(),body,draft,by:BO.me,at:nowTs()};
    if(m.id) Object.assign(NOTICES.find(n=>n.id===m.id),row); else NOTICES.push({...row,id:Math.max(0,...NOTICES.map(n=>n.id))+1});
    audit(draft?"공지 임시저장":"공지 게시",row.title.slice(0,30),row.target+" · "+row.from+"~"+(row.to||"")); setM(null); re(); flash(draft?"임시저장했습니다(회원사 비노출).":noticeStat(row)==="예약"?row.from+"에 게시됩니다.":"게시했습니다 — 관리자 앱 홈 공지에 바로 보입니다."); };

    <div className="p-5">

      <Card pad={false}>
        <div className="flex flex-wrap items-center gap-2 border-b border-gray-100 px-4 py-3"><Search value={q} onChange={setQ} ph="제목·본문" /><Sel value={st} onChange={setSt} opts={["전체","임시저장","예약","게시중","종료"]} label="상태" /><Sel value={tg} onChange={setTg} opts={["전체","Starter","Basic","Pro"]} label="대상" /><Btn onClick={()=>setM({title:"",body:"",target:"전체",imp:"일반",from:BO_TODAY,to:""})}>+ 공지 등록</Btn></div>
        <Table min="860px" cols={[{t:"제목"},{t:"노출 대상",c:1},{t:"게시기간"},{t:"중요도",c:1},{t:"상태",c:1},{t:"작성"},{t:""}]} rows={rows} render={n=><>
          <Td cls="font-medium text-gray-800">{n.title}</Td><Td c><Badge tone={n.target==="전체"?"slate":"blue"}>{n.target}</Badge></Td><Td cls="text-gray-500">{n.from} ~ {n.to||"상시"}</Td>
          <Td c>{n.imp==="중요"?<Badge tone="red">중요</Badge>:<Badge tone="slate">일반</Badge>}</Td><Td c><StatusBadge s={noticeStat(n)} /></Td><Td cls="text-xs text-gray-500">{n.by} · {n.at.slice(0,10)}</Td>
          <Td c><div className="flex justify-center gap-2"><button onClick={()=>setM({...n})} className="text-xs font-medium text-blue-600 hover:underline">편집</button>{noticeStat(n)==="게시중"&&<button onClick={()=>{n.to=dAdd(BO_TODAY,-1);audit("공지 게시 종료",n.title.slice(0,30),"");re();flash("게시를 종료했습니다.");}} className="text-xs text-gray-500 hover:underline">종료</button>}</div></Td></>} />
      </Card>
      {m && <Modal title={m.id?"공지 편집":"공지 등록"} badge="BO-SUP-04-M1" onClose={()=>setM(null)} wide footer={<><Btn tone="ghost" onClick={()=>save(true)} disabled={!!err}>임시저장</Btn><Btn disabled={!!err} onClick={()=>save(false)}>{m.from>BO_TODAY?"예약 게시":"게시"}</Btn></>}>
        <Field label="제목" req><input value={m.title} onChange={e=>setM({...m,title:e.target.value})} className={INP+" w-full"} /></Field>
        <Field label="본문" req><Wysiwyg html={m.body} refEl={bodyRef} /></Field>
        <div className="grid grid-cols-2 gap-3 lg:grid-cols-4">
          <Field label="노출 대상"><select value={m.target} onChange={e=>setM({...m,target:e.target.value})} className={INP+" w-full bg-white"}>{["전체","Starter","Basic","Pro"].map(o=><option key={o}>{o}</option>)}</select></Field>
          <Field label="중요도"><select value={m.imp} onChange={e=>setM({...m,imp:e.target.value})} className={INP+" w-full bg-white"}>{["일반","중요"].map(o=><option key={o}>{o}</option>)}</select></Field>
          <Field label="게시 시작" req><input type="date" value={m.from} onChange={e=>setM({...m,from:e.target.value})} className={INP+" w-full"} /></Field>
          <Field label="게시 종료" hint="비우면 상시"><input type="date" value={m.to} min={m.from} onChange={e=>setM({...m,to:e.target.value})} className={INP+" w-full"} /></Field>
        </div>
        <Err m={err} />
      </Modal>}
    </div>
  );
}

// ═══ 가입·활성·이탈 지표(BO-STAT-01) ═══
function GrowthStats(){
  const cur=BO_TODAY.slice(0,7)==="2026-10"?"2026-09":BO_TODAY.slice(0,7);
  const nowRow={ m:cur, signup:TENANTS.filter(t=>t.signup.startsWith(cur)).length, trial:TENANTS.filter(t=>t.sub==="체험").length, paid:TENANTS.filter(t=>t.svc==="유료"||t.svc==="정지").length, churn:CANCELS.filter(c=>c.status==="완료"&&c.date.startsWith(cur)).length, conv:TENANTS.filter(t=>t.hist.some(h=>h.what.includes("체험 → 유료")&&h.at.startsWith(cur))).length };
  const R=[...STAT_HIST,nowRow];
  const prevPaid=R[R.length-2].paid, churnRate=prevPaid?Math.round(nowRow.churn/prevPaid*1000)/10:0;
  const active=TENANTS.filter(t=>t.svc!=="해지"&&t.usage.login30>=3).length, total=TENANTS.filter(t=>t.svc!=="해지").length;

      <div className="grid grid-cols-2 gap-3 lg:grid-cols-4"><Stat n={nowRow.signup+"개사"} l={cur+" 신규 가입"} tone="text-blue-600" /><Stat n={nowRow.paid+"개사"} l="유료(정지 포함)" tone="text-emerald-600" sub={"체험 "+nowRow.trial+"개사"} /><Stat n={Math.round(active/total*100)+"%"} l="활성률" sub={active+"/"+total+"개사"} /><Stat n={churnRate+"%"} l={cur+" 해지율"} tone="text-red-500" sub={"해지 "+nowRow.churn+" / 전월 유료 "+prevPaid} /></div>
      <div className="mt-4 grid gap-4 lg:grid-cols-2">
        <Card title="월별 회원사 추이">
          <div className="flex h-40 items-end gap-6 px-2">{R.map(r=><div key={r.m} className="flex flex-1 flex-col items-center gap-1"><div className="flex w-full flex-col justify-end" style={{height:"120px"}}><div className="w-full rounded-t bg-amber-300" style={{height:r.trial/max*120+"px"}} title={"체험 "+r.trial} /><div className="w-full bg-emerald-500" style={{height:r.paid/max*120+"px"}} title={"유료 "+r.paid} /></div><span className="text-xs text-gray-500">{r.m.slice(5)}월</span></div>)}</div>
          <p className="mt-2 text-xs text-gray-400"><span className="mr-3 inline-block h-2 w-3 bg-emerald-500" />유료 <span className="ml-3 mr-1 inline-block h-2 w-3 bg-amber-300" />체험</p>
        </Card>
        <Card title="월별 표" pad={false}><Table min="420px" cols={[{t:"월"},{t:"신규 가입",c:1},{t:"체험",c:1},{t:"유료",c:1},{t:"체험→유료",c:1},{t:"해지",c:1}]} rows={R} render={r=><><Td cls="font-medium text-gray-800">{r.m}{r.m===cur&&<span className="ml-1 text-xs text-gray-400">(진행)</span>}</Td><Td c>{r.signup}</Td><Td c>{r.trial}</Td><Td c>{r.paid}</Td><Td c>{r.conv}</Td><Td c cls="text-red-500">{r.churn}</Td></>} /></Card>
      </div>
      <Card title="해지 사유(해지 신청 기준)" pad={false}><Table min="420px" cols={[{t:"사유"},{t:"건수",c:1},{t:"회원사"}]} rows={Object.entries(CANCELS.reduce((a,c)=>{(a[c.reason]=a[c.reason]||[]).push(c.co);return a;},{}))} render={([k,v])=><><Td cls="text-gray-700">{k}</Td><Td c>{v.length}</Td><Td cls="text-xs text-gray-500">{v.join(", ")}</Td></>} /></Card>
    </div>
  );
}

// ═══ 매출·구독 지표(BO-STAT-02) — 회원사·결제 원천에서 계산(공급가 기준) ═══
function RevenueStats(){
  const mrr=TENANTS.reduce((a,t)=>a+mrrOf(t),0), paying=TENANTS.filter(t=>mrrOf(t)>0);
  const cur=BO_TODAY.slice(0,7)==="2026-10"?"2026-09":BO_TODAY.slice(0,7);
  const rev=m=>PAYMENTS.filter(p=>p.ym===m&&p.stat!=="실패").reduce((a,p)=>a+p.supply,0)-REFUNDS.filter(r=>r.stat==="완료"&&r.procAt.startsWith(m)).reduce((a,r)=>a+Math.round(r.amt/1.1),0);
  const months=[mAdd(cur,-3),mAdd(cur,-2),mAdd(cur,-1),cur], mx=Math.max(...months.map(rev),1);
  const dist=[...new Set(PLANS.map(p=>p.code))].map(c=>{const ts=TENANTS.filter(t=>t.plan===c&&mrrOf(t)>0);return {p:c,n:ts.length,m:ts.reduce((a,t)=>a+mrrOf(t),0)};});
  const atRisk=TENANTS.filter(t=>t.sub==="해지예정"||CANCELS.some(c=>c.co===t.name&&c.status==="신청")).reduce((a,t)=>a+mrrOf(t),0);
  return (
    <div className="p-5">
      <ScrHead id="BO-STAT-02" title="매출·구독 지표" pri="P0" path="통계·운영 > 통계" desc="월 반복 매출(MRR)·연 반복 매출(ARR)·회원사당 평균 매출(ARPA)·월별 확정 매출을 공급가(VAT 별도) 기준으로 계산합니다. 확정 매출은 결제 성공분에서 승인 완료된 환불을 뺀 값입니다." />
      <div className="grid grid-cols-2 gap-3 lg:grid-cols-4"><Stat n={won(mrr)+"원"} l="월 반복 매출(MRR)" tone="text-emerald-600" sub={paying.length+"개사 · 체험 제외"} /><Stat n={won(mrr*12)+"원"} l="연 반복 매출(ARR)" tone="text-emerald-600" /><Stat n={won(paying.length?Math.round(mrr/paying.length):0)+"원"} l="회원사당 평균 매출" tone="text-blue-600" /><Stat n={won(atRisk)+"원"} l="해지 예정 MRR" tone="text-red-500" sub="해지 신청·해지예정" /></div>
      <div className="mt-4 grid gap-4 lg:grid-cols-2">
        <Card title="월별 확정 매출(공급가)"><div className="space-y-2">{months.map(m=><div key={m} className="flex items-center gap-2 text-sm"><span className="w-16 text-gray-600">{m}</span><div className="h-3 flex-1 rounded bg-gray-100"><div className="h-3 rounded bg-blue-500" style={{width:rev(m)/mx*100+"%"}} /></div><span className="w-24 text-right font-mono text-gray-700">{won(rev(m))}</span></div>)}</div></Card>
        <Card title="요금제별 분포" pad={false}><Table min="360px" cols={[{t:"요금제"},{t:"유료 회원사",c:1},{t:"MRR",r:1},{t:"비중",r:1}]} rows={dist} render={r=><><Td cls="font-medium text-gray-800">{r.p}</Td><Td c>{r.n}</Td><Td r cls="font-mono">{won(r.m)}원</Td><Td r cls="text-gray-500">{mrr?Math.round(r.m/mrr*100):0}%</Td></>} /><p className="border-t border-gray-100 px-4 py-2 text-right text-xs text-gray-500">합계 {paying.length}개사 · {won(mrr)}원 = MRR</p></Card>
      </div>
    </div>
  );
}

// ═══ 운영자 계정(BO-ADM-01) ═══
function OperatorAccounts({ flash }){
  const re=useTick();
  const [m,setM]=useState(null);
  const sup=OPERATORS.filter(o=>o.role==="슈퍼관리자"&&o.stat==="활성");
  const canAdm=can("운영자·권한","W");
  const err=!m?"":!/^[^@\s]+@paydream\.io$/.test(m.email)?"회사 도메인(@paydream.io) 이메일만 초대할 수 있습니다.":OPERATORS.some(o=>o.email===m.email)?"이미 등록된 이메일입니다.":!m.name.trim()?"이름을 입력하세요.":!canAdm?"운영자 관리 권한이 없습니다(슈퍼관리자).":"";
  const act=(o,what)=>{ if(!canAdm) return flash("운영자 관리 권한이 없습니다(슈퍼관리자)."); if(o.name===BO.me&&what!=="초기화") return flash("본인 계정은 여기서 바꿀 수 없습니다 — 내 계정(BO-ACC-01)을 쓰세요.");

    if(what==="잠금"){ o.stat="잠금"; o.lockReason="관리자 수동 잠금"; } if(what==="해제"){ o.stat="활성"; o.lockReason=""; } if(what==="2FA 강제") o.mfa=true;
    audit("운영자 "+what,o.name,""); re(); flash(o.name+" — "+what+(what==="초기화"?" 링크를 보냈습니다(30분 유효).":" 처리했습니다.")); };
  return (
    <div className="p-5">
      <ScrHead id="BO-ADM-01" title="운영자 계정" pri="P0" path="통계·운영 > 운영자·권한" desc="운영자를 초대하고 역할을 정하며 잠금·해제·비밀번호 초기화·2FA를 관리합니다. 운영자는 전원 2FA 필수, 회사 도메인 이메일만 초대할 수 있습니다." />
      <div className="mb-3 flex justify-end"><Btn disabled={!canAdm} onClick={()=>setM({name:"",email:"",role:"CS"})}>+ 운영자 초대</Btn></div>
      {!canAdm&&<NoPerm menu="운영자·권한" />}
      <Card pad={false}>
        <Table min="900px" cols={[{t:"이름"},{t:"이메일"},{t:"역할",c:1},{t:"2FA",c:1},{t:"상태",c:1},{t:"최근 접속"},{t:""}]} rows={OPERATORS} render={o=><>
          <Td cls="font-medium text-gray-800">{o.name}{o.name===BO.me&&<span className="ml-1 text-xs text-blue-600">(나)</span>}</Td><Td cls="text-gray-600">{o.email}</Td>
          <Td c><select value={o.role} disabled={!canAdm||o.name===BO.me} onChange={e=>{if(o.role==="슈퍼관리자"&&sup.length<=1) return flash("마지막 슈퍼관리자의 역할은 바꿀 수 없습니다."); const b=o.role; o.role=e.target.value; audit("역할 변경",o.name,b+" → "+o.role); re();}} className={INP+" bg-white text-xs"}>{OP_ROLES.map(r=><option key={r}>{r}</option>)}</select></Td>
          <Td c>{o.mfa?<Badge tone="emerald">사용</Badge>:<button onClick={()=>act(o,"2FA 강제")} className="text-xs text-red-600 hover:underline">미설정 · 강제</button>}</Td>
          <Td c><StatusBadge s={o.stat} />{o.lockReason&&<span className="block text-[11px] text-gray-400">{o.lockReason}</span>}</Td><Td cls="text-gray-500">{o.last}</Td>

// ═══ 역할·권한(BO-ADM-02) — 실제로 화면 동작을 막는 매트릭스 ═══
function RolePermissions({ flash }){
  const re=useTick();
  const [role,setRole]=useState("CS"); const [draft,setDraft]=useState({...PERMS.CS});

  const save=()=>{ const diff=PERM_MENUS.filter(k=>PERMS[role][k]!==draft[k]).map(k=>k+" "+(PERMS[role][k]||"–")+"→"+(draft[k]||"–")); if(!diff.length) return; PERMS[role]={...draft}; audit("권한 변경",role,diff.join(", ")); re(); flash(role+" 권한을 저장했습니다(즉시 적용)."); };
  return (
    <div className="p-5">
      <ScrHead id="BO-ADM-02" title="역할·권한(RBAC)" pri="P0" path="통계·운영 > 운영자·권한" desc="역할별 메뉴 권한(R 열람 · W 편집 · X 실행)과 민감기능(대리 접속·환불·파기) 요청/승인 권한을 정합니다. 저장하면 운영 콘솔 버튼에 바로 적용되고, 슈퍼관리자 권한은 고정입니다." />
      <div className="mb-4 flex flex-wrap gap-2">{OP_ROLES.map(r=><button key={r} onClick={()=>{setRole(r);setDraft({...PERMS[r]});}} className={"rounded-md border px-3 py-1.5 text-sm font-medium "+(role===r?"border-blue-600 bg-blue-600 text-white":"border-gray-300 bg-white text-gray-600 hover:bg-gray-50")}>{r} <span className="text-xs opacity-70">{OPERATORS.filter(o=>o.role===r).length}</span></button>)}</div>

        <Table min="960px" cols={[{t:"일시"},{t:"운영자"},{t:"행위"},{t:"대상"},{t:"내용"},{t:"IP"},{t:"결과",c:1}]} rows={rows} render={a=><>

// ═══ 운영자 로그인·2FA(BO-AUTH-01) — 화면 미리보기(실제 인증은 개발 단계 SSO/OTP 연동) ═══
function AuthScreen({ go }){
  const [f,setF]=useState({email:"",pw:"",otp:"",step:1}); const [fail,setFail]=useState(0); const [msg,setMsg]=useState("");
  const op=OPERATORS.find(o=>o.email===f.email.trim());
  const next=()=>{ if(!op){ setFail(n=>n+1); return setMsg("이메일 또는 비밀번호가 맞지 않습니다."); } if(op.stat==="잠금") return setMsg("잠긴 계정입니다 — 슈퍼관리자에게 해제를 요청하세요."); if(f.pw.length<1){ return setMsg("비밀번호를 입력하세요."); } setMsg(""); setF({...f,step:2}); };
  const verify=()=>{ if(!/^\d{6}$/.test(f.otp)) return setMsg("OTP 6자리를 입력하세요."); BO.me=op.name; op.last=nowTs(); audit("로그인",op.name,"2FA(OTP) 통과"); go("BO-DSH-01"); };
  return (
    <div className="flex min-h-full items-center justify-center p-5">
      <div className="w-full max-w-sm">
        <ScrHead id="BO-AUTH-01" title="운영자 로그인" pri="P0" path="전역 > 인증" desc="이메일·비밀번호 다음 OTP(2차 인증)를 거쳐야 들어갑니다. 5회 연속 실패 시 잠기며, 허용된 IP에서만 접속할 수 있습니다." />
        <Card>
          <p className="mb-3 text-center text-lg font-extrabold text-blue-600">payDream <span className="rounded bg-blue-600 px-1.5 py-0.5 text-[10px] font-bold text-white">운영 콘솔</span></p>
          {f.step===1?<div className="space-y-3"><Field label="이메일"><input value={f.email} onChange={e=>setF({...f,email:e.target.value})} placeholder="name@paydream.io" className={INP+" w-full"} /></Field><Field label="비밀번호"><input type="password" autoComplete="off" value={f.pw} onChange={e=>setF({...f,pw:e.target.value})} className={INP+" w-full"} /></Field><Btn onClick={next} disabled={fail>=5}>다음</Btn>{fail>0&&<p className="text-xs text-gray-400">실패 {fail}/5</p>}</div>
            :<div className="space-y-3"><p className="text-sm text-gray-600">{op.name}님, OTP 앱의 6자리 번호를 입력하세요.</p><Field label="OTP"><input value={f.otp} maxLength={6} onChange={e=>setF({...f,otp:e.target.value.replace(/\D/g,"")})} className={INP+" w-full text-center font-mono tracking-widest"} /></Field><Btn onClick={verify}>로그인</Btn></div>}
          {msg&&<p className="mt-2 text-xs text-red-600">{msg}</p>}
          <p className="mt-4 text-[11px] text-gray-400">프로토타입: 운영자 이메일(예: kim@paydream.io)과 아무 비밀번호·OTP 6자리로 시연합니다. 운영 시 IP 허용목록·세션 8시간·비밀번호 90일 정책을 적용합니다.</p>
        </Card>
      </div>
    </div>
  );
}

// ═══ 내 계정(BO-ACC-01) ═══
function MyAccount({ flash }){
  const re=useTick();
  const o=meOp(); const [pw,setPw]=useState({cur:"",n1:"",n2:""}); const [alerts,setAlerts]=useState(o.alerts||{pay:true,sla:true,cancel:o.role!=="CS",refund:["슈퍼관리자","운영관리자","빌링담당"].includes(o.role)});
  const rule=s=>s.length>=12&&/[A-Za-z]/.test(s)&&/\d/.test(s)&&/[^A-Za-z0-9]/.test(s);
  const pErr=!pw.cur?"현재 비밀번호를 입력하세요.":!rule(pw.n1)?"새 비밀번호는 영문·숫자·특수문자 12자 이상입니다.":pw.n1===pw.cur?"현재와 다른 비밀번호를 쓰세요.":pw.n1!==pw.n2?"확인이 일치하지 않습니다.":"";
  const mine=AUDIT.filter(a=>a.op===o.name).slice(0,8);
  return (
    <div className="p-5">
      <ScrHead id="BO-ACC-01" title="내 계정" pri="P0" path="전역 > 우측 상단 아바타" desc="운영자 본인의 프로필·비밀번호·2FA·업무 알림을 관리하고 내 최근 처리 기록을 봅니다." />
      <div className="grid gap-4 lg:grid-cols-2">
        <Card title="프로필"><dl className="space-y-2 text-sm">{[["이름",o.name],["이메일",o.email],["역할",o.role+" (변경은 슈퍼관리자)"],["2FA",o.mfa?"OTP 사용":"미설정 — 다음 로그인 때 등록 필수"],["최근 접속",o.last]].map(([k,v])=><div key={k} className="flex justify-between gap-3"><dt className="text-gray-500">{k}</dt><dd className="font-medium text-gray-700">{v}</dd></div>)}</dl>
          <div className="mt-3 flex justify-end"><Btn tone="ghost" onClick={()=>{audit("OTP 재등록",o.name,"");flash("OTP 재등록 QR을 메일로 보냈습니다.");}}>OTP 재등록</Btn></div></Card>
        <Card title="비밀번호 변경"><div className="space-y-3">{[["현재 비밀번호","cur"],["새 비밀번호","n1"],["새 비밀번호 확인","n2"]].map(([l,k])=><Field key={k} label={l}><input type="password" autoComplete={k==="cur"?"current-password":"new-password"} value={pw[k]} onChange={e=>setPw({...pw,[k]:e.target.value})} className={INP+" w-full"} /></Field>)}
          {(pw.cur||pw.n1)&&pErr&&<Err m={pErr} />}<div className="flex justify-end"><Btn disabled={!!pErr} onClick={()=>{audit("비밀번호 변경",o.name,"다른 세션 종료");setPw({cur:"",n1:"",n2:""});flash("비밀번호를 바꿨습니다 — 다른 세션은 종료됩니다.");}}>변경</Btn></div></div></Card>
        <Card title="업무 알림(메일·메신저)"><div className="space-y-2 text-sm">{[["pay","결제 실패·미납 단계 변경"],["sla","SLA 임박·초과 문의"],["cancel","해지 신청 접수"],["refund","환불 승인 요청"]].map(([k,l])=><label key={k} className="flex items-center justify-between"><span className="text-gray-700">{l}</span><input type="checkbox" checked={!!alerts[k]} onChange={e=>{const a={...alerts,[k]:e.target.checked};setAlerts(a);o.alerts=a;audit("알림 설정",o.name,l+" "+(e.target.checked?"켬":"끔"));re();}} className="h-4 w-4 rounded border-gray-300" /></label>)}</div></Card>
        <Card title="내 최근 처리" pad={false}><Table min="380px" cols={[{t:"일시"},{t:"행위"},{t:"대상"}]} rows={mine} empty="기록이 없습니다." render={a=><><Td cls="text-xs text-gray-500">{a.at}</Td><Td cls="text-gray-700">{a.act}</Td><Td cls="text-xs text-gray-600">{a.target}</Td></>} /></Card>
      </div>
    </div>
  );
}
