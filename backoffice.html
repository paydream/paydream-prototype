function Wysiwyg({ html }){
  const ref=useRef(null);
  const cmd=(c,v)=>{ ref.current&&ref.current.focus(); document.execCommand(c,false,v); };
  const link=()=>{ const u=prompt("링크 URL을 입력하세요","https://"); if(u) cmd("createLink",u); };
  const img=()=>{ const u=prompt("이미지 URL을 입력하세요 (파일 업로드는 개발 단계 연동)","https://"); if(u) cmd("insertImage",u); };
  const Tb=({onClick,label,title,cls=""})=>(<button type="button" title={title} onMouseDown={e=>e.preventDefault()} onClick={onClick} className={"rounded px-2 py-1 text-sm text-gray-600 hover:bg-white hover:text-gray-900 "+cls}>{label}</button>);
  const Sep=()=><span className="mx-0.5 h-4 w-px bg-gray-300" />;
  return (
    <div className="rounded-md border border-gray-300 bg-white">
      <div className="flex flex-wrap items-center gap-0.5 rounded-t-md border-b border-gray-200 bg-gray-50 px-2 py-1.5">
        <select onChange={e=>{cmd("formatBlock",e.target.value); e.target.selectedIndex=0;}} className="mr-1 rounded border border-gray-200 bg-white px-1.5 py-1 text-xs text-gray-600">
          <option value="">본문 스타일</option><option value="H2">제목 H2</option><option value="H3">제목 H3</option><option value="P">본문</option>
        </select>
        <Tb onClick={()=>cmd("bold")} label="B" title="굵게" cls="font-bold" />
        <Tb onClick={()=>cmd("italic")} label="I" title="기울임" cls="italic" />
        <Tb onClick={()=>cmd("underline")} label="U" title="밑줄" cls="underline" />
        <Sep />
        <Tb onClick={()=>cmd("insertUnorderedList")} label="• 목록" title="글머리 목록" />
        <Tb onClick={()=>cmd("insertOrderedList")} label="1. 목록" title="번호 목록" />
        <Sep />
        <Tb onClick={link} label="🔗 링크" title="링크 삽입" />
        <Tb onClick={img} label="🖼 이미지" title="이미지 삽입(URL)" />
        <Sep />
        <Tb onClick={()=>cmd("removeFormat")} label="서식 지우기" title="서식 지우기" cls="text-xs" />
      </div>
      <div ref={ref} contentEditable suppressContentEditableWarning
        className="min-h-[180px] max-w-none px-3 py-2 text-sm leading-relaxed text-gray-700 focus:outline-none [&_h2]:text-lg [&_h2]:font-bold [&_h2]:my-1 [&_h3]:text-base [&_h3]:font-semibold [&_ul]:list-disc [&_ul]:pl-5 [&_ol]:list-decimal [&_ol]:pl-5 [&_a]:text-blue-600 [&_a]:underline [&_img]:my-2 [&_img]:max-w-full [&_img]:rounded"
        dangerouslySetInnerHTML={{__html: html||'<p class="text-gray-400">공지 본문을 입력하세요. 상단 도구모음으로 서식·링크·이미지를 넣을 수 있습니다.</p>'}} />
      <div className="flex items-center justify-between border-t border-gray-100 px-3 py-1.5 text-[11px] text-gray-400">
        <span>이미지는 URL 삽입 지원(파일 업로드는 개발 단계 스토리지 연동). 저장 시 HTML로 보관됩니다.</span>
      </div>
    </div>
  );
}

      <ScrHead id="BO-BILL-12" title="PG·결제 연동 설정" pri="P0" path="구독·결제 > 설정" desc="PG사·정기결제(빌링키) 연동 키와 웹훅을 설정합니다. 테스트/운영 분리. MVP 결제 수단은 카드(빌링키)이며 계좌 자동이체·가상계좌는 P1." />
      <div className="mx-auto max-w-2xl space-y-4">
        <Card title="PG 연동" right={<Badge tone="emerald">연결됨</Badge>}>
          <div className="space-y-4">
            <div className="grid grid-cols-2 gap-3">
              <Field label="PG사" req><select className={INP+" w-full bg-white"}><option>토스페이먼츠</option><option>나이스페이</option><option>KG이니시스</option></select></Field>
              <Field label="환경" req><select className={INP+" w-full bg-white"}><option>운영(Live)</option><option>테스트(Sandbox)</option></select></Field>
              <Field label="가맹점 ID(MID)" req><input defaultValue="paydream_live" className={INP+" w-full font-mono"} /></Field>
              <Field label="시크릿 키" req><input type="password" defaultValue="sk_live_****************" className={INP+" w-full font-mono"} /></Field>
            </div>
            <Field label="결제 수단" req><div className="flex flex-wrap gap-3 text-sm text-gray-700">{[["카드(정기결제·빌링키)",true],["계좌 자동이체(CMS) · P1",false],["가상계좌 · P1",false]].map(([o,on])=><label key={o} className={"flex items-center gap-1.5"+(on?"":" text-gray-400")}><input type="checkbox" defaultChecked={on} disabled={!on} className="h-4 w-4 rounded border-gray-300" />{o}</label>)}</div></Field>
          </div>
        </Card>
        <Card title="웹훅">
          <div className="space-y-3">
            <Field label="웹훅 URL" req><input defaultValue="https://api.paydream.io/webhook/pg" className={INP+" w-full font-mono"} /></Field>
            <div className="flex items-center justify-between rounded-md bg-slate-50 px-3 py-2 text-sm"><span className="text-gray-600">최근 수신</span><span className="text-gray-500">2026-08-30 03:10 · <span className="text-emerald-600">성공</span></span></div>
            <div className="flex justify-end gap-2"><Btn tone="ghost" onClick={()=>flash("실패 웹훅을 재발송했습니다.")}>웹훅 재발송</Btn></div>
          </div>
        </Card>
        <div className="flex justify-end gap-2">
          <Btn tone="ghost" onClick={()=>flash("PG 연결 테스트 성공.")}>연결 테스트</Btn>
          <Btn onClick={()=>flash("PG 연동 설정을 저장했습니다(암호화).")}>저장</Btn>
        </div>
        <div className="rounded-lg border-l-4 border-amber-400 bg-amber-50 px-4 py-3 text-xs text-amber-700"><b>보안</b> — 시크릿 키는 암호화 저장·마스킹되며 운영/테스트 환경을 분리합니다. 키 변경·연동 수정은 감사 로그(BO-ADM-03)에 기록됩니다.</div>
      </div>
    </div>
  );
}

// ─── 네비게이션 ───
const NAV = [
  { key:"dash", icon:ICN.dash, label:"대시보드", items:[["BO-DSH-01","운영 대시보드"]] },
  { key:"cust", icon:ICN.cust, label:"회원 관리", items:[["BO-CMP-01","회원 리스트"],["BO-CMP-08","해지·탈퇴"]] },
  { key:"bill", icon:ICN.bill, label:"구독·결제", items:[["BO-BILL-01","요금제 관리"],["BO-BILL-04","구독 목록"],["BO-BILL-06","결제증빙발급"],["BO-BILL-07","결제 내역"],["BO-BILL-08","미납·연체"],["BO-BILL-09","환불 관리"],["BO-BILL-11","정산·세무 리포트"],["BO-BILL-12","PG 연동 설정"]] },
  { key:"cs", icon:ICN.cs, label:"CS·공지", items:[["BO-SUP-01","1:1 문의함"],["BO-SUP-04","공지사항"]] },
  { key:"stat", icon:ICN.stat, label:"통계·운영", items:[["BO-STAT-02","매출·구독 지표"],["BO-ADM-01","운영자 계정"],["BO-ADM-02","역할·권한"],["BO-ADM-03","감사 로그"]] },
];
const TITLES = {}; NAV.forEach(g=>g.items.forEach(([id,nm])=>TITLES[id]=nm));
const PATHS = {}; NAV.forEach(g=>g.items.forEach(([id])=>PATHS[id]=g.label));
const PRIS = { "BO-DSH-01":"P0","BO-CMP-01":"P0","BO-CMP-02":"P0","BO-CMP-08":"P0","BO-BILL-01":"P0","BO-BILL-04":"P0","BO-BILL-06":"P0","BO-BILL-07":"P0","BO-BILL-08":"P0","BO-BILL-09":"P0","BO-BILL-11":"P0","BO-BILL-12":"P0","BO-SUP-01":"P0","BO-SUP-04":"P0","BO-STAT-02":"P0","BO-ADM-01":"P0","BO-ADM-02":"P0","BO-ADM-03":"P0","BO-SET-03":"P1","BO-SET-04":"P1" };

function App(){
  const [cur,setCur]=useState("BO-DSH-01");
  const [sel,setSel]=useState(null);
  const [toast,setToast]=useState("");
  const [open,setOpen]=useState({dash:true,cust:true,bill:true,cs:true,stat:true});
  const flash=m=>{ setToast(m); setTimeout(()=>setToast(""),2200); };
  const go=id=>{ setCur(id); };
  const openTenant=name=>{ const t=TENANTS.find(x=>x.name===name)||{name}; setSel(t); setCur("BO-CMP-02"); };
  const P0IMPL={ "BO-DSH-01":<Dashboard go={go} open={openTenant}/>, "BO-CMP-01":<TenantList go={go} setSel={setSel}/>, "BO-CMP-02":<TenantDetail sel={sel} go={go} flash={flash}/>,
    "BO-CMP-08":<Terminate flash={flash}/>, "BO-BILL-01":<PlansScreen flash={flash}/>,
    "BO-BILL-04":<SubList go={go} flash={flash} open={openTenant}/>, "BO-BILL-06":<Invoices flash={flash} open={openTenant}/>, "BO-BILL-07":<Payments open={openTenant}/>, "BO-BILL-08":<Overdue flash={flash} open={openTenant}/>,
    "BO-BILL-09":<Refunds flash={flash} open={openTenant}/>, "BO-BILL-11":<Settlement/>, "BO-BILL-12":<PGConfig flash={flash}/>,
    "BO-SUP-01":<SupportInbox flash={flash} open={openTenant}/>, "BO-SUP-04":<Notices flash={flash}/>,
    "BO-STAT-02":<RevenueStats/>, "BO-ADM-01":<OperatorAccounts flash={flash}/>, "BO-ADM-02":<RolePermissions flash={flash}/>, "BO-ADM-03":<AuditLog/> };
  const content = P0IMPL[cur] || <Placeholder id={cur} title={TITLES[cur]||cur} pri={PRIS[cur]||"P1"} path={(PATHS[cur]||"")+" > "+(TITLES[cur]||"")} />;
  return (
    <div className="flex h-screen flex-col">
      <header className="flex h-12 shrink-0 items-center gap-3 border-b border-gray-200 bg-white px-4">
        <span className="text-lg font-extrabold tracking-tight text-blue-600">payDream</span>
        <span className="rounded bg-blue-600 px-1.5 py-0.5 text-[10px] font-bold text-white">운영 콘솔</span>
        <div className="relative ml-2 hidden sm:block"><Ic cls="pointer-events-none absolute left-2.5 top-1/2 h-4 w-4 -translate-y-1/2 text-gray-400" d={ICN.search} /><input placeholder="회원사·인보이스 검색" className="w-64 rounded-full border border-gray-300 py-1.5 pl-8 pr-4 text-sm focus:border-blue-500 focus:outline-none" /></div>
        <div className="flex-1" />
        <span className="hidden text-sm text-gray-400 sm:inline">운영관리자</span>
        <div className="flex h-8 w-8 items-center justify-center rounded-full bg-blue-600 text-sm font-semibold text-white">운</div>
      </header>
      <div className="flex min-h-0 flex-1">
        <nav className="w-56 shrink-0 overflow-y-auto border-r border-gray-200 bg-white py-2">
          {NAV.map(g=>(
            <div key={g.key} className="px-2">
              <button onClick={()=>setOpen(o=>({...o,[g.key]:!o[g.key]}))} className="flex w-full items-center gap-2 rounded-md px-3 py-2 text-sm font-semibold text-gray-700 hover:bg-gray-50">
                <Ic cls="h-4 w-4 text-gray-400" d={g.icon} />{g.label}<span className="ml-auto text-xs text-gray-300">{open[g.key]?"▾":"▸"}</span>
              </button>
              {open[g.key] && <div className="mb-1 ml-4 border-l border-gray-100 pl-2">
                {g.items.map(([id,nm])=>(
                  <button key={id} onClick={()=>go(id)} className={"flex w-full items-center gap-1.5 rounded-md px-2.5 py-1.5 text-left text-sm "+(cur===id?"bg-blue-50 font-medium text-blue-700":"text-gray-600 hover:bg-gray-50")}>
                    {nm}{PRIS[id]==="P0" && cur!==id && <span className="ml-auto h-1.5 w-1.5 rounded-full bg-emerald-400" />}
                  </button>
                ))}
              </div>}
            </div>
          ))}
        </nav>
        <main className="min-w-0 flex-1 overflow-y-auto">{content}</main>
      </div>
      <Toast msg={toast} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
