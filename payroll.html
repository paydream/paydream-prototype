// 급여명세서 — 실수령액 (SCR-03-16)
function PayslipScreen() {
  const [gross, setGross] = useState("3,000,000");
  const [tax, setTax] = useState("74,350");
  const G = num(gross);           // 보수월액(건강·고용·산재 기초)
  const NP_CAP = 6370000, NP_FLOOR = 400000;
  const stdBase = Math.min(NP_CAP, Math.max(NP_FLOOR, Math.floor(G / 1000) * 1000)); // 기준소득월액(천원 절사·상하한)
  const npCapped = stdBase !== G;
  const np = stdBase * 0.0475;    // 국민연금 4.75% · 기준소득월액 기준(2026)
  const hi = G * 0.03595;         // 건강보험 3.595% · 보수월액 기준(2026)
  const ltc = hi * 0.1314;        // 장기요양 (건강보험의 13.14%, 2026)
  const ei = G * 0.009;           // 고용보험 0.9% · 보수월액 기준
  const it = num(tax);            // 소득세 (간이세액, 편집 가능)
  const local = it * 0.1;         // 지방소득세 10%
  const ded = np + hi + ltc + ei + it + local;
  const net = G - ded;
  return (
    <div className="p-5">
      <ScreenHeader scr="PAY-03-03" title="급여명세서 발행/조회" desc="지급 합계에서 4대보험·소득세를 공제해 실수령액을 계산합니다. 요율은 편집할 수 있습니다." />
      <div className="grid gap-4 lg:grid-cols-2">
        <div className="rounded-lg border border-gray-200 bg-white p-5 shadow-sm">
          <p className="mb-3 text-sm font-semibold text-gray-700">입력</p>
          <div className="space-y-3">
            <Labeled label="월 지급액 (세전)" unit="원" value={gross} onChange={v => setGross(Number(num(v)).toLocaleString())} />
            <Labeled label="소득세 (간이세액)" unit="원" value={tax} onChange={v => setTax(Number(num(v)).toLocaleString())} hint="간이세액표 기준 · 부양가족에 따라 상이" />
          </div>
        </div>
        <div className="rounded-lg border border-gray-200 bg-white shadow-sm">
          <div className="border-b border-gray-100 px-4 py-2.5 text-sm font-semibold text-gray-700">공제 내역</div>
          <div className="flex flex-wrap gap-x-4 gap-y-1 border-b border-gray-100 bg-slate-50/60 px-4 py-2 text-xs text-gray-500">
            <span>보수월액 <b className="text-gray-700">{won(G)}</b> <span className="text-gray-400">(건강·고용·산재)</span></span>
            <span>기준소득월액 <b className="text-gray-700">{won(stdBase)}</b> <span className="text-gray-400">(국민연금)</span>{npCapped && <span className="ml-1 rounded bg-amber-50 px-1 py-0.5 text-[10px] font-medium text-amber-600">{stdBase < G ? "상한" : "하한"}</span>}</span>
          </div>
          <div className="divide-y divide-gray-100">
            <ResRow label="지급 합계" value={won(G)} />
            <ResRow label="국민연금 (4.75% · 기준소득월액)" value={"− " + won(np)} />
            <ResRow label="건강보험 (3.595% · 보수월액)" value={"− " + won(hi)} />
            <ResRow label="장기요양 (건강×13.14%)" value={"− " + won(ltc)} />

// 연차·근속 계산 (SCR-MGT-01)
function LeaveCalcScreen() {
  const [join, setJoin] = useState("2021-03-02");
  const [baseD, setBaseD] = useState("2026-08-03");
  const j = new Date(join), b = new Date(baseD);
  let months = (b.getFullYear() - j.getFullYear()) * 12 + (b.getMonth() - j.getMonth());
  if (b.getDate() < j.getDate()) months -= 1;
  months = Math.max(0, months);
  const years = Math.floor(months / 12);
  let leave, rule;
  if (months < 12) { leave = Math.min(months, 11); rule = "1년 미만 · 개근 시 매월 1일(최대 11일)"; }
  else { leave = Math.min(15 + Math.floor((years - 1) / 2), 25); rule = "1년 이상 · 15일 + (근속−1)/2 가산(최대 25일)"; }
  return (
    <div className="p-5">
      <ScreenHeader scr="TA-04-01" title="연차 발생 기준" desc="입사일과 기준일로 근속기간과 연차 발생일수를 자동 계산합니다." />
      <div className="grid gap-4 lg:grid-cols-2">
        <div className="rounded-lg border border-gray-200 bg-white p-5 shadow-sm">
          <p className="mb-3 text-sm font-semibold text-gray-700">입력</p>
          <div className="space-y-3">
            <div><label className="mb-1 block text-sm font-medium text-gray-700">입사일</label><input type="date" value={join} onChange={e => setJoin(e.target.value)} className={INP + " w-full"} /></div>
            <div><label className="mb-1 block text-sm font-medium text-gray-700">기준일</label><input type="date" value={baseD} onChange={e => setBaseD(e.target.value)} className={INP + " w-full"} /></div>
          </div>
        </div>
        <div className="rounded-lg border border-gray-200 bg-white shadow-sm">
          <div className="border-b border-gray-100 px-4 py-2.5 text-sm font-semibold text-gray-700">계산 결과</div>
          <div className="divide-y divide-gray-100">
            <ResRow label="근속기간" value={years + "년 " + (months % 12) + "개월"} />
            <ResRow label="총 근속 개월수" value={months + "개월"} />
            <ResRow label="연차 발생일수" value={leave + "일"} strong accent />
          </div>
          <p className="px-4 py-3 text-xs text-gray-400">기준: {rule}</p>
        </div>
      </div>
      <CalcNote />
    </div>
  );
}

  const max = Math.max(...labels.map((_, i) => series.reduce((s, se) => s + se.vals[i], 0))) || 1;
  const bw = 40, gap = 24, H = 130;
  const W = labels.length * (bw + gap) + gap;
  return (
    <svg viewBox={"0 0 " + W + " " + (H + 22)} className="w-full" style={{ maxHeight: 180 }}>
      {labels.map((l, i) => {
        let y = H;
        return <g key={i} transform={"translate(" + (gap + i * (bw + gap)) + ",0)"}>
          {series.map((se, k) => { const h = se.vals[i] / max * H; y -= h; return <rect key={k} x={0} y={y} width={bw} height={Math.max(0, h)} fill={se.color} rx="2" />; })}
          <text x={bw / 2} y={H + 15} textAnchor="middle" fontSize="10" fill="#94a3b8">{l}</text>
        </g>;
      })}
    </svg>
  );
}
function RptLine({ labels, sets, area }) {
  const all = sets.flatMap(s => s.vals), max = Math.max(...all) || 1, min = 0;
  const W = (labels.length - 1) * 64 + 40, H = 120;
  const pt = (v, i) => [20 + i * 64, H - (v - min) / (max - min || 1) * (H - 20)];
  const ap = sets[0] ? sets[0].vals.map((v, i) => pt(v, i)) : [];
  return (
    <svg viewBox={"0 0 " + W + " " + (H + 22)} className="w-full" style={{ maxHeight: 170 }}>
      {area && ap.length > 0 && <path d={"M" + ap.map(p => p[0] + " " + p[1]).join(" L ") + " L " + ap[ap.length - 1][0] + " " + H + " L " + ap[0][0] + " " + H + " Z"} fill={sets[0].color} opacity="0.12" />}
      {sets.map((s, si) => { const pts = s.vals.map((v, i) => pt(v, i)); const d = "M" + pts.map(p => p[0] + " " + p[1]).join(" L "); return <g key={si}><path d={d} fill="none" stroke={s.color} strokeWidth="2" />{pts.map((p, i) => <circle key={i} cx={p[0]} cy={p[1]} r="3" fill={s.color} />)}</g>; })}
      {labels.map((l, i) => <text key={i} x={pt(0, i)[0]} y={H + 15} textAnchor="middle" fontSize="10" fill="#94a3b8">{l}</text>)}
    </svg>
  );
}
function smoothPath(pts) {
  if (pts.length < 2) return "";
  let d = "M" + pts[0][0] + " " + pts[0][1];
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    const c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = p1[1] + (p2[1] - p0[1]) / 6;
    const c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = p2[1] - (p3[1] - p1[1]) / 6;
    d += " C" + c1x.toFixed(1) + " " + c1y.toFixed(1) + " " + c2x.toFixed(1) + " " + c2y.toFixed(1) + " " + p2[0].toFixed(1) + " " + p2[1].toFixed(1);
  }
  return d;
}
function LaborTrend() {
  const labels = ["3월", "4월", "5월", "6월", "7월", "8월"];
  const vals = [168, 171, 175, 173, 179, 182]; // 백만원

  const PADL = 48, PADR = 16, PADT = 18, PADB = 24, Wd = 540, Hd = 210;
  const iw = Wd - PADL - PADR, ih = Hd - PADT - PADB;
  const xx = i => PADL + (i / (labels.length - 1)) * iw;
  const yy = v => PADT + (1 - (v - yMin) / (yMax - yMin)) * ih;
  const pts = vals.map((v, i) => [xx(i), yy(v)]);
  const line = smoothPath(pts);
  const areaD = line + " L" + xx(labels.length - 1).toFixed(1) + " " + (PADT + ih) + " L" + xx(0).toFixed(1) + " " + (PADT + ih) + " Z";
  return (
    <svg viewBox={"0 0 " + Wd + " " + Hd} className="w-full" style={{ maxHeight: 220 }}>
      <defs><linearGradient id="ltg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#2563eb" stopOpacity="0.20" /><stop offset="100%" stopColor="#2563eb" stopOpacity="0.02" /></linearGradient></defs>
      {ticks.map((t, i) => <g key={i}><line x1={PADL} y1={yy(t)} x2={Wd - PADR} y2={yy(t)} stroke="#eef2f7" strokeWidth="1" /><text x={PADL - 8} y={yy(t) + 3} textAnchor="end" fontSize="10" fill="#94a3b8">{(t / 100).toFixed(2)}억</text></g>)}

      <path d={line} fill="none" stroke="#2563eb" strokeWidth="2.5" strokeLinecap="round" />
      {pts.map((p, i) => <g key={i}><circle cx={p[0]} cy={p[1]} r="3.6" fill="#fff" stroke="#2563eb" strokeWidth="2" /><text x={p[0]} y={p[1] - 9} textAnchor="middle" fontSize="9" fontWeight="600" fill="#334155">{(vals[i] / 100).toFixed(2)}</text></g>)}
      {labels.map((l, i) => <text key={i} x={xx(i)} y={Hd - 6} textAnchor="middle" fontSize="10" fill="#94a3b8">{l}</text>)}
    </svg>
  );
}
function RptDonut({ segs }) {
  const total = segs.reduce((s, x) => s + x.val, 0) || 1; let a = -90;
  const R = 54, r = 32, cx = 70, cy = 70;
  const arc = val => { const ang = val / total * 360, a2 = a + ang, large = ang > 180 ? 1 : 0; const P2 = (deg, rad) => [(cx + rad * Math.cos(deg * Math.PI / 180)).toFixed(2), (cy + rad * Math.sin(deg * Math.PI / 180)).toFixed(2)]; const s1 = P2(a, R), e1 = P2(a2, R), s2 = P2(a2, r), e2 = P2(a, r); a = a2; return "M" + s1 + " A" + R + " " + R + " 0 " + large + " 1 " + e1 + " L" + s2 + " A" + r + " " + r + " 0 " + large + " 0 " + e2 + " Z"; };
  return (
    <div className="flex items-center gap-5">
      <svg viewBox="0 0 140 140" className="h-32 w-32 shrink-0">{segs.map((se, i) => <path key={i} d={arc(se.val)} fill={se.color} />)}</svg>
      <div className="flex-1 space-y-1.5">{segs.map((se, i) => <div key={i} className="flex items-center gap-2 text-xs"><span className="h-2.5 w-2.5 rounded-sm" style={{ background: se.color }} /><span className="text-gray-600">{se.name}</span><span className="ml-auto font-medium text-gray-800">{Math.round(se.val / total * 100)}%</span></div>)}</div>
    </div>
  );
}

function payCompute(pay, mode) {
  // 사업소득(프리랜서) 3.3% 원천징수 — 소득세 3% + 지방소득세 0.3%, 4대보험 없음
  if (mode === "사업소득(3.3%)") {
    const it = Math.round(pay * 0.03), lt = Math.round(pay * 0.003), ded = it + lt;
    return { np: 0, hi: 0, ltc: 0, ei: 0, it, lt, ded, net: pay - ded, taxable: pay, stdBase: 0, mode };
  }
  // 기타소득 8.8% — 필요경비 60% 공제 후 과세 40%, 소득세 20% + 지방 2% = 실효 8.8%, 4대보험 없음
  if (mode === "기타소득(8.8%)") {
    const base = Math.round(pay * 0.4);
    const it = Math.round(base * 0.20), lt = Math.round(it * 0.1), ded = it + lt;
    return { np: 0, hi: 0, ltc: 0, ei: 0, it, lt, ded, net: pay - ded, taxable: base, stdBase: 0, mode };
  }
  // 상용(월급여·주급 등) — 간이세액 + 4대보험
  const taxable = Math.max(0, pay - 200000);                                  // 보수월액(과세소득)
  const stdBase = Math.min(6370000, Math.max(400000, Math.floor(taxable / 1000) * 1000)); // 기준소득월액(천원 절사·상하한)
  const np = Math.round(stdBase * 0.0475), hi = Math.round(taxable * 0.03595), ltc = Math.round(hi * 0.1314), ei = Math.round(taxable * 0.009);
  const it = Math.round(taxable * 0.03), lt = Math.round(it * 0.1);
  const ded = np + hi + ltc + ei + it + lt;
  return { np, hi, ltc, ei, it, lt, ded, net: pay - ded, taxable, stdBase, mode: mode || "상용" };
}

          <div>

            <div><label className="mb-1 block font-medium text-gray-700"><span className="text-red-500">*</span>코드</label><input defaultValue={modal.row ? modal.row.code : ""} placeholder="예: D01" className={INP + " w-full font-mono"} /><Hint>유일</Hint></div>

          </div>
          <div className="grid grid-cols-2 gap-3">

          </div>
          {bad && <p className="rounded-md bg-red-50 px-3 py-2 text-xs text-red-600">⚠ '{kind}'와 '{tax}'는 상충합니다. 종류에 맞는 과세 방식으로 변경해야 저장됩니다({PC_DEF[kind][0]} 권장).</p>}
          {tax === "기타소득(8.8%)" && <p className="rounded-md bg-amber-50 px-3 py-2 text-xs text-amber-700">⚠ 기타소득(8.8%)은 <b>일시적·비반복</b> 인적용역에만 적용합니다. <b>반복·계속적</b>으로 지급하면 사업소득(3.3%)으로 분류해야 하며, 반복 지급을 8.8%로 처리하면 소득구분 오류·세무 리스크가 있습니다.</p>}
          {tax === "사업소득(3.3%)" && <p className="rounded-md bg-rose-50 px-3 py-2 text-xs text-rose-600">인적용역 사업소득 원천징수 3.3%(소득세 3% + 지방소득세 0.3%). 4대보험 대상이 아니며(고용관계 아님) 지급명세서·간이지급명세서 제출 대상입니다.</p>}
          <div className="flex items-center justify-between rounded-md border border-gray-200 px-4 py-3">
            <div><p className="text-sm font-medium text-gray-800">사용여부</p><p className="text-xs text-gray-400">미사용 코드는 급여 계산 선택 목록에서 제외</p></div>
            <Tog on={muse} onClick={() => setMuse(v => !v)} />
          </div>
        </TreeModal>
      )}
      {toast && <div className="fixed bottom-6 left-1/2 z-50 -translate-x-1/2 rounded-md bg-gray-800 px-4 py-2 text-sm text-white shadow-lg">{toast}</div>}
    </div>
  );
}

function specOpts(d){ if(!d) return ["(선택)"]; var a=String(d).split("/").map(function(s){return s.replace(/\(.*$/,"").trim();}).filter(Boolean); return a.length?a.slice(0,8):["(선택)"]; }
function SpecControl({ f }){

  if(it.indexOf("드롭다운")>=0) return <select className={INP+" bg-white "+w}>{specOpts(f.desc).map(function(o){return <option key={o}>{o}</option>;})}</select>;
  if(it.indexOf("라디오")>=0) return <div className="flex flex-wrap gap-4">{specOpts(f.desc).slice(0,4).map(function(o){return <label key={o} className="flex items-center gap-1.5 text-sm text-gray-600"><input type="radio" name={f.no+f.label} className="text-blue-600"/>{o}</label>;})}</div>;
  if(it.indexOf("체크")>=0) return <input type="checkbox" className="h-4 w-4 rounded border-gray-300 text-blue-600"/>;
  if(it.indexOf("날짜")>=0) return <input type="date" className={INP+" "+w}/>;
  if(it.indexOf("에디터")>=0) return <textarea rows={3} className={INP+" resize-none "+w} placeholder="마크다운 지원"/>;
  if(it.indexOf("주소")>=0) return <div className={"flex gap-2 "+w}><input className={INP+" w-full"} placeholder="주소"/><button className="whitespace-nowrap rounded-md border border-gray-300 px-3 text-sm text-gray-600">주소검색</button></div>;
  return <input className={INP+" "+w} placeholder={f.desc}/>;
}

function OrgCodeScreen() {
  useRefSync();
  const nodes = REF.orgs; // 직원 등록(HR-04-01) 빠른 설정과 공유
  const setNodes = fn => { REF.orgs = typeof fn === "function" ? fn(REF.orgs) : fn; refChanged(); };
  const idRef = { get current() { return REF.orgSeq; }, set current(v) { REF.orgSeq = v; } };
  const [modal, setModal] = useState(null);
  const [mform, setMform] = useState({ name: "", code: "" });
  const [collapsed, setCollapsed] = useState({});
  const [toast, setToast] = useState("");
  const flash = m => { setToast(m); setTimeout(() => setToast(""), 1800); };
  const childrenOf = pid => nodes.filter(n => n.parent === pid).sort((a, b) => a.code.localeCompare(b.code));
  const descIds = id => { let out = []; const rec = p => childrenOf(p).forEach(c => { out.push(c.id); rec(c.id); }); rec(id); return out; };
  const openAdd = (parentId, depth, parentName) => { setMform({ name: "", code: "" }); setModal({ mode: "add", parentId, depth, parentName }); };
  const openEdit = (n) => { setMform({ name: n.name, code: n.code }); setModal({ mode: "edit", node: n }); };
  const openDel = (n) => setModal({ mode: "del", node: n, cnt: descIds(n.id).length });
  const addNode = () => { setNodes(p => [...p, { id: idRef.current++, code: mform.code || "0000", name: mform.name || "새 부서", parent: modal.parentId, depth: modal.depth }]); setModal(null); flash("부서를 추가했습니다."); };
  const saveEdit = () => { setNodes(p => p.map(n => n.id === modal.node.id ? { ...n, name: mform.name, code: mform.code } : n)); setModal(null); flash("부서 정보를 수정했습니다."); };
  const delNode = () => { const rm = new Set([modal.node.id, ...descIds(modal.node.id)]); setNodes(p => p.filter(n => !rm.has(n.id))); setModal(null); flash("부서를 삭제했습니다."); };
  const parentNameOf = (n) => { const pp = nodes.find(x => x.id === n.parent); return pp ? pp.name + " (" + pp.code + ")" : "(최상위) 전사"; };
  const LBL = "mb-1 block text-sm font-medium text-gray-700";

  const renderTree = (pid) => childrenOf(pid).map(n => {
    const kids = childrenOf(n.id);
    const isCol = collapsed[n.id];
    return (
      <React.Fragment key={n.id}>
        <div className="flex items-center gap-2 border-b border-gray-100 py-2 pr-3 hover:bg-slate-50" style={{ paddingLeft: ((n.depth - 1) * 24 + 12) + "px" }}>
          <button onClick={() => setCollapsed(c => ({ ...c, [n.id]: !c[n.id] }))} className={"w-4 shrink-0 text-gray-400 " + (kids.length ? "" : "invisible")}>{isCol ? "▸" : "▾"}</button>
          <span className="text-sm font-medium text-gray-800">{n.name}</span>
          <span className="text-xs text-gray-400">{n.code}</span>
          {kids.length > 0 && <span className="text-[11px] text-gray-400">· 하위 {kids.length}</span>}
          <div className="ml-auto flex shrink-0 gap-1">
            {n.depth < 3 && <button onClick={() => openAdd(n.id, n.depth + 1, n.name + " (" + n.code + ")")} className="rounded border border-blue-200 px-2 py-0.5 text-xs text-blue-600 hover:bg-blue-50">+ 하위 부서</button>}
            <button onClick={() => openEdit(n)} className="rounded border border-gray-300 px-2 py-0.5 text-xs text-gray-600 hover:bg-gray-50">수정</button>
            <button onClick={() => openDel(n)} className="rounded border border-red-200 px-2 py-0.5 text-xs text-red-600 hover:bg-red-50">삭제</button>
          </div>
        </div>
        {!isCol && renderTree(n.id)}
      </React.Fragment>
    );
  });

  return (
    <div className="p-5">
      <ScrHead title="부서관리" id="HR-02-01" pri="P0" path="인사/조직 > 조직 > 부서관리" />
      <div className="rounded-lg border border-gray-200 bg-white shadow-sm">
        <div className="flex flex-wrap items-center justify-between gap-2 border-b border-gray-200 px-5 py-3">
          <span className="text-sm font-semibold text-gray-700">부서 트리 <span className="ml-1 text-xs font-normal text-gray-400">최대 3단계</span></span>
          <div className="flex gap-2">
            <button onClick={() => openAdd(0, 1, "(최상위) 전사")} className="rounded-md bg-blue-600 px-3 py-1.5 text-sm font-medium text-white hover:bg-blue-700">+ 최상위 부서</button>
            <button className="rounded-md border border-gray-300 px-3 py-1.5 text-sm text-gray-600 hover:bg-gray-50">엑셀 다운로드</button>
          </div>
        </div>
        <div className="py-1">{childrenOf(0).length ? renderTree(0) : <p className="px-5 py-6 text-center text-sm text-gray-400">등록된 부서가 없습니다. ‘+ 최상위 부서’로 추가하세요.</p>}</div>
      </div>

      <NotesBox items={["부서는 최대 3단계까지 상·하위로 구성합니다.", "‘+ 하위 부서’는 3단계에서는 표시되지 않습니다.", "상위 부서를 삭제하면 하위 부서도 함께 삭제됩니다(삭제 전 확인).", "부서는 직원 소속·인사발령·급여 소속의 기준 마스터입니다(구 조직도 HR-02-02 흡수)."]} />

      {modal && modal.mode !== "del" && (
        <TreeModal title={modal.mode === "add" ? "부서 추가" : "부서 수정"} badge="HR-02-01-M1" submit={modal.mode === "add" ? "추가" : "저장"}
          onClose={() => setModal(null)} onSubmit={modal.mode === "add" ? addNode : saveEdit}>
          <div><label className={LBL}>상위 부서</label><input readOnly value={modal.mode === "add" ? modal.parentName : parentNameOf(modal.node)} className={INP + " w-full bg-gray-50"} /></div>
          <div><label className={LBL}>부서명</label><input value={mform.name} onChange={e => setMform(f => ({ ...f, name: e.target.value }))} placeholder="예: 마케팅팀" className={INP + " w-full"} /></div>

        </TreeModal>
      )}
      {modal && modal.mode === "del" && (
        <TreeModal title="부서 삭제" badge="HR-02-01-M2" submit="삭제" danger onClose={() => setModal(null)} onSubmit={delNode}>
          <p className="text-sm text-gray-600"><b className="text-gray-800">{modal.node.name} ({modal.node.code})</b> 부서를 삭제합니다.{modal.cnt > 0 && <span className="font-medium text-red-600"> 하위 부서 {modal.cnt}개도 함께 삭제됩니다.</span>} 소속 직원이 있으면 재배치가 필요합니다.</p>
        </TreeModal>
      )}
      {toast && <div className="fixed bottom-6 left-1/2 z-50 -translate-x-1/2 rounded-md bg-gray-800 px-4 py-2 text-sm text-white shadow-lg">{toast}</div>}
    </div>
  );
}
function TreeModal({ title, badge, submit, danger, onClose, onSubmit, children }) {

    <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4">
      <div className="max-h-[90vh] w-full max-w-md overflow-y-auto rounded-lg bg-white shadow-xl">

R-03-01": {"user": "인사 발령에서 고를 수 있는 발령 종류와 사유를 미리 만들어 두는 곳이에요.", "dev": ["[개요] 입사·부서이동·승진·휴직·복직·퇴직 등 발령 유형과 사유 세트를 목록으로 관리한다. 인사 발령(HR-04-02)의 발령유형·사유 선택지가 여기서 정의된다.", "[데이터] appt_type(type)", "[흐름] 독립 화면(선행/후행 업무흐름 없음 — 목록·설정·조회성)", "우선순위 P1"]}, "HR-03-02": {"user": "입사 등록 때 사번을 자동으로 만들어 주는 규칙을 정하는 곳이에요.", "dev": ["[개요] 입사 등록 시 사번을 자동 채번하는 규칙을 설정한다.", "[데이터] emp_no_rule(method·pattern·year_prefix·seq·pad_len)", "[흐름] 독립 화면(선행/후행 업무흐름 없음 — 목록·설정·조회성)", "우선순위 P1"]}, "HR-04-01": {"user": "새 직원을 등록하는 곳이에요. 기본 인적사항, 소속, 발령 내용을 등록하고 직원을 초대할 수 있어요.", "dev": ["[개요] 입력한 부서·직위로 최초 발령과 급여 소속이 자동 생성됩니다. 직원·최초발령·계정을 하나의 트랜잭션으로 처리하며(실패 시 롤백), 필요 시 직원계정 초대를 함께 발송합니다. (사업장 지정은 P1)", "[데이터] employee(name·rrn·email·join_date·site_id·job_rank·emp_type·emp_no)", "[ENUM] EMP_TYPE: 정규직 / 계약직(기간제) / 일용직 / 단시간(파트타임) / 파견 / 프리랜서(외주)", "[흐름] F1 흐름: PAY-01-04 → HR-04-01 → HR-06-03  ·  F9 흐름: (시작) → HR-04-01 → HR-06-02", "우선순위 P0"]}, "HR-04-02": {"user": "재직 중인 직원의 부서 이동·승진·전보·휴직·복직을 처리하고 이력을 남기는 곳이에요. 퇴직은 별도 화면에서 합니다.", "dev": ["[개요] 재직 직원의 부서이동·승진·전보·휴직·복직 발령을 처리하고 이력을 누적합니다. 발령 시 현재 소속이 갱신되고, 급여·계정에 연동됩니다. 퇴직은 별도 [퇴직 처리] 메뉴에서 진행합니다.", "[데이터] appointment(employee_id·type·appt_date·target·reason·file)", "[흐름] 독립 화면(선행/후행 업무흐름 없음 — 목록·설정·조회성)", "우선순위 P0"]}, "HR-04-03": {"user": "여러 명의 발령을 엑셀로 한 번에 등록하는 곳이에요.", "dev": ["[개요] 발령 내역을 엑셀로 대량 등록한다. [일괄 업로드] 클릭 시 파일 탐색창이 즉시 열리고, 파일을 선택하면 같은 화면에 검증 결과가 표시된다(중간 단계 없음). 정상 행만 반영하고 오류 행은 사유와 함께 제외한다. 양식은 [양식 다운로드]에서 받는다. 근태 일괄 업로드(TA-03-04)·개인 근무유형 일괄 업로드(TA-03-01-M2)와 동일한 업로드 UX 패턴이다.", "[데이터] appointment(effective_date·appt_type_id)", "[흐름] 독립 화면(선행/후행 업무흐름 없음 — 목록·설정·조회성)", "우선순위 P1"]}, "HR-04-04": {"user": "전체 직원을 보여주는 곳이에요. 검색필터에서 찾을 수 있으며 이름을 클릭하면 해당 직원의 상세 정보를 확인할 수 있어요.", "dev": ["[개요] 직원관리의 기본 진입점입니다. 조건으로 검색·필터한 뒤, 직원 셀(이름)을 클릭하면 해당 직원의 직원 정보(HR-04-05) 상세로 이동합니다.", "[데이터] employee(columns·sort_order)", "[흐름] 독립 화면(선행/후행 업무흐름 없음 — 목록·설정·조회성)", "우선순위 P0"]}, "HR-04-05": {"user": "직원 한 명의 인사·발령·급여·근태·문서를 탭으로 모아 보는 상세 화면이에요.", "dev": ["[개요] 직원 1인의 인사·발령·급여·근태·문서를 탭으로 통합 조회하는 마스터 상세화면.", "[데이터] employee(name·rrn·email·basic·join_date·site_id·emp_type·appt_history) / salary_contract(annual_amount) / award_discipline", "[ENUM] EMP_TYPE: 정규직 / 계약직(기간제) / 일용직 / 단시간(파트타임) / 파견 / 프리랜서(외주)", "[흐름] 독립 화면(선행/후행 업무흐름 없음 — 목록·설정·조회성)", "우선순위 P0"]}, "HR-04-06": {"user": "내 인사·급여·근태·문서를 한곳에서 확인하는 곳이에요. 프로필 사진을 바꾸거나 정보 변경을 신청할 수 있어요.", "dev": ["[개요] 인사기록카드(HR-04-05)의 본인 뷰입니다. 본인 인사·발령·급여·근태·문서를 6개 탭으로 통합 조회하며 본인 데이터만 노출됩니다(권한별 탭 축소). 프로필 사진 업로드/변경(HR-04-07)을 지원하고, 정보 변경은 서식 신청(FRM-04)으로 반영됩니다.", "[데이터] employee_profile(family·education·career·license·military)", "[흐름] 독립 화면(선행/후행 업무흐름 없음 — 목록·설정·조회성)", "우선순위 P1"]}, "HR-04-07": {"user": "직원 증명사진을 올리는 곳이에요. 한 명씩 또는 여러 명을 한 번에 올릴 수 있고, 올린 사진은 목록·조직도에 표시됩니다.", "dev": ["[개요] 증명사진을 개별(미리보기·크롭 후 저장) 또는 일괄(zip·파일명=사번)로 업로드합니다. 등록한 사진은 직원 목록·정보·조직도의 아바타로 표시됩니다.", "[데이터] employee(employee_id·photo·mapping)", "[흐름] 독립 화면(선행/후행 업무흐름 없음 — 목록·설정·조회성)", "우선순위 P0"]}, "HR-04-08": {"user": "직원의 퇴직을 처리하는 곳이에요. 퇴직 유형과 날짜를 입력해 확정하면 계정·급여가 정리되고 퇴직금 정산으로 이어집니다.", "dev": ["[개요] 재직·휴직 직원의 퇴직(자진퇴사·권고사직·계약만료·해고·정년)을 처리하는 전용 화면입니다. 퇴직 확정 시 재직상태가 '퇴직'으로 전환되고 계정 비활성·급여 정지가 연동되며, 퇴직금 정산(PAY-04-01)·4대보험 상실신고로 이어집니다. (인사 발령 HR-04-02에서 분리)", "[데이터] appointment(employee_id) / resignation(resign_type·last_work_date·reason·doc_url·severance_target) / employee(resign_date)", "[ENUM] RESIGN_TYPE: 자진퇴사 / 권고사직 / 계약만료 / 해고 / 정년", "[흐름] F8 흐름: (시작) → HR-04-08 → PAY-04-01", "우선순위 P0"]}, "HR-04-09": {"user": "직원의 포상과 징계를 기록하고 이력을 남기는 곳이에요.", "dev": ["[개요] 직원의 포상(표창·포상금·특별휴가 등)과 징계(견책·감봉·정직·강등·해임·파면)를 등록하고 이력을 누적합니다. 상벌 이력은 인사기록카드(HR-04-05)에 반영되며, 기록 중심으로 관리합니다. 감봉 등 급여 반영은 급여 항목에서 수기 처리하고(자동 연동 P2), 인사 발령(HR-04-02)·퇴직 처리(HR-04-08)와 별개 화면입니다.", "[데이터] award_discipline(category·type·event_date·reason·attachments)", "[ENUM] AWARD_DISCIPLINE_CATEGORY: 포상 / 징계", "[흐름] 독립 화면(선행/후행 업무흐름 없음 — 목록·설정·조회성)", "우선순위 P1"]}, "HR-06-01": {"user": "직원 로그인 계정을 관리하는 곳이에요. 초대 재발송·역할 변경·잠금·비밀번호 초기화를 할 수 있어요.", "dev": ["[개요] 발급된 직원 계정(로그인 주체)을 목록으로 관리합니다. 연결 직원·역할·상태·최근 로그인을 확인하고, 초대 재발송·역할 변경·잠금/해제·비밀번호 초기화·비활성화를 수행합니다. 최초 초대 발송은 직원 등록(HR-04-01)에서 시작됩니다.", "[데이터] account(status·role_id·last_login_at) · audit_log(역할·상태 변경 이력)", "[ENUM] ACCT_STATUS: 활성 / 초대중(인증 전) / 잠금 / 비활성", "[규칙] 최고관리자 최소 1명 유지 · 본인 잠금·역할 변경 불가 · 퇴직 시 자동 비활성", "[흐름] 독립 화면(선행/후행 업무흐름 없음 — 목록·설정·조회성)", "우선순위 P0"]}, "HR-06-02": {"user": "가입 때 받은 이메일 링크로 계정을 활성화하는 화면이에요.", "dev": ["[개요] 계정 생성 시 본인 이메일로 인증 링크/코드를 보내 계정을 활성화한다(OTP·2차 인증 대체).", "[데이터] account(email·password·password_confirm·agreement·status)", "[ENUM] ACCT_STATUS: 활성 / 대기(인증전) / 잠금 / 비활성", "[흐름] F0 흐름: (시작) → HR-06-02 → SET-06  ·  F9 흐름: HR-04-01 → HR-06-02 → PAY-02-02", "우선순위 P0"]}, "HR-06-03": {"user": "관리자(최고관리자·급여 담당자)가 메뉴마다 조회·편집·확정·승인 중 무엇을 할 수 있는지 정하는 곳이에요.", "dev": ["[개요] 관리자 역할별로 메뉴마다 조회·편집·확정·승인 권한을 정합니다. 계정·권한, 구독·결제·서비스 해지는 최고관리자 전용입니다. 권한 변경은 저장 즉시 적용되며 감사 로그에 기록됩니다.", "[데이터] role(role_id·name·permissions) · audit_log(권한 변경 이력)", "[흐름] F1 흐름: HR-04-01 → HR-06-03(관리자 역할별 권한 설정) → PAY-02-04", "우선순위 P0"]}, "HR-06-04": {"user": "직원이 직접 가입한 경우 승인하고 기존 직원 정보와 연결하는 곳이에요. (도입 예정)", "dev": ["[개요] 직원 직접가입(self-signup) 시 발생하는 승인 대기 계정을 검토하여 기존 직원 레코드에 매칭하거나 신규 직원으로 생성해 연결한다. 초대 전용 MVP에서는 미사용이며, self-signup(P1) 도입 시 활성화된다.", "[데이터] account(status·emp_id)", "[ENUM] ACCT_STATUS: 활성 / 대기(인증전) / 잠금 / 비활성", "[흐름] 독립 화면(선행/후행 업무흐름 없음 — 목록·설정·조회성)", "우선순위 P1"]}, "HR-06-05": {"user": "내 프로필 사진과 비밀번호를 바꾸는 곳이에요.", "dev": ["[개요] 본인 계정의 프로필 사진·비밀번호를 설정합니다. 로그인 계정(HR-06-01)과 연결된 본인 전용 설정입니다.", "[데이터] account(photo·name·email·password·role_id·target)", "[흐름] 독립 화면(선행/후행 업무흐름 없음 — 목록·설정·조회성)", "우선순위 P0"]}, "PAY-01-01": {"user": "급여에 들어갈 지급·공제·비과세 항목을 만들고 계산 방식을 정하는 곳이에요.", "dev": ["[개요] 지급·공제·비과세 항목을 관리하고 항목별 계산식(수식빌더)과 통상임금 포함 여부를 설정합니다. 공제는 법정 6종(시스템 제공)과 사용자정의로 나뉩니다. 급여 계산(PAY-03-01)의 기준이 되며, 구 명칭은 '수당/공제 항목 구성'입니다.", "[데이터] pay_item(item_type·name·calc_type·formula·ordinary_flag·tax_free_limit·taxable·use_yn)", "[ENUM] CALC_TYPE: 정액 / 정률 / 수식(빌더) / 근태연동", "[흐름] F1 흐름: TA-06-01 → PAY-01-01 → PAY-01-02", "우선순위 P0"]}, "PAY-01-02": {"user": "일할 계산 기준과 무급 공제 방식을 정하는 곳이에요.", "dev": ["[개요] 일할 계산 기준을 설정하고, 근태코드(TA-01-02)의 유급/무급을 상속해 급여 공제를 결정합니다. 사용중 근태코드를 다시 설정하지 않고, 조정 여지가 있는 무급 코드 공제 방식·지각/외출 시간공제만 편집합니다. 발령유형별 지급율은 HR-03-01(P1) 도입 시 확장합니다.", "[데이터] pay_code(pay_rate) / pay_item(rate_pct)", "[흐름] F1 흐름: PAY-01-01 → PAY-01-02 → PAY-01-03", "우선순위 P0"]}, "PAY-01-03": {"user": "급여 종류(월급·일용·상여 등)와 세금 계산 방식·산정 단위를 정하는 곳이에요.", "dev": ["[개요] 급여 종류(월급여·일용급여·상여·기타수당)의 코드와 과세 방식·산정 단위를 정의합니다. 상용(월급여)과 일용의 세액계산·4대보험·명세서 로직이 갈리는 기준점이며, 시간제는 월급여 종류에 산정 단위(시급)로 처리합니다.", "[데이터] pay_code(code·name·pay_kind·tax_method·calc_unit)", "[ENUM] PAY_KIND: 월급여 / 일용급여 / 상여 / 기타수당 / TAX_METHOD: 일반(간이세액) / 상여 세액계산 / 일용근로(6%) / 사업소득(3.3%) / 기타소득(8.8%) / CALC_UNIT: 월급 / 주급 / 일급 / 시급 / 건별", "[흐름] F1 흐름: PAY-01-02 → PAY-01-03 → PAY-01-04", "우선순위 P0"]}, "PAY-01-04": {"user": "소득세 간이세액표와 4대보험 요율을 관리하는 곳이에요. 매년 바뀌는 요율을 연도별로 넣어 둡니다.", "dev": ["[개요] 근로소득 간이세액표(80/100/120% 선택)와 4대보험 연도별 요율을 관리합니다. 요율은 연도별 적용기간으로 관리해 매년 변동을 반영하며, 하드코딩하지 않습니다. (구 명칭: 원천세·세액표 설정)", "[데이터] deduction_rate(rate·local_tax·ins_rate·cap·hi_upper·hi_lower)", "[흐름] F1 흐름: PAY-01-03 → PAY-01-04 → HR-04-01", "우선순위 P0"]}, "PAY-02-01": {"user": "급여를 이체할 계좌를 등록·확인하는 곳이에요.", "dev": ["[개요] 급여 이체 계좌를 등록·검증합니다. 이체파일 생성(PAY-03-04)의 계좌 정보 원천이며, 직원 본인 등록 + 관리자 검증을 병행합니다.", "[데이터] bank_account(bank·holder)", "[흐름] F9 흐름: PAY-02-03 → PAY-02-01 → TA-03-01", "우선순위 P0"]}, "PAY-02-02": {"user": "직원의 부양가족 정보를 관리하는 곳이에요. 소득세 계산과 연말정산에 쓰입니다.", "dev": ["[개요] 직원별 부양가족·인적공제 정보를 관리합니다. 간이세액표의 공제대상 가족 수·20세 이하 자녀 수 산정에 쓰이며, 연말정산 기초자료로 연계됩니다.", "[데이터] dependent(dependent)", "[흐름] F9 흐름: HR-06-02 → PAY-02-02 → PAY-02-03", "우선순위 P0"]}, "PAY-02-03": {"user": "직원별 4대보험 취득·상실과 보험료 산정 기준을 관리하는 곳이에요.", "dev": ["[개요] 직원별 4대보험 취득/상실과 산정기초(보수월액·기준소득월액)를 관리합니다. 건강·고용·산재는 보수월액, 국민연금은 기준소득월액(천원 절사·상하한)을 적용하며, 두 값이 다르면 배지로 표시됩니다. 사업장(HR-01-02) 단위로 신고되고 요율(PAY-01-04)로 개인 보험료를 산정합니다.", "[데이터] insurance_enroll(base_wage·std_monthly·enroll_status·income_tax_rate·tax_reduction)", "[ENUM] TAX_REDUCTION_TYPE: 중소기업청년(90%) / 중소기업(60세이상·장애인 70%) / 경력단절여성 / 외국인기술자 / 없음", "[흐름] F9 흐름: PAY-02-02 → PAY-02-03 → PAY-02-01", "우선순위 P0"]}, "PAY-02-04": {"user": "직원별 연봉과 급여 구성(항목별 금액)을 등록하는 곳이에요. 급여 계산의 개인 기준값이 됩니다.", "dev": ["[개요] 직원별 연봉·급여구성(항목별 금액)과 적용기간을 관리합니다. 급여 계산(PAY-03-01)의 개인 기준값이며, 적용기간 기준으로 연봉 인상 이력이 관리됩니다.", "[데이터] salary_contract(annual_amount·apply_start/apply_end) / pay_code(tax_method) / salary_comp_line(comp_id)", "[ENUM] TAX_METHOD: 일반(간이세액) / 상여 세액계산 / 일용근로(6%) / 사업소득(3.3%) / 기타소득(8.8%)", "[흐름] F1 흐름: HR-06-03 → PAY-02-04 → FRM-01", "우선순위 P0"]}, "PAY-03-01": {"user": "대상 월과 직원을 골라 급여를 계산하는 곳이에요. 지급·공제·실수령액을 산출하고 오류를 점검합니다.", "dev": ["[개요] 대상 월·대상자에 급여항목 계산식과 근태 집계·개인 공제정보를 적용해 급여를 산출하는 워크벤치입니다. 지급·공제·실수령액을 계산하고 오류를 점검합니다.", "[데이터] payroll_run(month·target_ids·list·errors)", "[흐름] F2 흐름: TA-06-02 → PAY-03-01 → PAY-03-02", "우선순위 P0"]}, "PAY-03-02": {"user": "계산한 급여를 확인하고 확정(잠금)하는 곳이에요. 확정해야 명세서·이체·대장을 만들 수 있어요.", "dev": ["[개요] 계산된 급여를 검토하고 회차를 확정(잠금)합니다. 확정 시 명세서·이체파일·급여대장의 소스가 되며, 이후 수정은 해제 후에만 가능합니다.", "[데이터] payroll_run(status)", "[흐름] F2 흐름: PAY-03-01 → PAY-03-02 → PAY-03-03", "우선순위 P0"]}, "PAY-03-03": {"user": "확정된 급여로 명세서를 만들어 직원에게 배포하고, 발행 이력을 관리하는 곳이에요.", "dev": ["[개요] 확정된 급여로 명세서를 생성·배포하고 직원이 본인 명세서를 조회합니다. 근로기준법상 필수 기재사항을 포함하며, [발행 이력·대장] 탭에서 직원×월 누적 발행·교부 이력(임금명세서 대장)을 통합 관리합니다.", "[데이터] payslip(payslip_id·delivery_channel) / payslip_line(amount)", "[흐름] F2 흐름: PAY-03-02 → PAY-03-03 → PAY-03-04", "우선순위 P0"]}, "PAY-03-04": {"user": "확정된 급여를 은행에 올릴 이체파일로 만드는 곳이에요.", "dev": ["[개요] 확정된 급여의 실지급액과 계좌로 은행 이체파일을 생성합니다. 국민은행은 CMS 펌뱅킹 포맷(고정폭 텍스트)으로 직접 연동되고, 그 외 은행은 범용 대량이체 엑셀/CSV로 내보내 각 은행 인터넷뱅킹에 업로드합니다.", "[데이터] transfer_file(bank·transfer·format)", "[흐름] F2 흐름: PAY-03-03 → PAY-03-04 → PAY-03-05", "우선순위 P0"]}, "PAY-03-05": {"user": "월 급여대장을 고용형태별로 나눠 직원별·항목별로 모아 보는 곳이에요.", "dev": ["[개요] 월 급여대장을 고용형태(정규직·계약직(기간제)·일용직)별 섹션으로 나누어 직원별·항목별로 집계 조회합니다. 확정 급여 기준으로 지급·공제·실지급을 집계하며, 리포트(구 RPT-03)에서 급여관리로 이관된 화면입니다.", "[데이터] 조회·대시보드 — 직접 테이블 매핑 없음(원천 화면 데이터 재사용)", "[흐름] F2 흐름: PAY-03-04 → PAY-03-05 → PAY-03-06", "우선순위 P0"]}, "PAY-03-06": {"user": "확정된 급여를 회계 전표(차변·대변)로 바꿔 회계프로그램으로 넘기는 곳이에요.", "dev": ["[개요] 확정 급여를 회계 분개(차변·대변)로 변환해 회계프로그램으로 전달합니다. 급여대장(PAY-03-05)을 원천으로 지급 비용·예수금·실지급액을 분개하고, 사업주 부담분(4대보험·산재)까지 포함해 전표를 생성·내보냅니다.", "[데이터] journal_voucher(dc_type/amount) / account_map(account_code/account_name)", "[흐름] F2 흐름: PAY-03-05 → PAY-03-06 → RPT-01", "우선순위 P1"]}, "PAY-04-01": {"user": "퇴직금을 계산하고 퇴직소득세를 뗀 실수령액을 산출하는 곳이에요. 원천징수영수증도 발급합니다.", "dev": ["[개요] 평균임금 기준 퇴직금을 계산하고 퇴직소득세·지방소득세를 원천징수해 실 수령액을 산출합니다. 급여·상여 지급총액 기반 산정, 중간정산·과세이연(DB/DC·IRP), 퇴직소득 원천징수영수증 발급을 지원합니다.", "[데이터] severance(avg_daily_wage·severance_pay·tax_base·income_tax·net_pay·payout_method)", "[ENUM] SEVER_PAYOUT: 본인 계좌 / IRP·퇴직연금 이전(과세이연)", "[흐름] F8 흐름: HR-04-08 → PAY-04-01 → EMP-04", "우선순위 P0 (퇴직금 계산·지급) · 원천징수영수증 발급은 P1(후속)"]}, "PAY-04-02": {"user": "연말정산 자료를 모으고 정산 세액을 계산하는 곳이에요.", "dev": ["[개요] 연말정산 자료를 수집하고 정산세액을 산출한다.", "[데이터] payslip(year_end_tax) / tax_reduction(reduction_id)", "[흐름] 독립 화면(선행/후행 업무흐름 없음 — 목록·설정·조회성)", "우선순위 P1"]}, "RPT-01": {"user": "부서별·월별 인건비를 집계해 추이와 구성비를 차트로 보는 분석 화면이에요.", "dev": ["[개요] 확정 급여를 기준으로 부서별·월별 인건비(지급총액 + 사업주 부담 4대보험)를 집계·비교하는 경영 분석 리포트입니다. 추이·구성비를 차트로 제공합니다.", "[데이터] 조회·대시보드 — 직접 테이블 매핑 없음(원천 화면 데이터 재사용)", "[흐름] F2 흐름: PAY-03-06 → RPT-01 → (끝)", "우선순위 P0"]}, "RPT-02": {"user": "부서별·월별 근무·연장·야간·휴가 사용을 집계해 보는 분석 화면이에요.", "dev": ["[개요] 확정 근태 집계를 기준으로 부서별·월별 근무·연장·야간·휴가 사용을 집계·비교하는 분석 리포트입니다. 근태집계(TA-06-02)가 마감·원천이라면 이 화면은 경영·인사 분석용 시각화입니다.", "[데이터] 조회·대시보드 — 직접 테이블 매핑 없음(원천 화면 데이터 재사용)", "[흐름] 독립 화면(선행/후행 업무흐름 없음 — 목록·설정·조회성)", "우선순위 P0"]}, "SET-01": {"user": "직원 등록·발령에서 고르는 분류 코드(직급·고용형태 등)를 관리하는 곳이에요.", "dev": ["[개요] 직원 등록·발령의 드롭다운 선택지가 되는 공통 분류 코드를 코드그룹 → 코드값(마스터-디테일)으로 관리합니다. 인사분류 계층과 고용형태·호칭 등을 포함합니다.", "[데이터] code_master(group·value·code·name·manager_id·sort_order·use_yn)", "[흐름] F1 흐름: HR-01-01 → SET-01 → HR-02-01", "우선순위 P0"]}, "SET-02": {"user": "어떤 일이 생겼을 때 누구에게 어떤 방법(이메일·알림톡)으로 알릴지 정하는 곳이에요.", "dev": ["[개요] 이벤트별로 알림 채널(이메일·알림톡)과 수신 대상을 매트릭스로 설정합니다. 운영 이벤트(계정·급여) 중심의 MVP 범위입니다.", "[데이터] notification_setting(event·channel·target·send_time·template)", "[흐름] 독립 화면(선행/후행 업무흐름 없음 — 목록·설정·조회성)", "우선순위 P0"]}, "SET-03": {"user": "회계·뱅킹 등 외부 시스템 연동을 관리하는 곳이에요.", "dev": ["[개요] 외부 시스템 연동을 목록으로 관리한다. SMB MVP는 회계·펌뱅킹의 CSV·표준 파일 연동을 기본으로 하며, API·SSO·출퇴근기기·ATS 등은 P2/문의형 애드온이다.", "[데이터] integration_config(type·method·credential·mapping·use_yn·open_api·device_integration)", "[흐름] 독립 화면(선행/후행 업무흐름 없음 — 목록·설정·조회성)", "우선순위 P2"]}, "SET-04": {"user": "세무·4대보험 같은 법정 신고 일정을 연도별로 관리하는 곳이에요. 대시보드 할 일 알림의 원본이 됩니다.", "dev": ["[개요] 세무·4대보험 등 법정 신고 일정을 연도별로 관리합니다. 관리자 대시보드(DSH-01) 할 일·알림의 '법정 일정' 소스이며, 회사 급여지급일·사업장(HR-01-02)과 결합해 실제 마감 D-day를 산출합니다.", "[데이터] tax_calendar(list·report_type·schedule·alert_timing·owner_id·site_id·use_yn)", "[ENUM] REPORT_TYPE: 원천세 / 지방소득세 / 지급명세서 / 4대보험 보수총액 / 연말정산", "[흐름] 독립 화면(선행/후행 업무흐름 없음 — 목록·설정·조회성)", "우선순위 P1"]}, "SET-05": {"user": "payDream 이용 해지를 신청하는 곳이에요. 최고관리자만 신청할 수 있어요.", "dev": ["[개요] 회사(회원사)가 payDream 서비스 이용 해지를 신청합니다. 최고관리자만 신청할 수 있으며, 신청 시 운영자 접수 후 잔여기간 정산·데이터 보존/파기 절차가 진행됩니다.", "[데이터] cancel_request(reason_code·reason_text·effective_date·req_status·data_disposal·retention_days·backup_requested·purge_due_date·purged_at)", "[ENUM] CANCEL_STATUS: 신청 / 승인 / 철회 / 완료 · DATA_DISPOSAL: 보존 후 파기 / 즉시 파기", "[흐름] F0 흐름: SET-08 → SET-05 → (끝)", "우선순위 P0"]}, "SET-06": {"user": "지금 쓰는 요금제와 다음 결제일을 확인하고 요금제를 바꾸는 곳이에요.", "dev": ["[개요] 현재 이용 중인 요금제·구독 상태·다음 결제일을 확인하고 요금제를 변경(업/다운그레이드)합니다. ※ 요금은 가안(운영 콘솔 BO-BILL-01과 동일).", "[데이터] saas_subscription(plan_code·status·next_bill_date)", "[ENUM] SUB_STATUS: 체험 / 이용중 / 연체 / 정지 / 해지예정 / 해지", "[흐름] F0 흐름: HR-06-02 → SET-06 → SET-07", "우선순위 P0"]}, "SET-07": {"user": "자동결제에 쓸 카드를 등록·변경하는 곳이에요. 카드 정보는 결제사 화면에서 입력하며 저장되지 않아요.", "dev": ["[개요] 구독료 자동결제에 사용할 결제 수단(신용·체크카드)을 등록·변경합니다. 계좌 자동이체는 P1. 결제 실패 시 D+1·3·7 자동 재시도, D+14 서비스 정지, 미납 기간 상단 안내 배너(운영 콘솔 BO-BILL-08 연동). 카드 정보는 PG 결제창에서 직접 입력하며 본 서비스에 저장되지 않습니다.", "[데이터] saas_payment_method(method_type·billing_key_enc·is_default)", "[흐름] F0 흐름: SET-06 → SET-07 → SET-08", "우선순위 P0"]}, "SET-08": {"user": "결제 내역을 확인하고 세금계산서·현금영수증을 내려받는 곳이에요.", "dev": ["[개요] 구독료 결제 내역(공급가액·부가세·합계)을 조회하고 결제 증빙(세금계산서·현금영수증)을 확인·다운로드합니다. 증빙은 운영자가 결제 건 기준으로 발급(BO-BILL-06)하며, 유형 변경·재발급은 1:1 문의(SET-09)로 요청합니다. 사업자 정보는 회사 정보(HR-01-01)를 따릅니다.", "[데이터] saas_payment(paid_at·amount_supply·amount_vat·amount_total·status·evid_type·evid_status·receipt_url)", "[ENUM] PAY_STATUS: 결제완료 / 실패 / 취소 / 환불 · EVID_STATUS: 발급대기 / 발급완료 / 미발급", "[흐름] F0 흐름: SET-07 → SET-08 → SET-05", "우선순위 P0"]}, "SET-09": {"user": "payDream 운영팀에 궁금한 점이나 오류를 문의하고 답변을 확인하는 곳이에요.", "dev": ["[개요] 회원사 관리자(최고관리자·급여 담당자)가 payDream 운영팀에 1:1 문의를 등록하고 답변·이력을 확인합니다. 운영 콘솔 1:1 문의함(BO-SUP-01)·문의 상세(BO-SUP-02)와 같은 티켓을 공유합니다. 직원 모드에는 노출하지 않습니다(직원 문의는 회사 관리자 경유).", "[데이터] support_ticket(ticket_no·category·title·status·ref_screen_id·notify_email_yn·notify_kakao_yn) · support_message(author_type·body·attachment_url)", "[ENUM] TICKET_CATEGORY: 급여 / 근태 / 구독·결제 / 계정·권한 / 기타 · TICKET_STATUS: 대기 / 처리중 / 완료 / 보류", "[흐름] SET-09 → (운영 콘솔) BO-SUP-01 → BO-SUP-02 답변 → SET-09 알림·확인", "우선순위 P0"]}, "TA-01-01": {"user": "공휴일과 회사 지정 휴일을 연간 달력으로 관리하는 곳이에요. 휴일 근무 가산과 주휴 판정의 기준이 됩니다.", "dev": ["[개요] 법정공휴일·대체공휴일·회사 지정 휴일을 연간 캘린더로 관리합니다. 휴일 근무 가산과 주휴 판정의 기준이 됩니다.", "[데이터] holiday(holiday_id·holiday_type·date)", "[ENUM] HOLIDAY_TYPE: 주휴일 / 공휴일 / 대체공휴일 / 근로자의날 / 약정휴일", "[흐름] F1 흐름: HR-02-01 → TA-01-01 → TA-01-02", "우선순위 P0"]}, "TA-01-02": {"user": "지각·조퇴·휴가 같은 근태 종류를 관리하는 곳이에요.", "dev": ["[개요] 근태 종류는 시스템 기본 마스터 + 회사 추가 종류로 관리합니다. 기본 종류는 사용여부·코드번호·유급여부(약정)·색상만 설정하고, 회사는 약정휴가·근태상태에 한해 자체 종류를 추가·수정·삭제할 수 있습니다.", "[데이터] attendance_code(att_code_id·name)", "[흐름] F1 흐름: TA-01-01 → TA-01-02 → TA-02-01", "우선순위 P0"]}, "TA-01-03": {"user": "출장 유형·일당·근무 인정 기준을 정하는 곳이에요.", "dev": ["[개요] 출장 유형·일당·근태 처리(근무 인정 여부) 기준을 정의한다.", "[데이터] code_master(trip_standard)", "[흐름] 독립 화면(선행/후행 업무흐름 없음 — 목록·설정·조회성)", "우선순위 P2"]}, "TA-02-01":     </div>

}

}

// 근무 시간표 관리 (TA-02-01)
// ═══════════════════════════════════════════════════════════════
function WorkTimeScreen() {
  const toMin = (t) => { const a = String(t).split(":"); return (+a[0]) * 60 + (+a[1] || 0); };
  const workMin = (s, e, b) => { let x = toMin(s), y = toMin(e); if (y <= x) y += 1440; return y - x - (+b || 0); };
  const fmtDur = (m) => m >= 0 ? Math.floor(m / 60) + "h " + (m % 60 < 10 ? "0" : "") + (m % 60) + "m" : "-";
  const isNight = (s, e) => { let x = toMin(s), y = toMin(e); if (y <= x) y += 1440; const ov = (a1, a2, b1, b2) => a1 < b2 && b1 < a2; return [[1320, 1440], [0, 360], [1440, 1800], [2760, 2880]].some(w => ov(x, y, w[0], w[1])); };
  const isNextDay = (s, e) => toMin(e) <= toMin(s);

  const [modal, setModal] = useState(false);
  const [st, setSt] = useState("09:00");
  const [en, setEn] = useState("18:00");
  const [br, setBr] = useState("60");
  const mWork = workMin(st, en, br);
  const mNight = isNight(st, en);

  const rows = [
    { name: "주간 (표준)", s: "09:00", e: "18:00", b: 60 },
    { name: "오전 시프트", s: "06:00", e: "14:00", b: 30 },
    { name: "오후 시프트", s: "14:00", e: "22:00", b: 60 },
    { name: "야간 시프트", s: "22:00", e: "06:00", b: 60 },
    { name: "유연근무 (코어 11–16)", s: "08:00", e: "17:00", b: 60 },
  ];
  return (
    <div className="p-5">
      <ScrHead title="근무 시간표 관리" id="TA-02-01" pri="P0" path="근태/근무 > 기준설정 > 근무 시간표 관리" desc="근무 시간대(시작·종료·휴게) 템플릿을 관리합니다. 근무시간은 (종료−시작−휴게)로 자동 계산되며, 야간(22:00~06:00) 포함 시 야간 가산 대상으로 자동 표시됩니다." />
      <div className="rounded-lg border border-gray-200 bg-white shadow-sm">
        <div className="flex flex-wrap items-center justify-between gap-2 border-b border-gray-200 px-5 py-3">
          <span className="text-sm font-semibold text-gray-700">시간표 목록</span>
          <div className="flex gap-2"><button onClick={() => setModal(true)} className="rounded-md border border-blue-500 px-3 py-1.5 text-sm font-medium text-blue-600 hover:bg-blue-50">+ 시간표 추가</button><button className="rounded-md bg-blue-600 px-3 py-1.5 text-sm font-medium text-white hover:bg-blue-700">저장</button></div>
        </div>
        <div className="overflow-x-auto">
          <table className="w-full min-w-[820px] text-left text-sm">
            <thead><tr className="border-b border-gray-200 text-xs font-semibold text-slate-500">
              <th className="px-5 py-2.5">시간표명</th><th className="px-5 py-2.5">시작</th><th className="px-5 py-2.5">종료</th><th className="px-5 py-2.5">휴게</th><th className="px-5 py-2.5">근무시간 <span className="font-normal text-gray-400">(자동)</span></th><th className="px-5 py-2.5">야간 가산</th><th className="px-5 py-2.5">사용</th><th className="px-5 py-2.5 text-right">관리</th>
            </tr></thead>
            <tbody>{rows.map((r, i) => (
              <tr key={i} className="border-b border-gray-100 hover:bg-slate-50">
                <td className="px-5 py-3 font-medium text-gray-800">{r.name}</td>
                <td className="px-5 py-3 text-gray-600">{r.s}</td>
                <td className="px-5 py-3 text-gray-600">{r.e}{isNextDay(r.s, r.e) && <span className="ml-1 text-xs text-gray-400">(익일)</span>}</td>
                <td className="px-5 py-3 text-gray-500">{r.b}분</td>
                <td className="px-5 py-3 font-medium text-gray-700">{fmtDur(workMin(r.s, r.e, r.b))}</td>
                <td className="px-5 py-3">{isNight(r.s, r.e) ? <span className="rounded bg-indigo-50 px-2 py-0.5 text-xs font-medium text-indigo-700">대상</span> : <span className="text-gray-300">—</span>}</td>
                <td className="px-5 py-3"><Toggle checked={true} /></td>
                <td className="px-5 py-3 text-right"><button onClick={() => { setSt(r.s); setEn(r.e); setBr("" + r.b); setModal(true); }} className="text-xs font-medium text-blue-600 hover:underline">수정</button></td>
              </tr>
            ))}</tbody>
          </table>
        </div>
      </div>
      <div className="mt-4 rounded-lg border-l-4 border-blue-400 bg-blue-50 px-4 py-3 text-sm text-gray-600">
        <span className="font-medium text-blue-700">근무시간은 (종료−시작−휴게)로 자동 계산</span>되어 읽기전용입니다. 종료가 시작보다 이르면 익일 종료(교대)로 처리하고, 야간(22:00~06:00) 포함 시 야간 가산 대상으로 자동 판정합니다.
      </div>
      {modal && <TreeModal title="근무 시간표 추가 / 편집" badge="TA-02-01-M1" submit="저장" onClose={() => setModal(false)}>
        <div><label className="mb-1 block font-medium text-gray-700"><span className="text-red-500">*</span>시간표명</label><input placeholder="예: 주간 (표준) · 유일" className={INP + " w-full"} /></div>
        <div><label className="mb-1 block font-medium text-gray-700"><span className="text-red-500">*</span>시작 / 종료 시각</label><div className="flex items-center gap-2"><input type="time" value={st} onChange={e => setSt(e.target.value)} className={INP + " w-full"} /><span className="text-gray-400">~</span><input type="time" value={en} onChange={e => setEn(e.target.value)} className={INP + " w-full"} /></div>{isNextDay(st, en) && <Hint>종료가 시작보다 일러 익일 종료(교대)로 처리됩니다.</Hint>}</div>
        <div><label className="mb-1 block font-medium text-gray-700">휴게시간</label><div className="flex items-center"><input value={br} onChange={e => setBr(e.target.value)} className={INP + " w-24 text-right"} /><span className="ml-1 text-sm text-gray-500">분</span></div></div>
        <div className="rounded-md border border-gray-200 bg-slate-50 p-3">
          <div className="flex items-center justify-between"><span className="text-sm text-gray-600">근무시간 <span className="text-xs text-gray-400">(자동 계산·읽기전용)</span></span><span className="text-base font-bold text-gray-800">{fmtDur(mWork)}</span></div>
          {mNight && <p className="mt-2 rounded bg-indigo-50 px-2 py-1 text-xs font-medium text-indigo-700">야간(22:00~06:00) 포함 — 야간 가산 대상입니다.</p>}
        </div>
        <div><label className="mb-1 block font-medium text-gray-700">사용여부</label><div className="flex items-center gap-2"><Toggle checked={true} /><span className="text-gray-600">사용</span></div></div>
      </TreeModal>}
    </div>
  );
}

        <span className="font-medium text-blue-700">근무제 4종</span> — 고정(소정 초과분)·탄력적(단위기간 평균)·선택적(정산기간 총량)·교대(복수 시간표). <b>시차출퇴근</b>은 별도 제도가 아니라 고정근무제의 '시차 옵션'이고, <b>재택·원격</b>은 근무 장소 속성(어떤 근무제에도 부여 가능)입니다. 고용형태는 SET-01, 가산율은 TA-02-03에서 관리하며 소정 주52h 초과 시 경고합니다.
      </div>
      {modal && <TreeModal title="근무 유형 추가 / 편집" badge="TA-02-02-M1" submit="저장" onClose={() => setModal(false)}>
        <div><label className="mb-1 block font-medium text-gray-700"><span className="text-red-500">*</span>근무유형명</label><input placeholder="예: 표준 통상근무 · 유일" className={INP + " w-full"} /></div>

      {!empMode && <button onClick={onSupport} title="1:1 문의(SET-09)" className="flex shrink-0 items-center gap-1 rounded-md px-2 py-1.5 text-sm text-gray-500 hover:bg-gray-100 hover:text-gray-700"><Ic cls="h-5 w-5" d={P("M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z")} /><span className="hidden md:inline">고객지원</span></button>}
      <div className="relative">
        <button onClick={() => setOpen(o => !o)} className="ml-1 flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-blue-600 text-sm font-semibold text-white">{EMP_PHOTOS["한지민"] ? <img src={EMP_PHOTOS["한지민"]} alt="한지민" className="h-8 w-8 rounded-full object-cover" /> : "한"}</button>
        {open && <>
          <div className="fixed inset-0 z-40" onClick={() => setOpen(false)} />
          <div className="absolute right-0 top-11 z-50 w-60 overflow-hidden rounded-lg border border-gray-200 bg-white py-1 shadow-lg">
            <div className="border-b border-gray-100 px-4 py-3">
              <p className="text-sm font-semibold text-gray-800">한지민</p>
              <p className="text-xs text-gray-400">han.jimin@company.com</p>
              <span className="mt-1 inline-block rounded bg-blue-50 px-1.5 py-0.5 text-[10px] font-medium text-blue-700">최고관리자</span>
            </div>
            <button onClick={() => { setOpen(false); onAccount(); }} className={mi + " text-blue-700"}><Ic cls="h-4 w-4" d={P("M16 7a4 4 0 11-8 0 4 4 0 018 0zM6 21v-2a4 4 0 014-4h4a4 4 0 014 4v2")} />내 계정</button>
            <button onClick={() => { setOpen(false); onCompany(); }} className={mi + " text-gray-700"}><Ic cls="h-4 w-4" d={P("M3 21h18M5 21V7l7-4 7 4v14M9 9h1m4 0h1m-6 4h1m4 0h1")} />회사 정보</button>
            <button onClick={() => setOpen(false)} className={mi + " text-gray-700"}><Ic cls="h-4 w-4" d={P("M15 17h5l-1.4-1.4A2 2 0 0118 14.2V11a6 6 0 00-12 0v3.2c0 .5-.2 1-.6 1.4L4 17h5m6 0v1a3 3 0 11-6 0v-1")} />알림 설정</button>
            <button onClick={() => setOpen(false)} className={mi + " text-red-500"}><Ic cls="h-4 w-4" d={P("M17 16l4-4m0 0l-4-4m4 4H7M13 16v1a2 2 0 01-2 2H6a2 2 0 01-2-2V7a2 2 0 012-2h5a2 2 0 012 2v1")} />로그아웃</button>
          </div>
        </>}
      </div>
    </header>
  );
}

function App() {
  const [view, setView] = useState({ domain: "대시보드", item: "DSH-01", label: "대시보드" });
  const [navOpen, setNavOpen] = useState(false);
  const [globalScr, setGlobalScr] = useState(null);
  const [publicScr, setPublicScr] = useState(null);

  const railClick = (r) => {
    setGlobalScr(null);
    if (r.domain === "placeholder") { setView({ domain: "placeholder", item: null, label: r.label }); return; }
    const nav = NAV[r.domain];
    const first = nav.groups[0].items[0].id;
    setView({ domain: r.domain, item: first, label: r.label });
  };
  const pick = (v) => { setView(v); setNavOpen(false); setGlobalScr(null); }; if(typeof window!=="undefined"){window.__nav=pick;}

  const nav = NAV[view.domain];
  const groups = nav ? nav.groups : [];
  const empMode = view.domain === "직원모드";
  const gotoDomain = d => { const n = NAV[d]; if (n) pick({ domain: d, item: n.groups[0].items[0].id, label: d }); };
  const setMode = m => { if (m === "emp") { if (!empMode) gotoDomain("직원모드"); } else { if (empMode) gotoDomain("대시보드"); } };
  // 현재 그룹 items = 탭
  const curGroup = groups.find(g => g.items.some(it => it.id === view.item)) || groups[0];
  const tabItems = curGroup ? curGroup.items : [];
  let crumbs = view.domain === "placeholder" ? [view.label] : [nav.label];
  if (curGroup) { const it = curGroup.items.find(x => x.id === view.item); crumbs = [nav.label, curGroup.title, it ? it.name : ""]; if (curGroup.title === nav.label) crumbs.splice(1, 1); }

  return (
    <div className="flex h-screen flex-col bg-slate-100 text-gray-900">
      <TopBar onMenu={() => setNavOpen(true)} onAccount={() => setGlobalScr("account")} onCompany={() => { setGlobalScr(null); setView({ domain: "설정", item: "HR-01-01", label: "설정" }); }} onSupport={() => pick({ domain: "설정", item: "SET-09", label: "설정" })} onNav={pick} empMode={empMode} onMode={setMode} />
      {publicScr === "emailAuth" && (
        <div className="fixed inset-0 z-[60] overflow-y-auto bg-slate-100">
          <div className="flex items-center justify-between border-b border-amber-200 bg-amber-50 px-4 py-2 text-xs text-amber-700">
            <span>공개 페이지 미리보기 · 초대 메일 링크로 접속하는 외부(비로그인) 화면 — 관리자 콘솔 아님</span>
            <button onClick={() => setPublicScr(null)} className="rounded border border-amber-300 px-2 py-1 font-medium hover:bg-amber-100">닫기 ✕</button>
          </div>
          <EmailAuthScreen />
        </div>
      )}
      <div className="relative flex min-h-0 flex-1">
        {navOpen && <div onClick={() => setNavOpen(false)} className="fixed inset-0 top-12 z-30 bg-black/30 lg:hidden" />}
        <div className={"z-40 flex border-r border-gray-200 bg-white transition-transform lg:static lg:z-auto lg:translate-x-0 fixed bottom-0 left-0 top-12 " + (navOpen ? "translate-x-0" : "-translate-x-full")}>
          {/* 아이콘 레일 */}
          {!empMode && (
          <div className="flex w-[74px] shrink-0 flex-col border-r border-gray-200 bg-white">
            <div className="flex-1 overflow-y-auto py-1">
              {RAIL.filter(r => NAV[r.domain]).map(r => {
                const on = view.label === r.label;
                return (
                  <button key={r.key} onClick={() => { railClick(r); setNavOpen(false); }}
                    className={"flex w-full flex-col items-center gap-1 py-2.5 text-[11px] transition-colors " + (on ? "bg-blue-50 font-medium text-blue-600" : "text-gray-500 hover:bg-gray-50")}>
                    <Ic d={ICONS[r.key]} />{r.label}
                  </button>
                );
              })}
            </div>
            <div className="border-t border-gray-100 py-2 text-center text-[11px] font-semibold text-blue-600">⚑ HR</div>
          </div>
          )}
          {/* 아이콘 레일 (직원모드) */}
          {empMode && (
          <div className="flex w-[74px] shrink-0 flex-col border-r border-gray-200 bg-white">
            <div className="flex-1 overflow-y-auto py-1">
              {groups.map((g, gi) => {
                const on = curGroup === g;
                return (
                  <button key={gi} onClick={() => { pick({ domain: "직원모드", item: g.items[0].id, label: "직원 모드" }); setNavOpen(false); }}
                    className={"flex w-full flex-col items-center gap-1 py-2.5 text-[11px] transition-colors " + (on ? "bg-blue-50 font-medium text-blue-600" : "text-gray-500 hover:bg-gray-50")}>
                    <Ic d={ICONS[GEMP[g.title] || "emp"]} />{g.title}
                  </button>
                );
              })}
            </div>
            <div className="border-t border-gray-100 py-2 text-center text-[11px] font-semibold text-blue-600">👤 나</div>
          </div>
          )}
          {/* 메뉴 트리 */}
          <aside className="w-[190px] shrink-0 overflow-y-auto bg-white py-2">
            {(empMode ? (curGroup ? [curGroup] : []) : groups).map((g, gi) => (
              <div key={gi} className="mb-2">
                <div className="flex items-center justify-between px-4 py-1.5 text-xs font-semibold text-[#059669]">{g.title}<span className="text-gray-300">▾</span></div>
                {g.items.map(it => {
                  const on = view.item === it.id;
                  return <button key={it.id} onClick={() => pick({ domain: view.domain, item: it.id, label: view.label })}
                    className={"flex w-full items-center px-5 py-1.5 text-left text-[13px] transition-colors " + (on ? "border-l-2 border-blue-600 bg-blue-50 font-medium text-blue-700" : "border-l-2 border-transparent text-gray-600 hover:bg-gray-50")}>{it.name}</button>;
                })}
              </div>
            ))}
            {view.domain === "placeholder" && <p className="px-4 py-2 text-xs text-gray-400">메뉴 준비 중</p>}
          </aside>
        </div>

        <main className="flex min-w-0 flex-1 flex-col">
          {globalScr ? (
            <div className="min-h-0 flex-1 overflow-y-auto"><MyAccountScreen /></div>
          ) : (
          <React.Fragment>
          <div className="flex h-10 shrink-0 items-center gap-1 overflow-x-auto border-b border-gray-200 bg-white px-2">
            {(tabItems.length ? tabItems : [{ id: "ph", name: view.label }]).map(t => {
              const on = view.item === t.id || t.id === "ph";
              return <button key={t.id} onClick={() => t.id !== "ph" && pick({ domain: view.domain, item: t.id, label: view.label })}
                className={"flex items-center gap-1.5 whitespace-nowrap border-b-2 px-3 py-2 text-[13px] transition-colors " + (on ? "border-blue-600 font-medium text-blue-600" : "border-transparent text-gray-500 hover:text-gray-700")}>{t.name}<span className="text-[10px] text-gray-300">⋮</span></button>;
            })}
          </div>
          <div className="flex h-9 shrink-0 items-center gap-1.5 border-b border-gray-100 bg-white px-5 text-xs text-gray-400">
            <Ic cls="h-3.5 w-3.5" d={P("M3 12l9-9 9 9M5 10v10h14V10")} />
            {crumbs.map((c, i) => <span key={i} className="flex items-center gap-1.5">{i > 0 && <span className="text-gray-300">›</span>}<span className={i === crumbs.length - 1 ? "font-medium text-gray-600" : ""}>{c}</span></span>)}
          </div>
          <div className="min-h-0 flex-1 overflow-y-auto"><Content domain={view.domain} item={view.item} label={view.label} ctx={{ openSignup: () => setPublicScr("emailAuth"), go: (item) => { setGlobalScr(null); setView({ domain: view.domain, item: item, label: view.label }); } }} /></div>
          </React.Fragment>
          )}
        </main>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
